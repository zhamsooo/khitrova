<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Наследие — сайт памяти Т.И. Хитровой</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=PT+Sans+Narrow:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .nsl-wrap{max-width:740px; margin:0 auto; padding:8vh 24px 10vh}
  .nsl-head h1{font-family:var(--font-head); font-weight:700; font-size:var(--fs-h1); line-height:1.1; text-wrap:balance; margin:0 0 10px}
  .nsl-head .sub{color:var(--muted); font-size:var(--fs-body); line-height:1.6; margin:0 0 22px; max-width:68ch; font-family:var(--font-body)}
  .write-wrap{position:relative; display:inline-block; margin-bottom:8px}

  .dropdown-write{width:320px !important}
  .dd-group-title{
    font-family:var(--font-ui); font-weight:700; font-size:var(--fs-meta);
    text-transform:uppercase; letter-spacing:.07em; color:var(--muted);
    padding:8px 10px 4px;
  }
  .dd-divider{height:1px; background:var(--line); margin:6px 0}

  .nsl-controls-bar{margin:22px 0 26px}
  .nsl-controls{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
  .nsl-chip{
    background:none; border:1px solid var(--line); color:var(--muted); cursor:pointer;
    font-size:var(--fs-ui); font-family:var(--font-ui); padding:5px 13px; border-radius:14px;
    transition:all .15s;
  }
  .nsl-chip:hover{border-color:var(--ink); color:var(--ink)}
  .nsl-chip.active{background:var(--ink); color:#fff; border-color:var(--ink)}

  .nsl-state{padding:50px 24px; text-align:center; color:var(--muted); font-size:var(--fs-body); font-family:var(--font-body)}
  .nsl-empty-block{
    padding:28px 20px; text-align:center; color:var(--muted); font-size:var(--fs-body); font-family:var(--font-body);
    background:var(--paper); border:1px dashed var(--line); border-radius:10px; margin-bottom:14px;
  }
  .nsl-section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin:32px 0 14px; padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .nsl-section-title{
    font-family:var(--font-ui); font-weight:700; font-size:var(--fs-meta);
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink); margin:0;
  }
  .nsl-section-sub{font-size:var(--fs-meta); color:var(--muted); font-family:var(--font-ui)}

  .art-card{display:block; width:100%; text-align:left; border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px; background:#fff; cursor:pointer; font:inherit; color:inherit; transition:border-color .15s, box-shadow .15s}
  .art-card:hover{border-color:var(--ink); box-shadow:0 3px 12px rgba(0,0,0,.03)}
  .art-card .badge{
    font-family:var(--font-ui); font-weight:700; font-size:var(--fs-badge); letter-spacing:.06em;
    text-transform:uppercase; color:var(--accent); display:inline-block; margin-bottom:6px;
    padding:2px 7px; border-radius:6px; background:rgba(138,106,58,.08);
  }
  .art-card .badge.badge-ti{color:var(--confirmed); background:rgba(51,84,122,.08)}
  .art-card .badge.st-draft{color:var(--muted); background:#eee}
  .art-card .badge.st-unconfirmed{color:var(--warn); background:rgba(164,100,31,.08)}
  .art-card .badge.st-rejected{color:#b0413e; background:rgba(176,65,62,.08)}
  .art-card .ti{font-family:var(--font-head); font-weight:600; font-size:var(--fs-h3); margin:0 0 6px; line-height:1.2}
  .art-card .ex{font-size:var(--fs-body); color:var(--muted); line-height:1.6; margin-bottom:8px; font-family:var(--font-body)}
  .art-card .meta{font-size:var(--fs-meta); color:var(--muted); font-family:var(--font-ui)}

  /* Панель метаданных статьи в редакторе */
  .editor-meta-box{
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:20px; display:flex; flex-direction:column; gap:12px;
  }
  .editor-meta-row{display:flex; flex-wrap:wrap; align-items:center; gap:14px}
  .editor-meta-col{flex:1; min-width:180px}
  .editor-meta-col label{
    display:block; font-size:var(--fs-meta); color:var(--muted); text-transform:uppercase;
    letter-spacing:.05em; margin-bottom:4px; font-family:var(--font-ui); font-weight:700;
  }
  .editor-meta-col input, .editor-meta-col select{
    width:100%; background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:6px 10px; font-family:var(--font-ui); font-size:var(--fs-ui); outline:none;
  }
  .editor-meta-col input:focus, .editor-meta-col select:focus{border-color:var(--ink)}
  .author-type-toggle{display:flex; gap:6px}
  .author-type-btn{
    flex:1; padding:6px 10px; font-size:var(--fs-ui); font-family:var(--font-ui); border-radius:7px;
    border:1px solid var(--line); background:#fff; cursor:pointer; text-align:center;
    transition:all .12s; color:var(--muted);
  }
  .author-type-btn:hover{color:var(--ink); border-color:var(--ink)}
  .author-type-btn.active{
    background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600;
  }

  .nsl-editor{max-width:740px; margin:0 auto; padding:24px 24px 80px}
  .nsl-editor-bar{display:flex; align-items:center; gap:14px; margin-bottom:22px; padding-bottom:14px; border-bottom:1px solid var(--line)}
  .btn-plain{background:none; border:none; color:var(--muted); font-size:var(--fs-ui); padding:0; cursor:pointer; font-family:var(--font-ui)}
  .btn-plain:hover{color:var(--ink)}
  .save-state{flex:1; font-size:var(--fs-meta); color:var(--muted); text-align:center; font-family:var(--font-ui)}
  .btn-publish{background:var(--ink); color:#fff; border:none; padding:8px 16px; border-radius:20px; font-size:var(--fs-ui); font-family:var(--font-ui); cursor:pointer}
  .art-title{width:100%; border:none; outline:none; font-family:var(--font-head); font-weight:700; font-size:var(--fs-h1); line-height:1.1; text-wrap:balance; margin-bottom:18px; color:var(--ink); background:transparent}
  .art-title::placeholder{color:var(--muted)}
  #editorjs{font-family:var(--font-body); font-size:var(--fs-body-art); line-height:1.65; max-width:68ch}

  .nsl-read{max-width:640px; margin:0 auto; padding:8vh 24px 10vh}
  .read-badge-wrap{margin-top:16px; margin-bottom:10px}
  .read-category-badge{
    font-family:var(--font-ui); font-weight:700; font-size:var(--fs-badge); letter-spacing:.06em;
    text-transform:uppercase; color:var(--accent); display:inline-block;
    padding:3px 9px; border-radius:6px; background:rgba(138,106,58,.08);
  }
  .read-category-badge.badge-ti{color:var(--confirmed); background:rgba(51,84,122,.08)}
  .nsl-read h1{font-family:var(--font-head); font-weight:700; font-size:var(--fs-h1); margin:0 0 10px; line-height:1.1; text-wrap:balance}
  .read-byline{font-size:var(--fs-meta); color:var(--muted); margin-bottom:30px; line-height:1.55; font-family:var(--font-ui)}
  .read-byline b{color:var(--ink)}

  .read-body{font-family:var(--font-body); font-size:var(--fs-body-art); line-height:1.65; color:var(--ink); max-width:68ch}
  .read-body h2{font-family:var(--font-head); font-weight:600; font-size:var(--fs-h2); line-height:1.2; margin:32px 0 12px}
  .read-body h3{font-family:var(--font-head); font-weight:600; font-size:var(--fs-h3); line-height:1.2; margin:26px 0 10px}
  .read-body h4{font-family:var(--font-head); font-weight:600; font-size:var(--fs-h3); line-height:1.2; margin:22px 0 8px}
  .read-body p{margin:0 0 18px}
  .read-body blockquote{margin:0 0 18px; padding:4px 0 4px 18px; border-left:3px solid var(--accent); color:var(--ink); font-style:italic}
  .read-body blockquote cite{display:block; font-style:normal; font-size:var(--fs-meta); color:var(--muted); margin-top:6px; font-family:var(--font-body)}
  .read-body ul, .read-body ol{margin:0 0 18px; padding-left:22px}
  .read-body table{width:100%; border-collapse:collapse; margin:0 0 18px; font-size:var(--fs-body)}
  .read-body td, .read-body th{border:1px solid var(--line); padding:8px 10px; text-align:left}
  .read-body th{background:var(--paper)}
  .read-body figure{margin:0 0 22px}
  .read-body img{width:100%; border-radius:6px; display:block}
  .read-body figcaption{font-size:var(--fs-meta); color:var(--muted); margin-top:6px; text-align:center; font-family:var(--font-body)}

  @media (max-width:640px){
    .nsl-head h1{font-size:var(--fs-h1)}
    .art-title{font-size:var(--fs-h1)}
    .nsl-read h1{font-size:var(--fs-h1)}
    .editor-meta-row{flex-direction:column; align-items:stretch}
  }
</style>
</head>
<body data-page="nasledie">

<div class="nsl-wrap" id="nslWrap">
  <div class="nsl-head">
    <h1>Наследие</h1>
    <p class="sub">Труды, статьи и интервью Татьяны Ивановны, а также воспоминания и очерки её учеников и коллег.</p>
    <div class="write-wrap">
      <button class="add-link" id="writeBtn">+ Написать</button>
    </div>
  </div>

  <div class="nsl-controls-bar">
    <div class="nsl-controls">
      <button class="nsl-chip active" data-tab="все">Все</button>
      <button class="nsl-chip" data-tab="ti">От Татьяны Ивановны</button>
      <button class="nsl-chip" data-tab="community">Воспоминания и статьи коллег</button>
    </div>
  </div>

  <div id="nslList"><div class="nsl-state">Загрузка…</div></div>
</div>

<div class="nsl-editor" id="nslEditor" style="display:none">
  <div class="nsl-editor-bar">
    <button class="btn-plain" id="btnBackToList">← К списку</button>
    <span class="save-state" id="saveState"></span>
    <button class="btn-publish" id="btnPublish">Отправить на публикацию</button>
  </div>

  <div class="editor-meta-box" id="editorMetaBox">
    <div class="editor-meta-row">
      <div class="editor-meta-col" style="flex:1.5">
        <label>Раздел / Принадлежность</label>
        <div class="author-type-toggle">
          <button type="button" class="author-type-btn" id="btnTypeTi" data-cat="ti">От Татьяны Ивановны</button>
          <button type="button" class="author-type-btn active" id="btnTypeComm" data-cat="community">От учеников и коллег</button>
        </div>
      </div>
      <div class="editor-meta-col" style="flex:1">
        <label>Тип материала</label>
        <select id="editArtType">
          <option value="статья">Статья</option>
          <option value="интервью">Интервью</option>
          <option value="публикация">Публикация</option>
          <option value="воспоминание">Воспоминание</option>
          <option value="другое">Другой материал</option>
        </select>
      </div>
    </div>
    <div class="editor-meta-row" id="tiMetaRow" style="display:none">
      <div class="editor-meta-col" style="flex:2">
        <label>Первоисточник / издание</label>
        <input type="text" id="editArtSource" placeholder="напр. Журнал «Советская музыка», 1984">
      </div>
      <div class="editor-meta-col" style="flex:1">
        <label>Год оригинала</label>
        <input type="number" id="editArtYear" placeholder="напр. 1984" min="1940" max="2026">
      </div>
    </div>
    <div class="editor-meta-row" id="commMetaRow">
      <div class="editor-meta-col">
        <label>Автор материала</label>
        <input type="text" id="editArtAuthor" placeholder="Имя и фамилия автора">
      </div>
    </div>
    <div class="editor-meta-row" id="proposeCommentRow" style="display:none">
      <div class="editor-meta-col">
        <label>Комментарий к правке (необязательно)</label>
        <input type="text" id="editProposeComment" placeholder="Пояснение для модератора: что изменили и почему">
      </div>
    </div>
  </div>

  <input type="text" id="artTitle" class="art-title" placeholder="Заголовок">
  <div id="editorjs"></div>
</div>

<div class="nsl-read" id="nslRead" style="display:none">
  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px">
    <button class="btn-plain" id="btnBackToList2">← К списку материалов</button>
    <div style="display:flex; align-items:center; gap:8px">
      <span id="readMetaSlot"></span>
      <button class="btn-plain" id="btnProposeArticle" style="display:none; color:var(--accent); font-weight:700; font-size:var(--fs-ui); font-family:var(--font-ui); border:1px solid var(--line); border-radius:14px; padding:4px 12px">✎ Предложить правку</button>
    </div>
  </div>
  <div class="read-badge-wrap">
    <span class="read-category-badge" id="readCategoryBadge"></span>
  </div>
  <h1 id="readTitle"></h1>
  <div class="read-byline" id="readByline"></div>
  <div id="readPendingAlert"></div>
  <div class="read-body" id="readBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@2.31.6"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/header@2.8.9"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/list@2.0.9"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@2.7.6"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/table@2.4.6"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/image@2.10.3"></script>
<script src="app.js"></script>
<script>
const TYPE_LABEL = {
  "воспоминание": "Воспоминание",
  "статья": "Статья",
  "интервью": "Интервью",
  "публикация": "Публикация",
  "другое": "Материал"
};
const STATUS_LABEL = { draft: "Черновик", unconfirmed: "На проверке", rejected: "Отклонено" };

let editor = null;
let currentArticleId = null;
let currentAuthorType = "community";
let dirty = false;
let saveTimer = null;
let periodicTimer = null;
let allArticles = [];
let activeTab = "все";

const elWrap = document.getElementById("nslWrap");
const elList = document.getElementById("nslList");
const elEditor = document.getElementById("nslEditor");
const elRead = document.getElementById("nslRead");
const titleInput = document.getElementById("artTitle");
const saveStateEl = document.getElementById("saveState");
const btnPublish = document.getElementById("btnPublish");

// Поля метаданных в редакторе
const btnTypeTi = document.getElementById("btnTypeTi");
const btnTypeComm = document.getElementById("btnTypeComm");
const editArtType = document.getElementById("editArtType");
const editArtSource = document.getElementById("editArtSource");
const editArtYear = document.getElementById("editArtYear");
const editArtAuthor = document.getElementById("editArtAuthor");
const tiMetaRow = document.getElementById("tiMetaRow");
const commMetaRow = document.getElementById("commMetaRow");

function showView(name){
  elWrap.style.display = name === "list" ? "block" : "none";
  elEditor.style.display = name === "editor" ? "block" : "none";
  elRead.style.display = name === "read" ? "block" : "none";
}

function getArticleCategory(a){
  if(a.author_type === "ti" || a.author_type === "community") return a.author_type;
  if(a.content && a.content.meta && a.content.meta.author_type) return a.content.meta.author_type;
  if(a.type === "интервью" || a.type === "публикация") return "ti";
  if(a.type === "воспоминание") return "community";
  return "community";
}

function getArticleBadge(a){
  const cat = getArticleCategory(a);
  const t = a.type || "статья";
  if(cat === "ti"){
    if(t === "интервью") return "Интервью с Т.И.";
    if(t === "статья") return "Статья Т.И.";
    if(t === "публикация") return "Публикация Т.И.";
    return "Труд Т.И.";
  }
  if(t === "воспоминание") return "Воспоминание";
  if(t === "статья") return "Статья о Т.И.";
  return "Материал";
}

function cardHtml(a){
  const excerpt = excerptFromContent(a.content);
  const isMine = a.status !== "confirmed";
  const cat = getArticleCategory(a);
  const badgeText = getArticleBadge(a);
  const fullBadge = isMine ? `${badgeText} · ${STATUS_LABEL[a.status] || a.status}` : badgeText;
  const badgeClass = isMine ? `st-${a.status}` : (cat === "ti" ? "badge-ti" : "");

  let metaParts = [];
  if(cat === "ti"){
    if(a.source) metaParts.push(escapeHtml(a.source));
    if(a.original_year) metaParts.push(`${a.original_year} г.`);
    if(a.created_by_name) metaParts.push(`добавил(а) ${escapeHtml(a.created_by_name)}`);
  } else {
    const author = a.author_name || a.created_by_name || "Автор неизвестен";
    metaParts.push(escapeHtml(author));
    metaParts.push(formatDate(a.created_at));
  }

  return `
    <button class="art-card" data-id="${a.id}" data-status="${a.status}">
      <span class="badge ${badgeClass}">${escapeHtml(fullBadge)}</span>
      <div class="ti">${escapeHtml(a.title || "Без названия")}</div>
      ${excerpt ? `<div class="ex">${escapeHtml(excerpt)}</div>` : ""}
      <div class="meta">${metaParts.join(" · ")}</div>
    </button>
  `;
}

function renderList(){
  const mine = currentUser ? allArticles.filter(a => a.created_by === currentUser.id && a.status !== "confirmed") : [];
  const confirmed = allArticles.filter(a => a.status === "confirmed");

  let html = "";
  if(mine.length){
    html += `
      <div class="nsl-section-head">
        <h2 class="nsl-section-title">Моё</h2>
        <span class="nsl-section-sub">Черновики и отправленные на проверку (${mine.length})</span>
      </div>
      ${mine.map(cardHtml).join("")}
    `;
  }

  const tiArticles = confirmed.filter(a => getArticleCategory(a) === "ti");
  const communityArticles = confirmed.filter(a => getArticleCategory(a) !== "ti");

  if(activeTab === "все"){
    // 1. Блок трудов и статей Т.И.
    html += `
      <div class="nsl-section-head">
        <h2 class="nsl-section-title">От Татьяны Ивановны</h2>
        <span class="nsl-section-sub">Статьи, публикации, интервью Т.И. (${tiArticles.length})</span>
      </div>
    `;
    html += tiArticles.length
      ? tiArticles.map(cardHtml).join("")
      : `<div class="nsl-empty-block">Пока нет опубликованных статей или интервью Татьяны Ивановны. Вы можете добавить первую запись через кнопку «+ Написать».</div>`;

    // 2. Блок воспоминаний и материалов от остальных
    html += `
      <div class="nsl-section-head" style="margin-top:40px">
        <h2 class="nsl-section-title">Воспоминания и статьи коллег</h2>
        <span class="nsl-section-sub">Память об учителе от учеников и коллег (${communityArticles.length})</span>
      </div>
    `;
    html += communityArticles.length
      ? communityArticles.map(cardHtml).join("")
      : `<div class="nsl-empty-block">Пока нет опубликованных воспоминаний. Станьте первым, кто поделится историей.</div>`;
  } else if(activeTab === "ti"){
    html += `
      <div class="nsl-section-head">
        <h2 class="nsl-section-title">От Татьяны Ивановны</h2>
        <span class="nsl-section-sub">Труды, статьи, публикации и интервью Т.И. (${tiArticles.length})</span>
      </div>
    `;
    html += tiArticles.length
      ? tiArticles.map(cardHtml).join("")
      : `<div class="nsl-state">В этом разделе пока нет материалов.</div>`;
  } else if(activeTab === "community"){
    html += `
      <div class="nsl-section-head">
        <h2 class="nsl-section-title">Воспоминания и статьи коллег</h2>
        <span class="nsl-section-sub">Воспоминания, очерки и исследования от учеников и коллег (${communityArticles.length})</span>
      </div>
    `;
    html += communityArticles.length
      ? communityArticles.map(cardHtml).join("")
      : `<div class="nsl-state">В этом разделе пока нет материалов.</div>`;
  }

  elList.innerHTML = html;

  elList.querySelectorAll(".art-card").forEach(card => {
    card.addEventListener("click", () => {
      const id = card.dataset.id;
      location.hash = card.dataset.status === "confirmed" ? `#read/${id}` : `#edit/${id}`;
    });
  });
}

async function loadList(){
  elList.innerHTML = `<div class="nsl-state">Загрузка…</div>`;
  let q = sb.from("articles").select("*").order("created_at", { ascending:false });
  q = currentUser ? q.or(`status.eq.confirmed,created_by.eq.${currentUser.id}`) : q.eq("status", "confirmed");
  const { data, error } = await q;
  if(error){ elList.innerHTML = `<div class="nsl-state">Ошибка загрузки: ${escapeHtml(error.message)}</div>`; return; }

  allArticles = data || [];
  renderList();
}

// Табы фильтрации
document.querySelectorAll(".nsl-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".nsl-chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    activeTab = chip.dataset.tab;
    renderList();
  });
});

const EDITOR_TOOLS = {
  header: { class: Header, inlineToolbar: true, config: { levels: [2,3,4], defaultLevel: 2 } },
  list: { class: EditorjsList, inlineToolbar: true },
  quote: { class: Quote, inlineToolbar: true },
  table: { class: Table, inlineToolbar: true },
  image: {
    class: ImageTool,
    config: {
      uploader: {
        async uploadByFile(file){
          const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
          const path = `${currentUser.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
          const { error } = await sb.storage.from("article-images").upload(path, file);
          if(error) return { success: 0 };
          const { data } = sb.storage.from("article-images").getPublicUrl(path);
          return { success: 1, file: { url: data.publicUrl } };
        },
        async uploadByUrl(url){
          return { success: 1, file: { url } };
        }
      }
    }
  }
};

function scheduleLocalSave(){
  dirty = true;
  saveStateEl.textContent = "Есть несохранённые изменения…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if(!editor) return;
    try{
      const data = await editor.save();
      const meta = {
        title: titleInput.value,
        content: data,
        author_type: currentAuthorType,
        type: editArtType.value,
        source: editArtSource.value,
        original_year: editArtYear.value,
        author_name: editArtAuthor.value,
        ts: Date.now()
      };
      localStorage.setItem("nsl_draft_" + currentArticleId, JSON.stringify(meta));
    }catch(e){}
  }, 1500);
}

async function saveToServer(){
  if(isProposalMode) return;
  if(!dirty || !editor || !currentArticleId) return;
  let data;
  try{ data = await editor.save(); } catch(e){ return; }
  const title = titleInput.value.trim();
  const source = editArtSource.value.trim() || null;
  const original_year = editArtYear.value ? parseInt(editArtYear.value, 10) : null;
  const author_name = editArtAuthor.value.trim() || (currentAuthorType === "ti" ? "Татьяна Ивановна Хитрова" : (myProfile && myProfile.full_name));

  // Сохраняем метаданные и в content.meta для обратной совместимости, и в отдельные столбцы
  data.meta = {
    author_type: currentAuthorType,
    type: editArtType.value,
    source,
    original_year,
    author_name
  };

  saveStateEl.textContent = "Сохранение…";
  const { error } = await sb.from("articles").update({
    title,
    content: data,
    author_type: currentAuthorType,
    type: editArtType.value,
    source,
    original_year,
    author_name,
    updated_at: new Date().toISOString()
  }).eq("id", currentArticleId);

  if(error){ saveStateEl.textContent = "Ошибка автосохранения: " + error.message; return; }
  dirty = false;
  saveStateEl.textContent = "Сохранено " + new Date().toLocaleTimeString("ru-RU", { hour:"2-digit", minute:"2-digit" });
  try{ localStorage.removeItem("nsl_draft_" + currentArticleId); }catch(e){}
}

async function leaveEditor(){
  clearTimeout(saveTimer);
  clearInterval(periodicTimer);
  if(!isProposalMode) await saveToServer();
  if(editor){ try{ await editor.destroy(); }catch(e){} editor = null; }
  currentArticleId = null;
  isProposalMode = false;
}

function setEditorAuthorType(cat){
  currentAuthorType = cat;
  btnTypeTi.classList.toggle("active", cat === "ti");
  btnTypeComm.classList.toggle("active", cat !== "ti");
  tiMetaRow.style.display = cat === "ti" ? "flex" : "none";
  commMetaRow.style.display = cat !== "ti" ? "flex" : "none";

  // Подстраиваем список типов под выбранную категорию
  const currentVal = editArtType.value;
  if(cat === "ti"){
    editArtType.innerHTML = `
      <option value="статья">Статья / публикация</option>
      <option value="интервью">Интервью с Т.И.</option>
      <option value="публикация">Публикация / доклад</option>
      <option value="другое">Другой материал Т.И.</option>
    `;
    if(["статья", "интервью", "публикация", "другое"].includes(currentVal)){
      editArtType.value = currentVal;
    } else {
      editArtType.value = "статья";
    }
  } else {
    editArtType.innerHTML = `
      <option value="воспоминание">Воспоминание</option>
      <option value="статья">Статья о Т.И.</option>
      <option value="другое">Другой материал</option>
    `;
    if(["воспоминание", "статья", "другое"].includes(currentVal)){
      editArtType.value = currentVal;
    } else {
      editArtType.value = "воспоминание";
    }
  }
}

btnTypeTi.addEventListener("click", () => { setEditorAuthorType("ti"); scheduleLocalSave(); });
btnTypeComm.addEventListener("click", () => { setEditorAuthorType("community"); scheduleLocalSave(); });
editArtType.addEventListener("change", scheduleLocalSave);
editArtSource.addEventListener("input", scheduleLocalSave);
editArtYear.addEventListener("input", scheduleLocalSave);
editArtAuthor.addEventListener("input", scheduleLocalSave);

async function openEditor(id, options = {}){
  const isProposal = !!options.isProposal;
  isProposalMode = isProposal;

  const { data: art, error } = await sb.from("articles").select("*").eq("id", id).maybeSingle();
  if(error || !art){ location.hash = "#list"; return; }

  if(!isProposal){
    if(art.status === "confirmed"){
      location.hash = `#propose/${id}`;
      return;
    }
    if(art.created_by !== currentUser.id && (!myProfile || !myProfile.is_moderator)){
      location.hash = "#list";
      return;
    }
  }

  currentArticleId = art.id;
  dirty = false;
  saveStateEl.textContent = "";
  titleInput.value = art.title || "";

  const initialCat = getArticleCategory(art);
  setEditorAuthorType(initialCat);

  if(art.type) editArtType.value = art.type;
  editArtSource.value = art.source || (art.content && art.content.meta && art.content.meta.source) || "";
  editArtYear.value = art.original_year || (art.content && art.content.meta && art.content.meta.original_year) || "";
  editArtAuthor.value = art.author_name || (art.content && art.content.meta && art.content.meta.author_name) || (initialCat === "ti" ? "Татьяна Ивановна Хитрова" : (myProfile && myProfile.full_name) || "");

  let initialData = (art.content && art.content.blocks) ? art.content : { blocks: [] };

  if(!isProposal){
    try{
      const raw = localStorage.getItem("nsl_draft_" + id);
      if(raw){
        const local = JSON.parse(raw);
        if(local.ts > new Date(art.updated_at).getTime() + 2000){
          if(confirm("Найден несохранённый черновик — возможно, после разрыва связи. Восстановить его вместо сохранённой версии?")){
            initialData = local.content;
            if(local.title) titleInput.value = local.title;
            if(local.author_type) setEditorAuthorType(local.author_type);
            if(local.type) editArtType.value = local.type;
            if(local.source) editArtSource.value = local.source;
            if(local.original_year) editArtYear.value = local.original_year;
            if(local.author_name) editArtAuthor.value = local.author_name;
          } else {
            localStorage.removeItem("nsl_draft_" + id);
          }
        }
      }
    }catch(e){}
  }

  document.getElementById("editorjs").innerHTML = "";
  editor = new EditorJS({
    holder: "editorjs",
    placeholder: "Начните писать…",
    data: initialData,
    tools: EDITOR_TOOLS,
    onChange: isProposal ? () => {} : scheduleLocalSave
  });
  titleInput.oninput = isProposal ? () => {} : scheduleLocalSave;

  const proposeCommentRow = document.getElementById("proposeCommentRow");
  if(isProposal){
    clearInterval(periodicTimer);
    btnBackToList.textContent = "← К материалу";
    btnBackToList.onclick = () => location.hash = `#read/${id}`;
    saveStateEl.innerHTML = `<span style="font-family:var(--font-ui); font-weight:700; font-size:var(--fs-badge); text-transform:uppercase; letter-spacing:.05em; color:var(--warn); background:rgba(164,100,31,.08); padding:3px 8px; border-radius:6px">Предложение правки</span>`;
    btnPublish.textContent = "Отправить предложение правки";
    if(proposeCommentRow) proposeCommentRow.style.display = "flex";
    document.getElementById("editProposeComment").value = "";

    btnPublish.onclick = async () => {
      btnPublish.disabled = true;
      btnPublish.textContent = "Отправка…";
      try {
        const savedBlocks = await editor.save();
        const patch = {};

        const newTitle = titleInput.value.trim();
        if(newTitle !== (art.title || "").trim()) patch.title = newTitle;

        const newAuthorType = currentAuthorType;
        if(newAuthorType !== (art.author_type || "community")) patch.author_type = newAuthorType;

        const newType = editArtType.value;
        if(newType !== (art.type || "статья")) patch.type = newType;

        const newSource = (newAuthorType === "ti" ? editArtSource.value.trim() : "") || null;
        if(newSource !== (art.source || null)) patch.source = newSource;

        const yrVal = newAuthorType === "ti" && editArtYear.value ? parseInt(editArtYear.value, 10) : null;
        if(yrVal !== (art.original_year || null)) patch.original_year = yrVal;

        const newAuthorName = (newAuthorType === "ti" ? "Татьяна Ивановна Хитрова" : editArtAuthor.value.trim()) || null;
        if(newAuthorName !== (art.author_name || null)) patch.author_name = newAuthorName;

        const oldBlocksJson = JSON.stringify((art.content && art.content.blocks) || []);
        const newBlocksJson = JSON.stringify(savedBlocks.blocks || []);
        if(oldBlocksJson !== newBlocksJson){
          patch.content = {
            blocks: savedBlocks.blocks,
            meta: { author_type: newAuthorType, type: newType, author_name: newAuthorName, source: newSource, original_year: yrVal }
          };
        }

        if(Object.keys(patch).length === 0){
          alert("Вы не внесли никаких изменений");
          btnPublish.disabled = false;
          btnPublish.textContent = "Отправить предложение правки";
          return;
        }

        const comment = (document.getElementById("editProposeComment").value || "").trim() || null;

        const { error: revErr } = await sb.from("revisions").insert({
          entity_type: "article",
          entity_id: art.id,
          kind: "update",
          patch,
          status: "pending",
          author_id: currentUser.id,
          author_name: (myProfile && myProfile.full_name) || currentUser.email || "Участник",
          comment
        });

        if(revErr) throw new Error(revErr.message);

        if(typeof showToast === "function") showToast("Правка отправлена на проверку");
        if(typeof updateModBadge === "function") updateModBadge();
        location.hash = `#read/${id}`;
      } catch(err){
        alert("Ошибка отправки: " + err.message);
        btnPublish.disabled = false;
        btnPublish.textContent = "Отправить предложение правки";
      }
    };
  } else {
    btnBackToList.textContent = "← К списку";
    btnBackToList.onclick = () => location.hash = "#list";
    if(proposeCommentRow) proposeCommentRow.style.display = "none";
    btnPublish.textContent = art.status === "rejected" ? "Отправить повторно" : "Отправить на публикацию";
    btnPublish.onclick = async () => {
      clearTimeout(saveTimer); clearInterval(periodicTimer);
      dirty = true;
      await saveToServer();
      const { error } = await sb.from("articles").update({ status: "unconfirmed" }).eq("id", currentArticleId);
      if(error){ alert(error.message); return; }
      if(typeof showToast === "function") showToast("Отправлено на публикацию");
      else alert("Отправлено на публикацию — модератор проверит, и материал появится на сайте.");
      if(typeof updateModBadge === "function") updateModBadge();
      location.hash = "#list";
    };

    clearInterval(periodicTimer);
    periodicTimer = setInterval(saveToServer, 10000);
  }

  showView("editor");
}

async function openRead(id){
  const { data: art, error } = await sb.from("articles").select("*").eq("id", id).maybeSingle();
  if(error || !art || (art.status !== "confirmed" && (!currentUser || art.created_by !== currentUser.id))){ location.hash = "#list"; return; }

  const cat = getArticleCategory(art);
  const badgeText = getArticleBadge(art);
  const badgeEl = document.getElementById("readCategoryBadge");
  badgeEl.textContent = (cat === "ti" ? "Труды Татьяны Ивановны · " : "Воспоминания и материалы · ") + badgeText;
  badgeEl.className = "read-category-badge " + (cat === "ti" ? "badge-ti" : "");

  document.getElementById("readTitle").textContent = art.title || "Без названия";

  let byline = "";
  if(cat === "ti"){
    byline = `Автор: <b>Татьяна Ивановна Хитрова</b>`;
    const src = art.source || (art.content && art.content.meta && art.content.meta.source);
    const yr = art.original_year || (art.content && art.content.meta && art.content.meta.original_year);
    if(src) byline += ` · Первоисточник: ${escapeHtml(src)}`;
    if(yr) byline += ` (${yr} г.)`;
    if(art.created_by_name) byline += ` · Опубликовал(а): ${escapeHtml(art.created_by_name)}`;
  } else {
    const author = art.author_name || (art.content && art.content.meta && art.content.meta.author_name) || art.created_by_name || "неизвестно";
    byline = `Автор: <b>${escapeHtml(author)}</b> · ${formatDate(art.created_at)}`;
    const src = art.source || (art.content && art.content.meta && art.content.meta.source);
    if(src) byline += ` · Источник: ${escapeHtml(src)}`;
  }
  document.getElementById("readByline").innerHTML = byline;
  const metaSlot = document.getElementById("readMetaSlot");
  if(metaSlot && typeof renderMetaIcon === "function"){
    metaSlot.innerHTML = renderMetaIcon("article", art.id, art);
  }
  document.getElementById("readBody").innerHTML = renderArticleContent(art.content);
  showView("read");
}

async function router(){
  if(editor && currentArticleId) await leaveEditor();
  const hash = location.hash.slice(1);
  const [route, id] = hash.split("/");
  if(route === "edit" && id){
    if(!currentUser){ location.hash = "#list"; return; }
    await openEditor(id);
  } else if(route === "read" && id){
    await openRead(id);
  } else {
    showView("list");
    await loadList();
  }
}

document.getElementById("btnBackToList").addEventListener("click", () => location.hash = "#list");
document.getElementById("btnBackToList2").addEventListener("click", () => location.hash = "#list");

const writeBtn = document.getElementById("writeBtn");
if(writeBtn){
  writeBtn.addEventListener("click", () => {
    window.openAddModal("article");
  });
}

window.addEventListener("hashchange", router);
window.addEventListener("authReady", router, { once: true });
window.addEventListener("beforeunload", () => { if(dirty && editor) saveToServer(); });
</script>
