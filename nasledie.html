<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Наследие — сайт памяти Т.И. Хитровой</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  /* Панель метаданных статьи в редакторе */
  .editor-meta-box{
    background:var(--surface-low); border:1px solid var(--outline-variant); border-radius:var(--r-m);
    padding:16px; margin-bottom:20px; display:flex; flex-direction:column; gap:12px;
  }
  .editor-meta-box .field .lbl{ background:var(--surface-low); }
  .editor-meta-row{display:flex; flex-wrap:wrap; align-items:center; gap:14px}
  .editor-meta-col{flex:1; min-width:180px}
  .author-type-toggle{display:flex; gap:6px}

  .nsl-editor{max-width:var(--container); margin:0 auto; padding:32px var(--gutter) 120px}
  .nsl-editor-bar{display:flex; align-items:center; gap:14px; margin-bottom:22px; padding-bottom:14px; border-bottom:1px solid var(--outline-variant)}
  .btn-plain{background:none; border:none; color:var(--on-surface-variant); font:var(--t-label-large); font-size:14px; padding:0; cursor:pointer}
  .btn-plain:hover{color:var(--on-surface)}
  .save-state{flex:1; font:var(--t-body-medium); font-size:13px; color:var(--on-surface-variant); text-align:center}
  .art-title{width:100%; border:none; outline:none; font:var(--t-display-small); font-size:36px; line-height:44px; margin-bottom:18px; color:var(--on-surface); background:transparent}
  .art-title::placeholder{color:var(--on-surface-variant)}
  #editorjs{font:var(--t-body-large); font-size:16px; line-height:1.65; max-width:68ch}

  .nsl-read{max-width:var(--container); margin:0 auto; padding:32px var(--gutter) 120px}
  .read-badge-wrap{margin-top:16px; margin-bottom:10px}
  .read-category-badge{
    font:var(--t-label-medium); font-size:12px;
    color:var(--primary); display:inline-block;
    padding:3px 9px; border-radius:6px; background:var(--primary-container);
  }
  .read-category-badge.badge-ti{color:var(--on-primary-container); background:var(--primary-container)}
  .nsl-read h1{font:var(--t-display-small); font-size:36px; margin:0 0 10px; line-height:44px; text-wrap:balance}
  .read-byline{font:var(--t-body-medium); font-size:14px; color:var(--on-surface-variant); margin-bottom:30px; line-height:1.55}
  .read-byline b{color:var(--on-surface)}

  .read-body{font:var(--t-body-large); font-size:16px; line-height:1.65; color:var(--on-surface); max-width:68ch}
  .read-body h2{font:var(--t-headline-small); font-size:24px; line-height:32px; margin:32px 0 12px}
  .read-body h3{font:var(--t-title-large); font-size:20px; line-height:28px; margin:26px 0 10px}
  .read-body h4{font:var(--t-title-medium); font-size:16px; line-height:24px; margin:22px 0 8px}
  .read-body p{margin:0 0 18px}
  .read-body blockquote{margin:0 0 18px; padding:4px 0 4px 18px; border-left:3px solid var(--primary); color:var(--on-surface); font-style:italic}
  .read-body blockquote cite{display:block; font-style:normal; font:var(--t-label-medium); font-size:12px; color:var(--on-surface-variant); margin-top:6px}
  .read-body ul, .read-body ol{margin:0 0 18px; padding-left:22px}
  .read-body table{width:100%; border-collapse:collapse; margin:0 0 18px; font:var(--t-body-medium); font-size:14px}
  .read-body td, .read-body th{border:1px solid var(--outline-variant); padding:8px 10px; text-align:left}
  .read-body th{background:var(--surface-high)}
  .read-body figure{margin:0 0 22px}
  .read-body img{width:100%; border-radius:var(--r-s); display:block}
  .read-body figcaption{font:var(--t-label-medium); font-size:12px; color:var(--on-surface-variant); margin-top:6px; text-align:center}

  @media (max-width:640px){
    .art-title{font-size:32px; line-height:40px}
    .nsl-read h1{font-size:32px; line-height:40px}
    .editor-meta-row{flex-direction:column; align-items:stretch}
  }

  /* ---------- M3 secondary tabs (F5) ---------- */
  .sec-tabs{
    display:flex; gap:24px; border-bottom:1px solid var(--outline-variant);
    margin-bottom:24px; overflow-x:auto; white-space:nowrap;
  }
  .sec-tab{
    position:relative; flex:none; background:none; border:0; cursor:pointer;
    padding:0 2px 14px; font:var(--t-label-large); font-size:14px; font-weight:500;
    color:var(--on-surface-variant); transition:color .15s;
  }
  .sec-tab:hover{ color:var(--on-surface); }
  .sec-tab.on{ color:var(--on-surface); }
  .sec-tab.on::after{
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--primary);
  }
</style>
</head>
<body data-page="nasledie">

<main class="page" id="nslWrap">
  <div class="nsl-head">
    <h1>Наследие</h1>
    <p class="lead">Труды, статьи и интервью Татьяны Ивановны — и воспоминания и очерки о ней её учеников и коллег.</p>
  </div>

  <div class="sec-tabs" id="nslTabs" role="tablist">
    <button type="button" class="sec-tab on" data-tab="ti" role="tab">Труды Татьяны Ивановны</button>
    <button type="button" class="sec-tab" data-tab="community" role="tab">Воспоминания и статьи о ней</button>
  </div>

  <div id="nslList"><div class="card" style="height:auto; padding:24px; text-align:center; color:var(--on-surface-variant)">Загрузка…</div></div>
</main>

<div class="nsl-editor" id="nslEditor" style="display:none">
  <div class="nsl-editor-bar">
    <button type="button" class="btn text" id="btnBackToList"><span class="sym">arrow_back</span> К списку</button>
    <span class="save-state" id="saveState"></span>
    <button type="button" class="btn text" id="btnDeleteDraft" style="display:none; color:var(--error)"><span class="sym">delete</span> Удалить черновик</button>
    <button type="button" class="btn filled" id="btnPublish">Отправить на публикацию</button>
  </div>

  <div class="editor-meta-box" id="editorMetaBox">
    <div class="editor-meta-row">
      <div class="editor-meta-col" style="flex:1.5">
        <div style="font:var(--t-label-medium); font-size:12px; color:var(--on-surface-variant); margin-bottom:8px">Раздел / Принадлежность</div>
        <div class="chips" id="authorTypeToggle">
          <button type="button" class="chip" id="btnTypeTi" data-cat="ti">От Татьяны Ивановны</button>
          <button type="button" class="chip active" id="btnTypeComm" data-cat="community"><span class="sym">check</span>От учеников и коллег</button>
        </div>
      </div>
      <div class="editor-meta-col" style="flex:1">
        <label class="field" style="margin-bottom:0">
          <select id="editArtType">
            <option value="статья">Статья</option>
            <option value="интервью">Интервью</option>
            <option value="публикация">Публикация</option>
            <option value="воспоминание">Воспоминание</option>
            <option value="другое">Другой материал</option>
          </select>
          <span class="lbl">Тип материала</span>
        </label>
      </div>
    </div>
    <div class="editor-meta-row" id="tiMetaRow" style="display:none">
      <div class="editor-meta-col" style="flex:2">
        <label class="field" style="margin-bottom:0">
          <input type="text" id="editArtSource" placeholder=" ">
          <span class="lbl">Первоисточник / издание</span>
          <span class="sup">напр. Журнал «Советская музыка», 1984</span>
        </label>
      </div>
      <div class="editor-meta-col" style="flex:1">
        <label class="field" style="margin-bottom:0">
          <input type="number" id="editArtYear" placeholder=" " min="1940" max="2026">
          <span class="lbl">Год оригинала</span>
          <span class="sup">напр. 1984</span>
        </label>
      </div>
    </div>
    <div class="editor-meta-row" id="commMetaRow">
      <div class="editor-meta-col">
        <label class="field" style="margin-bottom:0">
          <input type="text" id="editArtAuthor" placeholder=" ">
          <span class="lbl">Автор материала</span>
          <span class="sup">Имя и фамилия автора</span>
        </label>
      </div>
    </div>
    <div class="editor-meta-row" id="proposeCommentRow" style="display:none">
      <div class="editor-meta-col">
        <label class="field" style="margin-bottom:0">
          <input type="text" id="editProposeComment" placeholder=" ">
          <span class="lbl">Комментарий к правке (необязательно)</span>
          <span class="sup">Пояснение для модератора: что изменили и почему</span>
        </label>
      </div>
    </div>
  </div>

  <input type="text" id="artTitle" class="art-title" placeholder="Заголовок">
  <div id="editorjs"></div>
</div>

<div class="overlay" id="deleteDraftOverlay">
  <div class="modal" style="max-width:420px">
    <div class="modal-header dialog-appbar">
      <button type="button" class="dialog-close-btn" data-close aria-label="Закрыть"><span class="sym">close</span></button>
      <h2 class="dialog-title">Удалить черновик?</h2>
    </div>
    <div class="modal-body">
      <p id="deleteDraftText" style="font:var(--t-body-large); font-size:16px; color:var(--on-surface); margin:0 0 20px"></p>
      <div class="row-actions">
        <button type="button" class="btn text" data-close>Отмена</button>
        <button type="button" class="btn filled" id="btnConfirmDeleteDraft" style="background:var(--error)">Удалить</button>
      </div>
    </div>
  </div>
</div>

<div class="nsl-read" id="nslRead" style="display:none">
  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px">
    <button type="button" class="btn text" id="btnBackToList2"><span class="sym">arrow_back</span> К списку материалов</button>
    <div style="display:flex; align-items:center; gap:8px">
      <span id="readMetaSlot"></span>
      <button type="button" class="btn tonal" id="btnProposeArticle" style="display:none"><span class="sym">edit</span> Предложить правку</button>
    </div>
  </div>
  <div class="read-badge-wrap">
    <span class="read-category-badge" id="readCategoryBadge"></span>
  </div>
  <h1 id="readTitle"></h1>
  <div class="read-byline" id="readByline"></div>
  <div id="readPendingAlert"></div>
  <div class="read-body" id="readBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@2.31.6"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/header@2.8.9"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/list@2.0.9"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@2.7.6"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/table@2.4.6"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/image@2.10.3"></script>
<script src="app.js"></script>
<script>
const TYPE_LABEL = {
  "воспоминание": "Воспоминание",
  "статья": "Статья",
  "интервью": "Интервью",
  "публикация": "Публикация",
  "другое": "Материал"
};
const STATUS_LABEL = { draft: "Черновик", unconfirmed: "На проверке", rejected: "Отклонено" };

let editor = null;
let currentArticleId = null;
let currentAuthorType = "community";
let dirty = false;
let saveTimer = null;
let periodicTimer = null;
let allArticles = [];
let activeTab = new URLSearchParams(location.search).get("tab") === "community" ? "community" : "ti";

const elWrap = document.getElementById("nslWrap");
const elList = document.getElementById("nslList");
const elEditor = document.getElementById("nslEditor");
const elRead = document.getElementById("nslRead");
const titleInput = document.getElementById("artTitle");
const saveStateEl = document.getElementById("saveState");
const btnPublish = document.getElementById("btnPublish");

// Поля метаданных в редакторе
const btnTypeTi = document.getElementById("btnTypeTi");
const btnTypeComm = document.getElementById("btnTypeComm");
const editArtType = document.getElementById("editArtType");
const editArtSource = document.getElementById("editArtSource");
const editArtYear = document.getElementById("editArtYear");
const editArtAuthor = document.getElementById("editArtAuthor");
const tiMetaRow = document.getElementById("tiMetaRow");
const commMetaRow = document.getElementById("commMetaRow");

function showView(name){
  elWrap.style.display = name === "list" ? "block" : "none";
  elEditor.style.display = name === "editor" ? "block" : "none";
  elRead.style.display = name === "read" ? "block" : "none";
}

function getArticleCategory(a){
  if(a.author_type === "ti" || a.author_type === "community") return a.author_type;
  if(a.content && a.content.meta && a.content.meta.author_type) return a.content.meta.author_type;
  if(a.type === "интервью" || a.type === "публикация") return "ti";
  if(a.type === "воспоминание") return "community";
  return "community";
}

function getArticleBadge(a){
  const cat = getArticleCategory(a);
  const t = a.type || "статья";
  if(cat === "ti"){
    if(t === "интервью") return "Интервью с Т.И.";
    if(t === "статья") return "Статья Т.И.";
    if(t === "публикация") return "Публикация Т.И.";
    return "Труд Т.И.";
  }
  if(t === "воспоминание") return "Воспоминание";
  if(t === "статья") return "Статья о Т.И.";
  return "Материал";
}

function cardHtml(a){
  const excerpt = excerptFromContent(a.content);
  const isMine = a.status !== "confirmed";
  const cat = getArticleCategory(a);
  const badgeText = getArticleBadge(a);

  let subParts = [];
  if(cat === "ti"){
    if(a.source) subParts.push(escapeHtml(a.source));
    if(a.original_year) subParts.push(`${a.original_year} г.`);
    if(!subParts.length) subParts.push(badgeText);
  } else {
    const author = a.author_name || a.created_by_name || "";
    if(author) subParts.push(escapeHtml(author));
    subParts.push(badgeText);
  }
  const subLine = subParts.join(" · ");

  const authorWho = a.created_by_name ? escapeHtml(a.created_by_name) : "Аноним";
  const dateStr = a.created_at ? new Date(a.created_at).toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) : "";
  const metaAuthorDate = dateStr ? `${authorWho} · ${dateStr}` : authorWho;
  const statusLabel = a.status === "draft" ? "Черновик" : (a.status === "unconfirmed" ? "На проверке" : (a.status === "rejected" ? "Отклонено" : "Подтверждено"));

  return `
    <div class="card art-card ${isMine ? 'pending' : ''}" data-id="${a.id}" data-status="${a.status}" tabindex="0">
      <div class="top">
        <div style="min-width:0; flex:1">
          <div class="name">${escapeHtml(a.title || "Без названия")}</div>
          <div class="sub">${subLine}</div>
        </div>
      </div>
      ${excerpt ? `<p class="txt">${escapeHtml(excerpt)}</p>` : ""}
      <div class="meta">
        <span>${metaAuthorDate}</span>
        ${isMine ? `<span class="st">${statusLabel}</span>` : ""}
        ${(a.status === "draft" || a.status === "rejected") ? `<button type="button" class="meta-icon-btn" style="color:var(--error)" data-delete-draft="${a.id}" title="Удалить черновик" aria-label="Удалить черновик"><span class="sym">delete</span></button>` : ""}
        ${typeof renderMetaIcon === "function" ? renderMetaIcon("articles", a.id, a) : ""}
      </div>
    </div>
  `;
}

function renderList(){
  const mine = currentUser ? allArticles.filter(a => a.created_by === currentUser.id && a.status !== "confirmed") : [];
  const confirmed = allArticles.filter(a => a.status === "confirmed");

  const tabsEl = document.getElementById("nslTabs");

  let html = "";
  if(mine.length){
    html += `
      <div class="group">Моё · ${mine.length}</div>
      <div class="grid">${mine.map(cardHtml).join("")}</div>
    `;
  }

  const tiArticles = confirmed.filter(a => getArticleCategory(a) === "ti");
  const communityArticles = confirmed.filter(a => getArticleCategory(a) !== "ti");

  // Если нет подтверждённых материалов вообще — один блок-приглашение, табов нет
  if(confirmed.length === 0){
    if(tabsEl) tabsEl.style.display = "none";

    html += `
      <div class="card" style="height:auto; padding:32px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; margin:32px auto; max-width:480px;">
        <span class="sym" style="font-size:48px; color:var(--primary)">menu_book</span>
        <div style="font:var(--t-headline-small); font-size:24px; color:var(--on-surface)">Наследие</div>
        <p style="font:var(--t-body-medium); color:var(--on-surface-variant); margin:0; line-height:20px">
          Здесь будут статьи и интервью Татьяны Ивановны, а также воспоминания учеников и коллег. Станьте первым.
        </p>
        <button type="button" class="btn tonal" id="inviteAddBtn">
          <span class="sym">add</span>Добавить материал
        </button>
      </div>
    `;

    elList.innerHTML = html;

    const inviteBtn = document.getElementById("inviteAddBtn");
    if(inviteBtn){
      inviteBtn.addEventListener("click", () => {
        if(window.openAddModal) window.openAddModal("article");
      });
    }

    elList.querySelectorAll(".art-card").forEach(card => {
      card.addEventListener("click", e => {
        if(e.target.closest(".meta-icon-btn")) return;
        const id = card.dataset.id;
        location.hash = card.dataset.status === "confirmed" ? `#read/${id}` : `#edit/${id}`;
      });
    });
    elList.querySelectorAll("[data-delete-draft]").forEach(btn => {
      btn.addEventListener("click", e => {
        e.stopPropagation();
        const art = allArticles.find(a => a.id === btn.dataset.deleteDraft);
        if(art) promptDeleteDraft(art);
      });
    });
    return;
  }

  if(tabsEl){
    tabsEl.style.display = "flex";
    tabsEl.querySelectorAll(".sec-tab").forEach(t => {
      const isOn = t.dataset.tab === activeTab;
      t.classList.toggle("on", isOn);
      const count = t.dataset.tab === "ti" ? tiArticles.length : communityArticles.length;
      const label = t.dataset.tab === "ti" ? "Труды Татьяны Ивановны" : "Воспоминания и статьи о ней";
      t.textContent = `${label} · ${count}`;
    });
  }

  const activeList = activeTab === "ti" ? tiArticles : communityArticles;
  if(activeList.length){
    html += `<div class="grid">${activeList.map(cardHtml).join("")}</div>`;
  } else {
    html += `
      <div class="card" style="height:auto; padding:32px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; margin:24px auto; max-width:440px;">
        <p style="font:var(--t-body-medium); color:var(--on-surface-variant); margin:0">В этом разделе пока нет материалов.</p>
        <button type="button" class="btn tonal" id="emptyTabAddBtn">
          <span class="sym">add</span>Добавить материал
        </button>
      </div>
    `;
  }

  elList.innerHTML = html;

  const emptyTabAddBtn = document.getElementById("emptyTabAddBtn");
  if(emptyTabAddBtn){
    emptyTabAddBtn.addEventListener("click", () => openArticleAddModal(activeTab));
  }

  elList.querySelectorAll(".art-card").forEach(card => {
    card.addEventListener("click", e => {
      if(e.target.closest(".meta-icon-btn")) return;
      const id = card.dataset.id;
      location.hash = card.dataset.status === "confirmed" ? `#read/${id}` : `#edit/${id}`;
    });
  });
  elList.querySelectorAll("[data-delete-draft]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const art = allArticles.find(a => a.id === btn.dataset.deleteDraft);
      if(art) promptDeleteDraft(art);
    });
  });
}

function openArticleAddModal(presetCat){
  if(window.openAddModal) window.openAddModal("article");
  const catEl = document.getElementById("uArtCategory");
  if(catEl){
    catEl.value = presetCat === "ti" ? "ti" : "community";
    if(typeof window.updateArticleTypeOptions === "function") window.updateArticleTypeOptions();
  }
}


async function loadList(){
  elList.innerHTML = `<div class="nsl-state">Загрузка…</div>`;
  let q = sb.from("articles").select("*").order("created_at", { ascending:false });
  q = currentUser ? q.or(`status.eq.confirmed,created_by.eq.${currentUser.id}`) : q.eq("status", "confirmed");
  const { data, error } = await q;
  if(error){ elList.innerHTML = `<div class="nsl-state">Ошибка загрузки: ${escapeHtml(error.message)}</div>`; return; }

  allArticles = data || [];
  renderList();
}

// Табы «Труды Т.И. / Воспоминания и статьи о ней» — состояние в ?tab=, не в hash
function setNslFilter(tab){
  activeTab = tab === "community" ? "community" : "ti";
  const params = new URLSearchParams(location.search);
  params.set("tab", activeTab);
  history.replaceState(null, "", `${location.pathname}?${params.toString()}${location.hash}`);
  renderList();
}

document.querySelectorAll("#nslTabs .sec-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    setNslFilter(tab.dataset.tab);
  });
});

const EDITOR_TOOLS = {
  header: { class: Header, inlineToolbar: true, config: { levels: [2,3,4], defaultLevel: 2 } },
  list: { class: EditorjsList, inlineToolbar: true },
  quote: { class: Quote, inlineToolbar: true },
  table: { class: Table, inlineToolbar: true },
  image: {
    class: ImageTool,
    config: {
      uploader: {
        async uploadByFile(file){
          const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
          const path = `${currentUser.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
          const { error } = await sb.storage.from("article-images").upload(path, file);
          if(error) return { success: 0 };
          const { data } = sb.storage.from("article-images").getPublicUrl(path);
          return { success: 1, file: { url: data.publicUrl } };
        },
        async uploadByUrl(url){
          return { success: 1, file: { url } };
        }
      }
    }
  }
};

function scheduleLocalSave(){
  dirty = true;
  saveStateEl.textContent = "Есть несохранённые изменения…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if(!editor) return;
    try{
      const data = await editor.save();
      const meta = {
        title: titleInput.value,
        content: data,
        author_type: currentAuthorType,
        type: editArtType.value,
        source: editArtSource.value,
        original_year: editArtYear.value,
        author_name: editArtAuthor.value,
        ts: Date.now()
      };
      localStorage.setItem("nsl_draft_" + currentArticleId, JSON.stringify(meta));
    }catch(e){}
  }, 1500);
}

async function saveToServer(){
  if(isProposalMode) return;
  if(!dirty || !editor || !currentArticleId) return;
  let data;
  try{ data = await editor.save(); } catch(e){ return; }
  const title = titleInput.value.trim();
  const source = editArtSource.value.trim() || null;
  const original_year = editArtYear.value ? parseInt(editArtYear.value, 10) : null;
  const author_name = editArtAuthor.value.trim() || (currentAuthorType === "ti" ? "Татьяна Ивановна Хитрова" : (myProfile && myProfile.full_name));

  // Сохраняем метаданные и в content.meta для обратной совместимости, и в отдельные столбцы
  data.meta = {
    author_type: currentAuthorType,
    type: editArtType.value,
    source,
    original_year,
    author_name
  };

  saveStateEl.textContent = "Сохранение…";
  const { error } = await sb.from("articles").update({
    title,
    content: data,
    author_type: currentAuthorType,
    type: editArtType.value,
    source,
    original_year,
    author_name,
    updated_at: new Date().toISOString()
  }).eq("id", currentArticleId);

  if(error){ saveStateEl.textContent = "Ошибка автосохранения: " + error.message; return; }
  dirty = false;
  saveStateEl.textContent = "Сохранено " + new Date().toLocaleTimeString("ru-RU", { hour:"2-digit", minute:"2-digit" });
  try{ localStorage.removeItem("nsl_draft_" + currentArticleId); }catch(e){}
}

async function leaveEditor(){
  clearTimeout(saveTimer);
  clearInterval(periodicTimer);
  if(!isProposalMode) await saveToServer();
  if(editor){ try{ await editor.destroy(); }catch(e){} editor = null; }
  currentArticleId = null;
  isProposalMode = false;
}

// ---------- Удаление черновика автором (W3) ----------
let pendingDeleteArticle = null;

function promptDeleteDraft(art){
  pendingDeleteArticle = art;
  document.getElementById("deleteDraftText").textContent =
    `Удалить черновик «${art.title || "Без названия"}»? Это нельзя отменить.`;
  open_("deleteDraftOverlay");
}

function extractStoragePath(url, bucket){
  if(!url) return null;
  const marker = `/storage/v1/object/public/${bucket}/`;
  const idx = url.indexOf(marker);
  if(idx === -1) return null;
  return url.slice(idx + marker.length);
}

async function deleteArticleImages(content){
  try{
    const blocks = (content && content.blocks) || [];
    const paths = blocks
      .filter(b => b.type === "image" && b.data && b.data.file && b.data.file.url)
      .map(b => extractStoragePath(b.data.file.url, "article-images"))
      .filter(Boolean);
    if(paths.length) await sb.storage.from("article-images").remove(paths);
  }catch(e){ /* best effort — ошибку не показываем */ }
}

document.getElementById("btnConfirmDeleteDraft").addEventListener("click", async () => {
  if(!pendingDeleteArticle) return;
  const art = pendingDeleteArticle;
  const btn = document.getElementById("btnConfirmDeleteDraft");
  btn.disabled = true;
  btn.textContent = "Удаление…";
  try{
    const { error } = await sb.from("articles").delete().eq("id", art.id);
    if(error) throw new Error(error.message);
    await deleteArticleImages(art.content);
    try{ localStorage.removeItem("nsl_draft_" + art.id); }catch(e){}
    close_("deleteDraftOverlay");
    pendingDeleteArticle = null;
    if(typeof showToast === "function") showToast("Черновик удалён");
    clearTimeout(saveTimer); clearInterval(periodicTimer);
    isProposalMode = true; // не даём leaveEditor() пересохранить уже удалённую статью
    location.hash = "#list";
  }catch(e){
    alert("Не получилось удалить: " + e.message);
  }finally{
    btn.disabled = false;
    btn.textContent = "Удалить";
  }
});

function setEditorAuthorType(cat){
  currentAuthorType = cat;
  btnTypeTi.classList.toggle("active", cat === "ti");
  btnTypeComm.classList.toggle("active", cat !== "ti");
  btnTypeTi.innerHTML = (cat === "ti" ? '<span class="sym">check</span>' : '') + 'От Татьяны Ивановны';
  btnTypeComm.innerHTML = (cat !== "ti" ? '<span class="sym">check</span>' : '') + 'От учеников и коллег';
  tiMetaRow.style.display = cat === "ti" ? "flex" : "none";
  commMetaRow.style.display = cat !== "ti" ? "flex" : "none";

  // Подстраиваем список типов под выбранную категорию
  const currentVal = editArtType.value;
  if(cat === "ti"){
    editArtType.innerHTML = `
      <option value="статья">Статья / публикация</option>
      <option value="интервью">Интервью с Т.И.</option>
      <option value="публикация">Публикация / доклад</option>
      <option value="другое">Другой материал Т.И.</option>
    `;
    if(["статья", "интервью", "публикация", "другое"].includes(currentVal)){
      editArtType.value = currentVal;
    } else {
      editArtType.value = "статья";
    }
  } else {
    editArtType.innerHTML = `
      <option value="воспоминание">Воспоминание</option>
      <option value="статья">Статья о Т.И.</option>
      <option value="другое">Другой материал</option>
    `;
    if(["воспоминание", "статья", "другое"].includes(currentVal)){
      editArtType.value = currentVal;
    } else {
      editArtType.value = "воспоминание";
    }
  }
}

btnTypeTi.addEventListener("click", () => { setEditorAuthorType("ti"); scheduleLocalSave(); });
btnTypeComm.addEventListener("click", () => { setEditorAuthorType("community"); scheduleLocalSave(); });
editArtType.addEventListener("change", scheduleLocalSave);
editArtSource.addEventListener("input", scheduleLocalSave);
editArtYear.addEventListener("input", scheduleLocalSave);
editArtAuthor.addEventListener("input", scheduleLocalSave);

async function openEditor(id, options = {}){
  const isProposal = !!options.isProposal;
  isProposalMode = isProposal;

  const { data: art, error } = await sb.from("articles").select("*").eq("id", id).maybeSingle();
  if(error || !art){ location.hash = "#list"; return; }

  if(!isProposal){
    if(art.status === "confirmed"){
      location.hash = `#propose/${id}`;
      return;
    }
    if(art.created_by !== currentUser.id && (!myProfile || !myProfile.is_moderator)){
      location.hash = "#list";
      return;
    }
  }

  currentArticleId = art.id;
  dirty = false;
  saveStateEl.textContent = "";
  titleInput.value = art.title || "";

  const btnDeleteDraft = document.getElementById("btnDeleteDraft");
  if(btnDeleteDraft) btnDeleteDraft.style.display = "none";

  const initialCat = getArticleCategory(art);
  setEditorAuthorType(initialCat);

  if(art.type) editArtType.value = art.type;
  editArtSource.value = art.source || (art.content && art.content.meta && art.content.meta.source) || "";
  editArtYear.value = art.original_year || (art.content && art.content.meta && art.content.meta.original_year) || "";
  editArtAuthor.value = art.author_name || (art.content && art.content.meta && art.content.meta.author_name) || (initialCat === "ti" ? "Татьяна Ивановна Хитрова" : (myProfile && myProfile.full_name) || "");

  let initialData = (art.content && art.content.blocks) ? art.content : { blocks: [] };

  if(!isProposal){
    try{
      const raw = localStorage.getItem("nsl_draft_" + id);
      if(raw){
        const local = JSON.parse(raw);
        if(local.ts > new Date(art.updated_at).getTime() + 2000){
          if(confirm("Найден несохранённый черновик — возможно, после разрыва связи. Восстановить его вместо сохранённой версии?")){
            initialData = local.content;
            if(local.title) titleInput.value = local.title;
            if(local.author_type) setEditorAuthorType(local.author_type);
            if(local.type) editArtType.value = local.type;
            if(local.source) editArtSource.value = local.source;
            if(local.original_year) editArtYear.value = local.original_year;
            if(local.author_name) editArtAuthor.value = local.author_name;
          } else {
            localStorage.removeItem("nsl_draft_" + id);
          }
        }
      }
    }catch(e){}
  }

  document.getElementById("editorjs").innerHTML = "";
  editor = new EditorJS({
    holder: "editorjs",
    placeholder: "Начните писать…",
    data: initialData,
    tools: EDITOR_TOOLS,
    onChange: isProposal ? () => {} : scheduleLocalSave
  });
  titleInput.oninput = isProposal ? () => {} : scheduleLocalSave;

  const proposeCommentRow = document.getElementById("proposeCommentRow");
  if(isProposal){
    clearInterval(periodicTimer);
    btnBackToList.innerHTML = '<span class="sym">arrow_back</span> К материалу';
    btnBackToList.onclick = () => location.hash = `#read/${id}`;
    saveStateEl.innerHTML = `<span style="font:var(--t-label-medium); font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--tertiary); background:var(--tertiary-container); padding:3px 8px; border-radius:var(--r-xs)">Предложение правки</span>`;
    btnPublish.textContent = "Отправить предложение правки";
    if(proposeCommentRow) proposeCommentRow.style.display = "flex";
    document.getElementById("editProposeComment").value = "";

    btnPublish.onclick = async () => {
      btnPublish.disabled = true;
      btnPublish.textContent = "Отправка…";
      try {
        const savedBlocks = await editor.save();
        const patch = {};

        const newTitle = titleInput.value.trim();
        if(newTitle !== (art.title || "").trim()) patch.title = newTitle;

        const newAuthorType = currentAuthorType;
        if(newAuthorType !== (art.author_type || "community")) patch.author_type = newAuthorType;

        const newType = editArtType.value;
        if(newType !== (art.type || "статья")) patch.type = newType;

        const newSource = (newAuthorType === "ti" ? editArtSource.value.trim() : "") || null;
        if(newSource !== (art.source || null)) patch.source = newSource;

        const yrVal = newAuthorType === "ti" && editArtYear.value ? parseInt(editArtYear.value, 10) : null;
        if(yrVal !== (art.original_year || null)) patch.original_year = yrVal;

        const newAuthorName = (newAuthorType === "ti" ? "Татьяна Ивановна Хитрова" : editArtAuthor.value.trim()) || null;
        if(newAuthorName !== (art.author_name || null)) patch.author_name = newAuthorName;

        const oldBlocksJson = JSON.stringify((art.content && art.content.blocks) || []);
        const newBlocksJson = JSON.stringify(savedBlocks.blocks || []);
        if(oldBlocksJson !== newBlocksJson){
          patch.content = {
            blocks: savedBlocks.blocks,
            meta: { author_type: newAuthorType, type: newType, author_name: newAuthorName, source: newSource, original_year: yrVal }
          };
        }

        if(Object.keys(patch).length === 0){
          alert("Вы не внесли никаких изменений");
          btnPublish.disabled = false;
          btnPublish.textContent = "Отправить предложение правки";
          return;
        }

        const comment = (document.getElementById("editProposeComment").value || "").trim() || null;

        const { error: revErr } = await sb.from("revisions").insert({
          entity_type: "article",
          entity_id: art.id,
          kind: "update",
          patch,
          status: "pending",
          author_id: currentUser.id,
          author_name: (myProfile && myProfile.full_name) || currentUser.email || "Участник",
          comment
        });

        if(revErr) throw new Error(revErr.message);

        if(typeof showToast === "function") showToast("Правка отправлена на проверку");
        if(typeof updateModBadge === "function") updateModBadge();
        location.hash = `#read/${id}`;
      } catch(err){
        alert("Ошибка отправки: " + err.message);
        btnPublish.disabled = false;
        btnPublish.textContent = "Отправить предложение правки";
      }
    };
  } else {
    btnBackToList.innerHTML = '<span class="sym">arrow_back</span> К списку';
    btnBackToList.onclick = () => location.hash = "#list";
    if(proposeCommentRow) proposeCommentRow.style.display = "none";
    if(btnDeleteDraft){
      const canDelete = art.created_by === currentUser.id && (art.status === "draft" || art.status === "rejected");
      btnDeleteDraft.style.display = canDelete ? "inline-flex" : "none";
      btnDeleteDraft.onclick = () => promptDeleteDraft(art);
    }
    btnPublish.textContent = art.status === "rejected" ? "Отправить повторно" : "Отправить на публикацию";
    btnPublish.onclick = async () => {
      clearTimeout(saveTimer); clearInterval(periodicTimer);
      dirty = true;
      await saveToServer();
      const { error } = await sb.from("articles").update({ status: "unconfirmed" }).eq("id", currentArticleId);
      if(error){ alert(error.message); return; }
      if(typeof showToast === "function") showToast("Отправлено на публикацию");
      else alert("Отправлено на публикацию — модератор проверит, и материал появится на сайте.");
      if(typeof updateModBadge === "function") updateModBadge();
      location.hash = "#list";
    };

    clearInterval(periodicTimer);
    periodicTimer = setInterval(saveToServer, 10000);
  }

  showView("editor");
}

async function openRead(id){
  const { data: art, error } = await sb.from("articles").select("*").eq("id", id).maybeSingle();
  if(error || !art || (art.status !== "confirmed" && (!currentUser || art.created_by !== currentUser.id))){ location.hash = "#list"; return; }

  const cat = getArticleCategory(art);
  const badgeText = getArticleBadge(art);
  const badgeEl = document.getElementById("readCategoryBadge");
  badgeEl.textContent = (cat === "ti" ? "Труды Татьяны Ивановны · " : "Воспоминания и материалы · ") + badgeText;
  badgeEl.className = "read-category-badge " + (cat === "ti" ? "badge-ti" : "");

  document.getElementById("readTitle").textContent = art.title || "Без названия";

  let byline = "";
  if(cat === "ti"){
    byline = `Автор: <b>Татьяна Ивановна Хитрова</b>`;
    const src = art.source || (art.content && art.content.meta && art.content.meta.source);
    const yr = art.original_year || (art.content && art.content.meta && art.content.meta.original_year);
    if(src) byline += ` · Первоисточник: ${escapeHtml(src)}`;
    if(yr) byline += ` (${yr} г.)`;
    if(art.created_by_name) byline += ` · Опубликовал(а): ${escapeHtml(art.created_by_name)}`;
  } else {
    const author = art.author_name || (art.content && art.content.meta && art.content.meta.author_name) || art.created_by_name || "неизвестно";
    byline = `Автор: <b>${escapeHtml(author)}</b> · ${formatDate(art.created_at)}`;
    const src = art.source || (art.content && art.content.meta && art.content.meta.source);
    if(src) byline += ` · Источник: ${escapeHtml(src)}`;
  }
  document.getElementById("readByline").innerHTML = byline;
  const metaSlot = document.getElementById("readMetaSlot");
  if(metaSlot && typeof renderMetaIcon === "function"){
    metaSlot.innerHTML = renderMetaIcon("article", art.id, art);
  }
  const proposeBtn = document.getElementById("btnProposeArticle");
  if(proposeBtn){
    if(currentUser){
      proposeBtn.style.display = "inline-flex";
      proposeBtn.onclick = () => { location.hash = `#propose/${art.id}`; };
    } else {
      proposeBtn.style.display = "none";
    }
  }
  document.getElementById("readBody").innerHTML = renderArticleContent(art.content);
  showView("read");
}

async function router(){
  if(editor && currentArticleId) await leaveEditor();
  const hash = location.hash.slice(1);
  const [route, id] = hash.split("/");
  if(route === "edit" && id){
    if(!currentUser){ location.hash = "#list"; return; }
    await openEditor(id);
  } else if(route === "propose" && id){
    if(!currentUser){ location.hash = "#list"; return; }
    await openEditor(id, { isProposal: true });
  } else if(route === "read" && id){
    await openRead(id);
  } else {
    showView("list");
    await loadList();
  }
}

document.getElementById("btnBackToList").addEventListener("click", () => location.hash = "#list");
document.getElementById("btnBackToList2").addEventListener("click", () => location.hash = "#list");

const writeBtn = document.getElementById("writeBtn");
if(writeBtn){
  writeBtn.addEventListener("click", () => {
    window.openAddModal("article");
  });
}

window.addEventListener("hashchange", router);
window.addEventListener("authReady", router, { once: true });
window.addEventListener("beforeunload", () => { if(dirty && editor) saveToServer(); });
</script>
