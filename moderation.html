<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Модерация — сайт памяти Т.И. Хитровой</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=PT+Sans+Narrow:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .mod-wrap{max-width:680px; margin:0 auto; padding:40px 24px 60px}
  .mod-wrap h1{font-family:var(--font-head); font-weight:700; font-size:var(--fs-h1); line-height:1.1; text-wrap:balance; margin:0 0 6px}
  .mod-wrap .sub{color:var(--muted); font-size:var(--fs-meta); font-family:var(--font-ui); margin-bottom:28px; line-height:1.5}
  .mod-section-title{
    font-family:var(--font-ui); font-weight:700; font-size:var(--fs-meta); letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); margin:32px 0 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .mod-section-count{
    font-size:var(--fs-badge); background:var(--paper); border:1px solid var(--line);
    padding:1px 8px; border-radius:10px; color:var(--ink); font-family:var(--font-ui);
  }

  .mod-state{padding:30px 24px; text-align:center; color:var(--muted); font-size:var(--fs-body); font-family:var(--font-body); background:#fff; border:1px dashed var(--line); border-radius:10px}

  .mod-card{border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:16px; background:#fff; transition:border-color .15s}
  .mod-card:hover{border-color:#d4d1ca}
  .mod-card .yr{font-family:var(--font-ui); font-weight:700; font-size:var(--fs-ui); color:var(--accent); letter-spacing:.03em; text-transform:uppercase}
  .mod-card .ti{font-family:var(--font-head); font-weight:600; font-size:var(--fs-h3); line-height:1.2; margin:4px 0 8px; color:var(--ink)}
  .mod-card .de{font-size:var(--fs-body); color:var(--ink); line-height:1.6; margin-bottom:10px; font-family:var(--font-body)}
  .mod-card .meta{font-size:var(--fs-meta); color:var(--muted); margin-bottom:12px; line-height:1.6; font-family:var(--font-ui)}
  .mod-card .meta a{color:var(--accent)}
  .mod-card .meta b{color:var(--ink)}

  .mod-card textarea.mod-note{
    width:100%; background:var(--paper); border:1px solid var(--line); color:var(--ink);
    padding:8px 10px; border-radius:8px; font-family:var(--font-ui); font-size:var(--fs-ui); min-height:48px; resize:vertical; margin-bottom:12px;
  }

  .mod-card .row{display:flex; gap:8px; flex-wrap:wrap}
  .mod-card button{
    flex:1; min-width:120px; border:none; border-radius:8px; padding:9px 12px; font-size:var(--fs-ui); cursor:pointer;
    font-family:var(--font-ui); font-weight:600; transition:background .15s, border-color .15s, opacity .15s;
  }
  .mod-card .btn-confirm{background:var(--confirmed); color:#fff}
  .mod-card .btn-confirm:hover{opacity:.9}
  .mod-card .btn-edit-toggle{background:#fff; border:1px solid var(--line); color:var(--ink)}
  .mod-card .btn-edit-toggle:hover{border-color:var(--ink)}
  .mod-card .btn-reject{background:#fff; border:1px solid #b0413e; color:#b0413e}
  .mod-card .btn-reject:hover{background:rgba(176,65,62,.06)}
  .mod-card .btn-save-confirm{background:var(--confirmed); color:#fff}
  .mod-card .btn-save-confirm:hover{opacity:.9}
  .mod-card .btn-save-only{background:#fff; border:1px solid var(--ink); color:var(--ink)}
  .mod-card .btn-edit-cancel{background:#fff; border:1px solid var(--line); color:var(--muted)}
  .mod-card .btn-edit-cancel:hover{color:var(--ink); border-color:var(--ink)}

  .mod-card .err{color:#b0413e; font-size:var(--fs-meta); font-family:var(--font-ui); margin-top:8px; display:none}

  /* Inline edit mode inside mod-card */
  .card-edit{margin-top:12px; padding-top:14px; border-top:1px solid var(--line)}
  .edit-field{margin-bottom:10px}
  .edit-field label{display:block; font-size:var(--fs-meta); color:var(--muted); margin-bottom:4px; font-weight:600; font-family:var(--font-ui)}
  .edit-field input[type="text"], .edit-field input[type="number"], .edit-field select, .edit-field textarea{
    width:100%; background:var(--paper); border:1px solid var(--line); color:var(--ink);
    padding:8px 10px; border-radius:8px; font-family:var(--font-ui); font-size:var(--fs-ui); outline:none;
  }
  .edit-field input:focus, .edit-field select:focus, .edit-field textarea:focus{
    border-color:var(--ink); background:#fff;
  }
  .edit-field textarea{resize:vertical; min-height:55px}

  .edit-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  @media(max-width:540px){ .edit-grid{grid-template-columns:1fr} }

  .edit-study-wrap{
    background:var(--paper); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; margin:10px 0;
  }
  .edit-study-wrap .legend{
    font-size:var(--fs-badge); font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); margin-bottom:6px; font-family:var(--font-ui);
  }

  .mod-card .btn-toggle{
    flex:none; width:auto; background:none; border:none; color:var(--accent); font-family:var(--font-ui);
    font-weight:400; text-decoration:underline; padding:0; margin-bottom:10px; font-size:var(--fs-meta); cursor:pointer;
  }
  .art-preview{font-family:var(--font-body); font-size:var(--fs-body); line-height:1.65; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px}
  .art-preview h2{font-family:var(--font-head); font-weight:600; font-size:var(--fs-h2); line-height:1.2; margin:14px 0 8px}
  .art-preview h3{font-family:var(--font-head); font-weight:600; font-size:var(--fs-h3); line-height:1.2; margin:12px 0 6px}
  .art-preview p{margin:0 0 10px}
  .art-preview blockquote{margin:0 0 10px; padding:2px 0 2px 12px; border-left:3px solid var(--accent); font-style:italic}
  .art-preview table{width:100%; border-collapse:collapse; margin:0 0 10px; font-size:var(--fs-meta); font-family:var(--font-body)}
  .art-preview td, .art-preview th{border:1px solid var(--line); padding:5px 7px}
  .art-preview img{max-width:100%; border-radius:6px}

  .art-editor-link{
    display:inline-block; font-size:var(--fs-meta); font-family:var(--font-ui); color:var(--accent); text-decoration:none;
    margin-bottom:10px; font-weight:600;
  }
  .art-editor-link:hover{text-decoration:underline}

  /* Revisions */
  .rev-header{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; flex-wrap:wrap}
  .rev-badge{
    display:inline-block; font-size:var(--fs-badge); font-family:var(--font-ui); font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    padding:2px 8px; border-radius:12px;
  }
  .rev-badge-person{background:#eef2ff; color:#3730a3; border:1px solid #c7d2fe}
  .rev-badge-event{background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0}
  .rev-badge-article{background:#fef3c7; color:#92400e; border:1px solid #fde68a}

  .rev-entity-link{
    font-family:var(--font-head); font-weight:600; font-size:var(--fs-h3); color:var(--ink); text-decoration:none;
    display:inline-block; margin-bottom:6px;
  }
  .rev-entity-link:hover{color:var(--accent); text-decoration:underline}

  .rev-comment{
    background:var(--paper); border-left:3px solid var(--accent); padding:8px 12px;
    font-size:var(--fs-meta); font-family:var(--font-body); margin:8px 0 12px; border-radius:0 6px 6px 0; color:var(--ink);
    line-height:1.5;
  }

  .rev-diff-table{
    width:100%; border-collapse:collapse; margin:10px 0 14px; font-size:var(--fs-meta); font-family:var(--font-ui);
    background:var(--paper); border:1px solid var(--line); border-radius:8px; overflow:hidden;
  }
  .rev-diff-table th, .rev-diff-table td{
    padding:6px 10px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line);
  }
  .rev-diff-table th{
    font-size:var(--fs-badge); font-family:var(--font-ui); font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); background:#faf8f5;
  }
  .rev-diff-table tr:last-child td{border-bottom:none}
  .rev-diff-old{color:#b0413e; word-break:break-word}
  .rev-diff-new{color:#2a7a4c; font-weight:600; word-break:break-word}
</style>
</head>
<body data-page="moderation">

<div class="mod-wrap">
  <h1>Модерация</h1>
  <div class="sub">События, люди и материалы «Наследия», предложенные читателями, — отредактируйте неточности при необходимости и подтвердите или отклоните.</div>
  <div id="modGate"><div class="mod-state">Проверяем доступ…</div></div>
  <div id="modBody" style="display:none">
    <div class="mod-section-title">
      <span>Правки к записям</span>
      <span class="mod-section-count" id="countRevisions">0</span>
    </div>
    <div id="modRevisions"><div class="mod-state">Загрузка…</div></div>

    <div class="mod-section-title">
      <span>События на таймлайн</span>
      <span class="mod-section-count" id="countEvents">0</span>
    </div>
    <div id="modEvents"><div class="mod-state">Загрузка…</div></div>

    <div class="mod-section-title">
      <span>Люди на проверке</span>
      <span class="mod-section-count" id="countPeople">0</span>
    </div>
    <div id="modPeople"><div class="mod-state">Загрузка…</div></div>

    <div class="mod-section-title">
      <span>Материалы «Наследия»</span>
      <span class="mod-section-count" id="countArticles">0</span>
    </div>
    <div id="modArticles"><div class="mod-state">Загрузка…</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="app.js"></script>
<script>
const ART_TYPE_LABEL = { "воспоминание":"Воспоминание", "статья":"Статья", "интервью":"Интервью", "публикация":"Публикация", "другое":"Материал" };

function formatSourceLink(s){
  if(!s) return "";
  if(/^https?:\/\//.test(s)){
    return `<a href="${escapeHtml(s)}" target="_blank" rel="noopener">${escapeHtml(s)}</a>`;
  }
  return escapeHtml(s);
}

async function initModeration(){
  const gate = document.getElementById("modGate");
  const body = document.getElementById("modBody");

  if(!currentUser){
    gate.innerHTML = `<div class="mod-state">Эта страница только для модераторов. <a href="#" onclick="document.getElementById('btnAuth').click(); return false;" style="color:var(--accent)">Войдите</a>, чтобы проверить доступ.</div>`;
    return;
  }
  if(!myProfile || !myProfile.is_moderator){
    gate.innerHTML = `<div class="mod-state">Эта страница только для модераторов.</div>`;
    return;
  }
  gate.style.display = "none";
  body.style.display = "block";

  loadRevisions();
  loadEvents();
  loadPeople();
  loadArticles();
}

// -------------------- 0. ПРАВКИ К ЗАПИСЯМ --------------------
const FIELD_LABELS = {
  // people
  full_name: "Имя и фамилия",
  gender: "Пол",
  relation_type: "Отношение к Т.И.",
  studied_choir_school: "Училище им. Глинки",
  choir_school_start: "Училище (начало)",
  choir_school_end: "Выпуск училища",
  studied_conservatory: "Консерватория",
  conservatory_start: "Консерватория (начало)",
  conservatory_end: "Выпуск консерватории",
  studied_assistantship: "Ассистентура",
  assistantship_start: "Ассистентура (начало)",
  assistantship_end: "Окончание ассистентуры",
  study_start: "Годы учёбы (начало)",
  study_end: "Годы учёбы (окончание)",
  institution: "Место работы / должность",
  notes: "Заметки / биография",
  source: "Источник / ссылка",
  avatar_url: "Фотография",
  verification_hidden: "Скрыть верификацию",
  // events
  event_year: "Год события",
  title: "Название",
  description: "Описание события",
  // articles
  type: "Тип материала",
  author_type: "Раздел авторства",
  author_name: "Имя автора",
  original_year: "Год первоисточника",
  content: "Текст статьи",
  cover_image_url: "Обложка"
};

function formatDiffVal(field, val){
  if(val === null || val === undefined || val === "") return '<i style="color:var(--muted)">—</i>';
  if(typeof val === "boolean") return val ? "Да" : "Нет";
  if(field === "gender"){
    if(val === "m") return "Мужской";
    if(val === "f") return "Женский";
  }
  if(field === "relation_type"){
    if(val === "ученик") return "Ученик / Ученица";
    if(val === "коллега") return "Коллега";
    if(val === "другое") return "Другое";
  }
  if(field === "author_type"){
    if(val === "ti") return "От Т.И. Хитровой";
    if(val === "community") return "От учеников и коллег";
  }
  if(field === "type" && ART_TYPE_LABEL[val]){
    return ART_TYPE_LABEL[val];
  }
  if(field === "content"){
    if(typeof val === "object"){
      const bCount = (val.blocks && val.blocks.length) || 0;
      return `[Статья: ${bCount} блоков]`;
    }
  }
  return escapeHtml(String(val));
}

async function loadRevisions(){
  const content = document.getElementById("modRevisions");
  const countEl = document.getElementById("countRevisions");
  const { data: revs, error } = await sb
    .from("revisions")
    .select("*")
    .eq("status", "pending")
    .order("created_at", { ascending: true });

  if(error){
    content.innerHTML = `<div class="mod-state">Ошибка загрузки: ${escapeHtml(error.message)}</div>`;
    return;
  }

  countEl.textContent = revs ? revs.length : 0;
  if(!revs || !revs.length){
    content.innerHTML = `<div class="mod-state">Пока пусто — предложений правок на проверке нет.</div>`;
    return;
  }

  // Загружаем исходные записи для отображения старых значений и заголовков
  const evIds = [...new Set(revs.filter(r => r.entity_type === "event").map(r => r.entity_id))];
  const peoIds = [...new Set(revs.filter(r => r.entity_type === "person").map(r => r.entity_id))];
  const artIds = [...new Set(revs.filter(r => r.entity_type === "article").map(r => r.entity_id))];

  const [evRes, peoRes, artRes] = await Promise.all([
    evIds.length ? sb.from("events").select("*").in("id", evIds) : { data: [] },
    peoIds.length ? sb.from("people").select("*").in("id", peoIds) : { data: [] },
    artIds.length ? sb.from("articles").select("*").in("id", artIds) : { data: [] }
  ]);

  const evMap = new Map((evRes.data || []).map(e => [e.id, e]));
  const peoMap = new Map((peoRes.data || []).map(p => [p.id, p]));
  const artMap = new Map((artRes.data || []).map(a => [a.id, a]));

  content.innerHTML = revs.map(r => {
    let target = null;
    let entityLabel = "";
    let entityUrl = "#";
    let entityBadgeClass = "";

    if(r.entity_type === "person"){
      target = peoMap.get(r.entity_id);
      entityLabel = target ? target.full_name : "Карточка человека";
      entityUrl = `person.html?id=${encodeURIComponent(r.entity_id)}`;
      entityBadgeClass = "rev-badge-person";
    } else if(r.entity_type === "event"){
      target = evMap.get(r.entity_id);
      entityLabel = target ? `${target.event_year} г. — ${target.title}` : "Событие на таймлайне";
      entityUrl = "index.html";
      entityBadgeClass = "rev-badge-event";
    } else if(r.entity_type === "article"){
      target = artMap.get(r.entity_id);
      entityLabel = target ? target.title : "Материал «Наследия»";
      entityUrl = `nasledie.html#read/${encodeURIComponent(r.entity_id)}`;
      entityBadgeClass = "rev-badge-article";
    }

    const typeBadgeText = r.entity_type === "person" ? "Человек" : r.entity_type === "event" ? "Событие" : "Материал «Наследия»";

    // Собираем список изменённых полей
    const patch = r.patch || {};
    const patchKeys = Object.keys(patch);
    let diffRows = "";
    let hasArticleContent = false;

    if(!patchKeys.length){
      diffRows = `<tr><td colspan="3" style="text-align:center; color:var(--muted)">Нет изменённых полей</td></tr>`;
    } else {
      diffRows = patchKeys.map(k => {
        const oldVal = target ? target[k] : undefined;
        const newVal = patch[k];
        if(k === "content" && newVal && typeof newVal === "object") hasArticleContent = true;
        return `
          <tr>
            <td><b>${escapeHtml(FIELD_LABELS[k] || k)}</b></td>
            <td class="rev-diff-old">${formatDiffVal(k, oldVal)}</td>
            <td class="rev-diff-new">${formatDiffVal(k, newVal)}</td>
          </tr>
        `;
      }).join("");
    }

    return `
      <div class="mod-card" data-rev-id="${r.id}">
        <div class="rev-header">
          <span class="rev-badge ${entityBadgeClass}">${typeBadgeText}</span>
          <div style="display:flex; align-items:center; gap:6px">
            <span style="font-size:var(--fs-meta); color:var(--muted)">${formatDate(r.created_at)}</span>
            ${typeof renderMetaIcon === "function" ? renderMetaIcon(r.entity_type, r.entity_id, target || r) : ""}
          </div>
        </div>
        <div>
          <a href="${entityUrl}" target="_blank" class="rev-entity-link">${escapeHtml(entityLabel)} ↗</a>
        </div>
        <div class="meta">
          Предложил(а): <b>${escapeHtml(r.author_name || "неизвестно")}</b>
        </div>
        ${r.comment ? `<div class="rev-comment"><b>Комментарий к правке:</b> ${escapeHtml(r.comment)}</div>` : ""}

        <table class="rev-diff-table">
          <thead>
            <tr>
              <th style="width:28%">Поле</th>
              <th style="width:36%">Текущее значение</th>
              <th style="width:36%">Предлагаемое значение</th>
            </tr>
          </thead>
          <tbody>
            ${diffRows}
          </tbody>
        </table>

        ${hasArticleContent ? `
          <button type="button" class="btn-toggle" data-toggle-rev-content>Показать текст статьи из правки</button>
          <div class="art-preview" style="display:none"></div>
        ` : ""}

        <textarea class="mod-note" placeholder="Заметка автору (необязательно) — сохранится в истории ревизии"></textarea>
        <div class="row">
          <button type="button" class="btn-confirm btn-apply-rev">Применить правку</button>
          <button type="button" class="btn-reject btn-reject-rev">Отклонить</button>
        </div>
        <div class="err"></div>
      </div>
    `;
  }).join("");

  content.querySelectorAll(".mod-card").forEach(card => {
    const revId = card.dataset.revId;
    const rev = revs.find(r => r.id === revId);
    const noteEl = card.querySelector(".mod-note");
    const errEl = card.querySelector(".err");
    const btnApply = card.querySelector(".btn-apply-rev");
    const btnReject = card.querySelector(".btn-reject-rev");

    // Collapsible preview for article content if present
    const toggleBtn = card.querySelector("[data-toggle-rev-content]");
    const previewEl = card.querySelector(".art-preview");
    if(toggleBtn && previewEl && rev && rev.patch && rev.patch.content){
      toggleBtn.addEventListener("click", () => {
        const isHidden = previewEl.style.display === "none";
        if(isHidden && !previewEl.innerHTML){
          previewEl.innerHTML = (window.renderArticleContent ? window.renderArticleContent(rev.patch.content) : "") || "<p><i>Пусто</i></p>";
        }
        previewEl.style.display = isHidden ? "block" : "none";
        toggleBtn.textContent = isHidden ? "Скрыть текст статьи из правки" : "Показать текст статьи из правки";
      });
    }

    async function handleAction(action){
      errEl.style.display = "none";
      btnApply.disabled = true;
      btnReject.disabled = true;
      const note = noteEl.value.trim() || null;
      const rpcName = action === "apply" ? "apply_revision" : "reject_revision";

      const { error } = await sb.rpc(rpcName, { revision_id: revId, note });
      if(error){
        errEl.textContent = "Ошибка: " + error.message;
        errEl.style.display = "block";
        btnApply.disabled = false;
        btnReject.disabled = false;
        return;
      }

      card.remove();
      const rem = content.querySelectorAll(".mod-card").length;
      countEl.textContent = rem;
      if(window.updateModBadge) window.updateModBadge();
      if(!rem){
        content.innerHTML = `<div class="mod-state">Пока пусто — предложений правок на проверке нет.</div>`;
      }
    }

    btnApply.addEventListener("click", () => handleAction("apply"));
    btnReject.addEventListener("click", () => handleAction("reject"));
  });
}

// -------------------- 1. СОБЫТИЯ --------------------
async function loadEvents(){
  const content = document.getElementById("modEvents");
  const countEl = document.getElementById("countEvents");
  const { data, error } = await sb.from("events").select("*").eq("status", "unconfirmed").order("created_at");
  if(error){ content.innerHTML = `<div class="mod-state">Ошибка загрузки: ${escapeHtml(error.message)}</div>`; return; }

  countEl.textContent = data ? data.length : 0;
  if(!data || !data.length){

    return;
  }

  content.innerHTML = data.map(e => `
    <div class="mod-card" data-id="${e.id}">
      <div class="card-view">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px">
          <div>
            <div class="yr">${e.event_year} г.</div>
            <div class="ti">${escapeHtml(e.title)}</div>
          </div>

        </div>
        ${e.description ? `<div class="de">${escapeHtml(e.description)}</div>` : ""}
        <div class="meta">
          Добавил(а): <b>${escapeHtml(e.created_by_name || "неизвестно")}</b> · ${formatDate(e.created_at)}
          ${e.source ? `<br>Источник: ${formatSourceLink(e.source)}` : ""}
        </div>
        <textarea class="mod-note" placeholder="Заметка автору (необязательно) — особенно полезна при отклонении"></textarea>
        <div class="row">
          <button type="button" class="btn-confirm">Подтвердить</button>
          <button type="button" class="btn-edit-toggle">✎ Редактировать</button>
          <button type="button" class="btn-reject">Отклонить</button>
        </div>
      </div>

      <div class="card-edit" style="display:none">
        <div class="edit-field">
          <label>Год события</label>
          <input type="number" class="in-ev-year" value="${e.event_year}">
        </div>
        <div class="edit-field">
          <label>Название события</label>
          <input type="text" class="in-ev-title" value="${escapeHtml(e.title)}">
        </div>
        <div class="edit-field">
          <label>Описание</label>
          <textarea class="in-ev-desc">${escapeHtml(e.description || "")}</textarea>
        </div>
        <div class="edit-field">
          <label>Источник / ссылка</label>
          <input type="text" class="in-ev-source" value="${escapeHtml(e.source || "")}">
        </div>
        <div class="row" style="margin-top:12px">
          <button type="button" class="btn-save-confirm">Сохранить и подтвердить</button>
          <button type="button" class="btn-save-only">Сохранить правки</button>
          <button type="button" class="btn-edit-cancel">Отмена</button>
        </div>
      </div>
      <div class="err"></div>
    </div>
  `).join("");

  content.querySelectorAll(".mod-card").forEach(card => {
    const id = card.dataset.id;
    const viewEl = card.querySelector(".card-view");
    const editEl = card.querySelector(".card-edit");
    const noteEl = card.querySelector(".mod-note");
    const errEl = card.querySelector(".err");

    // Переключение режимов
    card.querySelector(".btn-edit-toggle").addEventListener("click", () => {
      viewEl.style.display = "none";
      editEl.style.display = "block";
    });
    card.querySelector(".btn-edit-cancel").addEventListener("click", () => {
      editEl.style.display = "none";
      viewEl.style.display = "block";
    });

    async function save(status, keepCard){
      errEl.style.display = "none";
      const event_year = parseInt(card.querySelector(".in-ev-year").value, 10);
      const title = card.querySelector(".in-ev-title").value.trim();
      const description = card.querySelector(".in-ev-desc").value.trim();
      const source = card.querySelector(".in-ev-source").value.trim();

      if(!event_year || !title){
        errEl.textContent = "Укажите год и название";
        errEl.style.display = "block";
        return;
      }

      const updateData = {
        event_year, title,
        description: description || null,
        source: source || null,
        status,
        moderated_by: currentUser.id,
        moderated_by_name: myProfile.full_name,
        moderated_at: new Date().toISOString(),
        moderator_note: noteEl.value.trim() || null
      };

      const { error } = await sb.from("events").update(updateData).eq("id", id);
      if(error){ errEl.textContent = error.message; errEl.style.display = "block"; return; }

      if(keepCard){
        card.querySelector(".yr").textContent = `${event_year} г.`;
        card.querySelector(".ti").textContent = title;
        let deEl = card.querySelector(".de");
        if(description){
          if(!deEl){
            deEl = document.createElement("div");
            deEl.className = "de";
            card.querySelector(".ti").insertAdjacentElement("afterend", deEl);
          }
          deEl.textContent = description;
        } else if(deEl) deEl.remove();

        editEl.style.display = "none";
        viewEl.style.display = "block";
      } else {
        card.remove();
        const rem = content.querySelectorAll(".mod-card").length;
        countEl.textContent = rem;
        if(window.updateModBadge) window.updateModBadge();
        if(!rem){
          content.innerHTML = `<div class="mod-state">Пока пусто — заявок на проверку событий нет.</div>`;
        }
      }
    }

    card.querySelector(".btn-confirm").addEventListener("click", () => save("confirmed", false));
    card.querySelector(".btn-save-confirm").addEventListener("click", () => save("confirmed", false));
    card.querySelector(".btn-save-only").addEventListener("click", () => save("unconfirmed", true));
    card.querySelector(".btn-reject").addEventListener("click", async () => {
      const { error } = await sb.from("events").update({
        status: "rejected",
        moderated_by: currentUser.id,
        moderated_by_name: myProfile.full_name,
        moderated_at: new Date().toISOString(),
        moderator_note: noteEl.value.trim() || null
      }).eq("id", id);
      if(error){ errEl.textContent = error.message; errEl.style.display = "block"; return; }
      card.remove();
      const rem = content.querySelectorAll(".mod-card").length;
      countEl.textContent = rem;
      if(window.updateModBadge) window.updateModBadge();
      if(!rem){
        content.innerHTML = `<div class="mod-state">Пока пусто — заявок на проверку событий нет.</div>`;
      }
    });
  });
}

          ${p.institution ? `<div class="de"><b>Место работы:</b> ${escapeHtml(p.institution)}</div>` : ""}
          ${p.notes ? `<div class="de">${escapeHtml(p.notes)}</div>` : ""}
          <div class="meta">
            Добавил(а): <b>${escapeHtml(p.created_by_name || "неизвестно")}</b> · ${formatDate(p.created_at)}

            <div class="box-choir" style="display:${p.studied_choir_school ? "block" : "none"}; margin:4px 0 8px 24px">
              <input type="number" class="in-p-choir-end" placeholder="Год выпуска (напр. 1980)" value="${p.choir_school_end || ""}">
            </div>

            <label style="display:flex; align-items:center; gap:8px; font-size:var(--fs-ui); font-family:var(--font-ui); cursor:pointer; margin:4px 0">
              <input type="checkbox" class="in-p-cons" ${p.studied_conservatory ? "checked" : ""} style="width:auto; margin:0"> СПбГК им. Римского-Корсакова
            </label>
            <div class="box-cons" style="display:${p.studied_conservatory ? "block" : "none"}; margin:4px 0 8px 24px">
              <input type="number" class="in-p-cons-end" placeholder="Год выпуска (напр. 1985)" value="${p.conservatory_end || ""}">
            </div>

            <label style="display:flex; align-items:center; gap:8px; font-size:var(--fs-ui); font-family:var(--font-ui); cursor:pointer; margin:4px 0">

            <div style="display:flex; gap:8px">
              <input type="number" class="in-p-start" placeholder="начало" value="${p.study_start || ""}">
              <input type="number" class="in-p-end" placeholder="окончание" value="${p.study_end || ""}">
            </div>
          </div>
          <div class="edit-field">
            <label>Место работы / должность</label>
            <input type="text" class="in-p-inst" value="${escapeHtml(p.institution || "")}">

            <label>Заметки / достижения</label>
            <textarea class="in-p-notes">${escapeHtml(p.notes || "")}</textarea>
          </div>
          <div class="edit-field">
            <label>Источник / ссылка</label>
            <input type="text" class="in-p-source" value="${escapeHtml(p.source || "")}">
          </div>
          <div class="row" style="margin-top:12px">
            <button type="button" class="btn-save-confirm">Сохранить и подтвердить</button>
            <button type="button" class="btn-save-only">Сохранить правки</button>

          </div>
        </div>
        <div class="err"></div>

    `;
  }).join("");

  content.querySelectorAll(".mod-card").forEach(card => {
    const id = card.dataset.id;
    const viewEl = card.querySelector(".card-view");
    const editEl = card.querySelector(".card-edit");
    const noteEl = card.querySelector(".mod-note");
    const errEl = card.querySelector(".err");

    // Интерактивные чекбоксы в форме
    const choirCheck = card.querySelector(".in-p-choir");
    const choirBox = card.querySelector(".box-choir");
    choirCheck.addEventListener("change", () => choirBox.style.display = choirCheck.checked ? "block" : "none");

    const consCheck = card.querySelector(".in-p-cons");
    const consBox = card.querySelector(".box-cons");
    consCheck.addEventListener("change", () => consBox.style.display = consCheck.checked ? "block" : "none");

    const asstCheck = card.querySelector(".in-p-asst");
    const asstBox = card.querySelector(".box-asst");
    asstCheck.addEventListener("change", () => asstBox.style.display = asstCheck.checked ? "block" : "none");

    // Переключение режимов
    card.querySelector(".btn-edit-toggle").addEventListener("click", () => {
      viewEl.style.display = "none";
      editEl.style.display = "block";
    });
    card.querySelector(".btn-edit-cancel").addEventListener("click", () => {
      editEl.style.display = "none";
      viewEl.style.display = "block";
    });

    async function save(status, keepCard){
      errEl.style.display = "none";
      const full_name = card.querySelector(".in-p-name").value.trim();
      const gender = card.querySelector(".in-p-gender").value || null;
      const relation_type = card.querySelector(".in-p-relation").value;

      const studied_choir_school = choirCheck.checked;
      const choir_school_end = (studied_choir_school && card.querySelector(".in-p-choir-end").value)
        ? parseInt(card.querySelector(".in-p-choir-end").value, 10) : null;

      const studied_conservatory = consCheck.checked;
      const conservatory_end = (studied_conservatory && card.querySelector(".in-p-cons-end").value)
        ? parseInt(card.querySelector(".in-p-cons-end").value, 10) : null;

      const studied_assistantship = asstCheck.checked;
      const assistantship_end = (studied_assistantship && card.querySelector(".in-p-asst-end").value)
        ? parseInt(card.querySelector(".in-p-asst-end").value, 10) : null;

      const startRaw = card.querySelector(".in-p-start").value;
      const endRaw = card.querySelector(".in-p-end").value;
      let study_start = (relation_type === "ученик" && startRaw) ? parseInt(startRaw, 10) : null;
      let study_end = (relation_type === "ученик" && endRaw) ? parseInt(endRaw, 10) : null;
      if(!study_end && relation_type === "ученик"){
        study_end = Math.max(choir_school_end || 0, conservatory_end || 0, assistantship_end || 0) || null;
      }

      const institution = card.querySelector(".in-p-inst").value.trim();
      const notes = card.querySelector(".in-p-notes").value.trim();
      const source = card.querySelector(".in-p-source").value.trim();

      if(!full_name){
        errEl.textContent = "Укажите имя и фамилию";
        errEl.style.display = "block";
        return;
      }

      const updateData = {
        full_name, gender, relation_type,
        studied_choir_school, choir_school_end,
        studied_conservatory, conservatory_end,
        studied_assistantship, assistantship_end,
        study_start, study_end,
        institution: institution || null,
        notes: notes || null,
        source: source || null,
        status,
        moderated_by: currentUser.id,
        moderated_by_name: myProfile.full_name,
        moderated_at: new Date().toISOString(),
        moderator_note: noteEl.value.trim() || null,
        updated_by: currentUser.id,
        updated_by_name: myProfile.full_name,
        updated_at: new Date().toISOString()
      };

      const { error } = await sb.from("people").update(updateData).eq("id", id);
      if(error){ errEl.textContent = error.message; errEl.style.display = "block"; return; }

      if(keepCard){
        card.querySelector(".ti").textContent = full_name;
        const newRel = window.personRelationLabel ? window.personRelationLabel({ relation_type, gender }) : relation_type;
        card.querySelector(".yr").textContent = newRel;
        editEl.style.display = "none";
        viewEl.style.display = "block";
      } else {
        card.remove();
        const rem = content.querySelectorAll(".mod-card").length;
        countEl.textContent = rem;
        if(window.updateModBadge) window.updateModBadge();
        if(!rem){
          content.innerHTML = `<div class="mod-state">Пока пусто — новых анкет людей на проверке нет.</div>`;
        }
      }
    }

    card.querySelector(".btn-confirm").addEventListener("click", () => save("confirmed", false));
    card.querySelector(".btn-save-confirm").addEventListener("click", () => save("confirmed", false));
    card.querySelector(".btn-save-only").addEventListener("click", () => save("unconfirmed", true));
    card.querySelector(".btn-reject").addEventListener("click", async () => {
      const { error } = await sb.from("people").update({
        status: "rejected",
        moderated_by: currentUser.id,
        moderated_by_name: myProfile.full_name,
        moderated_at: new Date().toISOString(),
        moderator_note: noteEl.value.trim() || null
      }).eq("id", id);
      if(error){ errEl.textContent = error.message; errEl.style.display = "block"; return; }
      card.remove();
      const rem = content.querySelectorAll(".mod-card").length;
      countEl.textContent = rem;
      if(window.updateModBadge) window.updateModBadge();
      if(!rem){
        content.innerHTML = `<div class="mod-state">Пока пусто — новых анкет людей на проверке нет.</div>`;
      }
    });
  });
}

            <option value="ti" ${cat === "ti" ? "selected" : ""}>От Татьяны Ивановны (её статья, публикация, интервью)</option>
            <option value="community" ${cat === "community" ? "selected" : ""}>От учеников и коллег (воспоминания, статьи о Т.И.)</option>
          </select>
        </div>
        <div class="edit-field">
          <label>Тип материала</label>
          <select class="in-art-type">
            <option value="воспоминание" ${a.type === "воспоминание" ? "selected" : ""}>Воспоминание</option>
            <option value="статья" ${a.type === "статья" ? "selected" : ""}>Статья</option>
            <option value="интервью" ${a.type === "интервью" ? "selected" : ""}>Интервью</option>
            <option value="публикация" ${a.type === "публикация" ? "selected" : ""}>Публикация / заметка</option>
            <option value="другое" ${a.type === "другое" ? "selected" : ""}>Другой материал</option>
          </select>
        </div>
        <div class="edit-field">
          <label>Заголовок материала</label>
          <input type="text" class="in-art-title" value="${escapeHtml(a.title || "")}">
        </div>
        <div class="edit-field">
          <label>Имя автора текста</label>
          <input type="text" class="in-art-author-name" value="${escapeHtml(metaAuthor || "")}" placeholder="Например: Т. И. Хитрова или имя автора">
        </div>
        <div style="display:grid; grid-template-columns:2fr 1fr; gap:10px;">
          <div class="edit-field">
            <label>Первоисточник / издание</label>
            <input type="text" class="in-art-source" value="${escapeHtml(metaSource || "")}" placeholder="Газета, сборник, ссылка">
          </div>
          <div class="edit-field">
            <label>Год оригинала</label>
            <input type="number" class="in-art-year" value="${escapeHtml(metaYear || "")}" placeholder="1984">
          </div>
        </div>
        <div style="margin:8px 0 12px; font-size:var(--fs-meta); font-family:var(--font-ui); color:var(--muted)">
          Для изменения текста статьи откройте её в <a href="nasledie.html#edit/${a.id}" target="_blank" style="color:var(--accent)">полном редакторе ↗</a>
        </div>
        <div class="row" style="margin-top:12px">
          <button type="button" class="btn-save-confirm">Сохранить и подтвердить</button>
          <button type="button" class="btn-save-only">Сохранить правки</button>
          <button type="button" class="btn-edit-cancel">Отмена</button>
        </div>
      </div>
      <div class="err"></div>
    </div>
  `;
  }).join("");

  content.querySelectorAll(".mod-card").forEach(card => {
    const id = card.dataset.id;
    const article = data.find(a => a.id === id);
    const viewEl = card.querySelector(".card-view");
    const editEl = card.querySelector(".card-edit");
    const noteEl = card.querySelector(".mod-note");
    const errEl = card.querySelector(".err");
    const preview = card.querySelector(".art-preview");
    const toggleBtn = card.querySelector("[data-toggle]");

    toggleBtn.addEventListener("click", () => {
      const show = preview.style.display === "none";
      if(show && !preview.innerHTML) preview.innerHTML = renderArticleContent(article.content) || "<p><i>Пусто</i></p>";
      preview.style.display = show ? "block" : "none";
      toggleBtn.textContent = show ? "Скрыть текст" : "Показать текст";
    });

    // Переключение режимов
    card.querySelector(".btn-edit-toggle").addEventListener("click", () => {
      viewEl.style.display = "none";
      editEl.style.display = "block";
    });
    card.querySelector(".btn-edit-cancel").addEventListener("click", () => {
      editEl.style.display = "none";
      viewEl.style.display = "block";
    });

    async function save(status, keepCard){
      errEl.style.display = "none";
      const author_type = card.querySelector(".in-art-author-type").value;
      const type = card.querySelector(".in-art-type").value;
      const title = card.querySelector(".in-art-title").value.trim();
      const author_name = card.querySelector(".in-art-author-name").value.trim() || null;
      const source = card.querySelector(".in-art-source").value.trim() || null;
      const rawYear = card.querySelector(".in-art-year").value.trim();
      const original_year = rawYear ? parseInt(rawYear, 10) || null : null;

      const updateData = {
        author_type,
        type,
        title,
        author_name,
        source,
        original_year,
        status,
        moderated_by: currentUser.id,
        moderated_by_name: myProfile.full_name,
        moderated_at: new Date().toISOString(),
        moderator_note: noteEl.value.trim() || null
      };

      const { error } = await sb.from("articles").update(updateData).eq("id", id);
      if(error){ errEl.textContent = error.message; errEl.style.display = "block"; return; }

      if(keepCard){
        // Обновляем локальный объект статьи
        Object.assign(article, updateData);
        const yrLabel = (ART_TYPE_LABEL[type] || type) + (original_year ? ` (${original_year})` : "");
        card.querySelector(".yr").textContent = yrLabel;
        card.querySelector(".ti").textContent = title || "Без названия";
        editEl.style.display = "none";
        viewEl.style.display = "block";
      } else {
        card.remove();
        const rem = content.querySelectorAll(".mod-card").length;
        countEl.textContent = rem;
        if(window.updateModBadge) window.updateModBadge();
        if(!rem){
          content.innerHTML = `<div class="mod-state">Пока пусто — материалов на проверку нет.</div>`;
        }
      }
    }

    card.querySelector(".btn-confirm").addEventListener("click", () => save("confirmed", false));
    card.querySelector(".btn-save-confirm").addEventListener("click", () => save("confirmed", false));
    card.querySelector(".btn-save-only").addEventListener("click", () => save("unconfirmed", true));
    card.querySelector(".btn-reject").addEventListener("click", async () => {
      const { error } = await sb.from("articles").update({
        status: "rejected",
        moderated_by: currentUser.id,
        moderated_by_name: myProfile.full_name,
        moderated_at: new Date().toISOString(),
        moderator_note: noteEl.value.trim() || null
      }).eq("id", id);
      if(error){ errEl.textContent = error.message; errEl.style.display = "block"; return; }
      card.remove();
      const rem = content.querySelectorAll(".mod-card").length;
      countEl.textContent = rem;
      if(window.updateModBadge) window.updateModBadge();
      if(!rem){
        content.innerHTML = `<div class="mod-state">Пока пусто — материалов на проверку нет.</div>`;
      }
    });
  });
}

// профиль подгружается асинхронно — ждём настоящего сигнала готовности от app.js, не таймера
window.addEventListener("authReady", initModeration, { once: true });
</script>
</body>
</html>
