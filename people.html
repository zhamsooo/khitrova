<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Люди — сайт памяти Т.И. Хитровой</title>
<style>
  :root{
    --paper:#fafaf8; --ink:#22252a; --muted:#878d96; --line:#e4e2dc; --accent:#33507a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,"SF Pro Text","Segoe UI",sans-serif;background:#fff;color:var(--ink)}

  .site-nav{
    height:44px; display:flex; align-items:center; justify-content:center;
    padding:0 20px; position:relative; z-index:20; background:#fff; border-bottom:1px solid var(--line);
  }
  .site-nav .links{display:flex; gap:32px; align-items:center}
  .site-nav .links a{
    color:#999; text-decoration:none; font-size:12px; letter-spacing:.04em;
    text-transform:uppercase; padding:4px 0; border-bottom:1px solid transparent;
  }
  .site-nav .links a.active{color:var(--ink); border-bottom-color:var(--ink)}
  .site-nav .links a:hover{color:var(--ink)}

  .stub{
    height:calc(100vh - 44px); display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px 24px;
  }
  .stub .k{font-size:11px; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; margin-bottom:14px}
  .stub h1{font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:26px; margin:0 0 14px}
  .stub p{color:var(--muted); font-size:14.5px; line-height:1.6; max-width:440px; margin:0}
</style>
</head>
<body>

<header class="site-nav">
  <nav class="links">

    <a href="people.html" class="active">Люди</a>

  </nav>
</header>

<div class="stub">
  <div class="k">Раздел в разработке</div>
  <h1>Люди</h1>
  <p>Здесь будут ученики, коллеги и другие люди, с которыми Т.И. была знакома.</p>
</div>

</body>
</html>
