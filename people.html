<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Люди — сайт памяти Т.И. Хитровой</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="fonts/pt-fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body data-page="people">

<main class="page">
  <h1>Люди</h1>
  <p class="lead">Ученики, коллеги и все, с кем была знакома Татьяна Ивановна. Список неполный — пожалуйста, дополняйте его.</p>

  <div class="toolbar">
    <div class="search">
      <span class="sym">search</span>
      <input type="search" class="search-input" id="pplSearch" placeholder="Имя или год выпуска" autocomplete="off" spellcheck="false">
    </div>
    <div class="chips" id="pplFilterChips">
      <button type="button" class="chip on" data-filter="все"><span class="sym">check</span>Все<span class="chip-count"></span></button>
      <button type="button" class="chip" data-filter="choir">Хоровое училище<span class="chip-count"></span></button>
      <button type="button" class="chip" data-filter="conservatory">Консерватория<span class="chip-count"></span></button>
      <button type="button" class="chip" data-filter="коллега">Коллеги<span class="chip-count"></span></button>
      <button type="button" class="chip" data-filter="близкие">Близкие<span class="chip-count"></span></button>
      <button type="button" class="chip" data-filter="notable">Выдающиеся<span class="chip-count"></span></button>
    </div>
  </div>

  <div id="pplList"><div class="card" style="height:auto; padding:24px; text-align:center; color:var(--on-surface-variant)">Загрузка…</div></div>
</main>

<script src="vendor/supabase-js-2.116.0/supabase.js"></script>
<script src="app.js"></script>
<script>
const STATUS_LABEL_P = { unconfirmed:"На проверке", rejected:"Отклонено" };
const FILTER_VALUES = ["все", "choir", "conservatory", "коллега", "близкие", "notable"];

let allPeople = [];
let activeFilter = "все";

function decadeLabel(year){
  if(!year) return "Год выпуска неизвестен";
  return `${Math.floor(year / 10) * 10}-е`;
}

function pluralPeople(n){
  const mod10 = n % 10;
  const mod100 = n % 100;
  if(mod10 === 1 && mod100 !== 11) return "человек";
  if(mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return "человека";
  return "человек";
}

// «1975–1980», если известно начало, иначе «выпуск 1980» (W2)
function studyYearsLabel(start, end){
  if(!end) return "";
  return start ? `${start}–${end}` : `выпуск ${end}`;
}

// Подпись на карточке: роль · выпуск · заведение, полными словами (F4)
function personSubLine(p){
  if(p.relation_type === "коллега") return "Коллега";
  if(p.relation_type === "другое") return "Близкий человек";

  const eduParts = [];
  if(p.studied_choir_school) eduParts.push("Хоровое училище");
  if(p.studied_conservatory) eduParts.push("СПбГК");
  if(p.studied_assistantship) eduParts.push("ассистентура");
  const eduStr = eduParts.join(", ");

  let role = null;
  if(p.gender === "m") role = "Ученик";
  else if(p.gender === "f") role = "Ученица";

  const bits = [];
  if(role) bits.push(role);
  if(p.study_end) bits.push(studyYearsLabel(p.study_start, p.study_end));
  if(eduStr) bits.push(eduStr);

  if(!bits.length) return "Ученик";
  let result = bits.join(" · ");
  if(!role) result = result.charAt(0).toUpperCase() + result.slice(1);
  return result;
}

function personCard(p){
  const isMine = p.status !== "confirmed";
  const initial = (p.full_name || "?").trim().charAt(0).toUpperCase();
  const subLine = personSubLine(p);
  const desc = p.institution || p.notes || "";

  const avatarEl = p.avatar_url
    ? `<img src="${escapeHtml(p.avatar_url)}" alt="">`
    : initial;

  const metaAuthor = p.created_by_name ? escapeHtml(p.created_by_name) : "Из архива";
  const metaDate = p.created_at ? new Date(p.created_at).toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) : "";
  const metaAuthorDate = metaDate ? `${metaAuthor} · ${metaDate}` : metaAuthor;
  const statusLabel = p.status === "unconfirmed" ? "На проверке" : (p.status === "rejected" ? "Отклонено" : "Подтверждено");
  const notableStar = p.notable ? `<span class="sym person-notable-star" title="Выдающийся">star</span>` : "";

  return `
    <a class="card ${isMine ? 'pending' : ''}" href="person.html?id=${p.id}" tabindex="0">
      <div class="top">
        <div class="ava">${avatarEl}</div>
        <div style="min-width:0; flex:1">
          <div class="name">${escapeHtml(p.full_name)}${notableStar}</div>
          <div class="sub">${escapeHtml(subLine)}</div>
        </div>
      </div>
      <p class="txt">${escapeHtml(desc)}</p>
      <div class="meta">
        <span>${metaAuthorDate}</span>
        ${isMine ? `<span class="st"${p.moderator_note ? ` title="Заметка модератора: ${escapeAttr(p.moderator_note)}"` : ""}>${statusLabel}</span>` : ""}
        ${typeof renderMetaIcon === "function" ? renderMetaIcon("people", p.id, p) : ""}
      </div>
    </a>
  `;
}

function matchesFilter(p, filter){
  if(filter === "все") return true;
  if(filter === "choir") return p.relation_type === "ученик" && !!p.studied_choir_school;
  if(filter === "conservatory") return p.relation_type === "ученик" && (!!p.studied_conservatory || !!p.studied_assistantship);
  if(filter === "коллега") return p.relation_type === "коллега";
  if(filter === "близкие") return p.relation_type === "другое";
  if(filter === "notable") return !!p.notable;
  return true;
}

function updateChipCounts(){
  document.querySelectorAll("#pplFilterChips .chip").forEach(chip => {
    const filter = chip.dataset.filter;
    const count = allPeople.filter(p => matchesFilter(p, filter)).length;
    const countEl = chip.querySelector(".chip-count");
    if(countEl) countEl.textContent = ` · ${count}`;
    chip.dataset.count = count;
  });
}

function render(){
  const pplInput = document.getElementById("pplSearch");
  const rawQ = pplInput ? pplInput.value.trim() : "";
  let list = allPeople.filter(p => matchesFilter(p, activeFilter));
  if(rawQ){
    const normQ = rawQ.toLowerCase().replace(/ё/g, "е").trim();
    const words = normQ.split(/\s+/).filter(Boolean);
    list = list.filter(p => {
      const years = [
        p.study_start, p.study_end,
        p.choir_school_start, p.choir_school_end,
        p.conservatory_start, p.conservatory_end,
        p.assistantship_start, p.assistantship_end
      ].filter(Boolean).join(" ");
      const text = `${p.full_name || ""} ${years}`.toLowerCase().replace(/ё/g, "е");
      return words.every(w => text.includes(w));
    });
  }

  const elList = document.getElementById("pplList");
  if(!list.length){
    elList.innerHTML = `<div class="card" style="height:auto; padding:32px; text-align:center; color:var(--on-surface-variant); max-width:400px; margin:24px auto;">Никого не нашлось.</div>`;
    return;
  }

  const students = list.filter(p => p.relation_type === "ученик").sort((a,b) => (b.study_end||0) - (a.study_end||0));
  const others = list.filter(p => p.relation_type !== "ученик");

  const groups = new Map();
  students.forEach(p => {
    const key = decadeLabel(p.study_end);
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  });

  let html = "";
  for(const [label, people] of groups){
    html += `<div class="group">${escapeHtml(label)} · ${people.length} ${pluralPeople(people.length)}</div><div class="grid">${people.map(personCard).join("")}</div>`;
  }
  if(others.length){
    html += `<div class="group">Коллеги и другие · ${others.length} ${pluralPeople(others.length)}</div><div class="grid">${others.map(personCard).join("")}</div>`;
  }
  elList.innerHTML = html;
}

async function loadPeople(){
  if(!sb) return;
  let q = sb.from("people").select("*");
  q = currentUser ? q.or(`status.eq.confirmed,created_by.eq.${currentUser.id}`) : q.eq("status", "confirmed");
  const { data, error } = await q;
  if(error){
    document.getElementById("pplList").innerHTML = `<div class="card" style="height:auto; padding:24px; text-align:center; color:var(--error); max-width:480px; margin:24px auto;">Ошибка загрузки: ${escapeHtml(error.message)}</div>`;
    return;
  }
  allPeople = data || [];
  updateChipCounts();
  render();
}

function setChipFilter(f){
  activeFilter = f;
  document.querySelectorAll("#pplFilterChips .chip").forEach(c => {
    const isOn = c.dataset.filter === f;
    c.classList.toggle("on", isOn);
    const existingSym = c.querySelector(".sym");
    if(existingSym) existingSym.remove();
    if(isOn){
      c.insertAdjacentHTML("afterbegin", '<span class="sym">check</span>');
    }
  });
}

const urlFilter = new URLSearchParams(location.search).get("filter");
if(urlFilter && FILTER_VALUES.includes(urlFilter)){
  setChipFilter(urlFilter);
}

document.querySelectorAll("#pplFilterChips .chip").forEach(chip => {
  chip.addEventListener("click", () => {
    setChipFilter(chip.dataset.filter);
    render();
  });
});

const pplSearch = document.getElementById("pplSearch");
if(pplSearch){
  pplSearch.addEventListener("input", render);
}

window.onPersonAdded = loadPeople;
window.addEventListener("authReady", loadPeople, { once: true });
</script>
</body>
</html>
