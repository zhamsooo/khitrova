<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Люди, граф (демо) — сайт памяти Т.И. Хитровой</title>
<link rel="stylesheet" href="fonts/pt-fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  /* страница целиком занята графом, без прокрутки страницы */
  html, body { height: 100%; overflow: hidden; }
  .graph-stage { position: fixed; left: 0; right: 0; top: 52px; bottom: 0; background: var(--surface); }
  #graph { position: absolute; inset: 0; }
  .graph-tools { position: absolute; top: 12px; right: var(--pad-r); display: flex; gap: 8px; z-index: 2; }
  .graph-tools .chip { background: var(--surface); }
  .graph-tools .chip.on { background: var(--secondary-container); color: var(--on-surface); border-color: transparent; }
  .graph-hint {
    position: absolute; left: var(--pad-x); bottom: 14px; margin: 0; max-width: 62ch; z-index: 2; pointer-events: none;
    font: var(--t-label-medium); color: var(--on-surface-variant);
  }
  @media (max-width: 600px) {
    .graph-stage { bottom: 80px; }   /* нижняя навигация */
    .graph-tools { top: 62px; left: 12px; right: auto; }
    .graph-hint { bottom: 8px; left: 12px; }
  }
</style>
</head>
<body data-page="people">

<div class="graph-stage">
  <div id="graph"></div>
  <div class="graph-tools" id="tools"></div>
  <p class="graph-hint">Наведите на точку: подсветятся те, кто мог учиться в те же годы (выпуск плюс-минус 5 лет). Пустые кружки: демо-данные для примера.</p>
</div>

<script src="vendor/supabase-js-2.116.0/supabase.js"></script>
<script src="vendor/echarts-5.6.0/echarts.min.js"></script>
<script src="app.js"></script>
<script>
// ---------------------------------------------------------------- группы (категории графа)
const GROUPS = {
  choir:     { name: "Хоровое училище",              color: "#1B263B" },
  spbgk:     { name: "СПбГК",                        color: "#4F7CAC" },
  colleague: { name: "Коллеги",                      color: "#C08A3E" },
  unspec:    { name: "Не указано",                    color: "#8A96A3" }
};
const ORDER = ["choir", "spbgk", "colleague", "unspec"];
const YEAR_MIN = 1974, YEAR_MAX = 2017, WINDOW = 5;
const FONT = '"PT Sans", sans-serif';

// ---------------------------------------------------------------- демо-данные (детерминированно)
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20260919);
const pick = arr => arr[Math.floor(R() * arr.length)];
const SUR = ["Ковалёв","Громов","Васильев","Орлов","Лебедев","Зайцев","Крылов","Морозов","Беляев","Фомин","Тихонов","Киселёв","Жуков","Соловьёв","Дроздов","Николаев","Титов","Сидоров","Гусев","Поляков"];
const INIT = "АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ";
const demoName = () => (R() < .5 ? pick(SUR) + "а" : pick(SUR)) + " " + INIT[Math.floor(R() * INIT.length)] + ".";
const span = (a, b) => a + Math.floor(R() * (b - a + 1));
function makeDemo(){
  const out = []; let n = 0;
  const add = (group, year) => out.push({ id: "demo" + (++n), name: demoName(), group, year, notable: R() < .12, demo: true });
  for(let i = 0; i < 22; i++) add("choir", span(1976, 2016));
  for(let i = 0; i < 22; i++) add("spbgk", span(1978, 2015));
  for(let i = 0; i < 10; i++) add("colleague", span(1975, 2010));
  for(let i = 0; i < 6; i++) add("unspec", span(1980, 2012));
  return out;
}

// ---------------------------------------------------------------- настоящие данные
async function loadReal(){
  const { data, error } = await sb.from("people")
    .select("id, full_name, relation_type, study_end, notable, studied_choir_school, studied_conservatory, choir_school_end, conservatory_end")
    .eq("status", "confirmed");
  if(error || !data) return [];
  return data.map(p => {
    let group = "unspec";
    if(p.relation_type === "коллега") group = "colleague";
    else if(p.studied_conservatory) group = "spbgk";
    else if(p.studied_choir_school) group = "choir";
    const year = p.conservatory_end || p.choir_school_end || p.study_end || null;
    return { id: p.id, name: p.full_name, group, year, notable: !!p.notable, demo: false };
  });
}

// ---------------------------------------------------------------- раскладка: сектор на группу, по спирали: позже выпуск, дальше от центра
function layout(people){
  const GAP = 12, avail = 360 - GAP * ORDER.length;
  const byGroup = {}; ORDER.forEach(g => byGroup[g] = people.filter(p => p.group === g).sort((a, b) => (a.year || 0) - (b.year || 0)));
  const weights = ORDER.map(g => byGroup[g].length + 4), sum = weights.reduce((a, b) => a + b, 0);
  let start = -180 + GAP / 2;
  ORDER.forEach((g, gi) => {
    const list = byGroup[g], sector = avail * weights[gi] / sum;
    list.forEach((p, i) => {
      p.ang = (start + sector * (i + .5) / list.length) * Math.PI / 180;
      const t = p.year ? (Math.min(Math.max(p.year, YEAR_MIN), YEAR_MAX) - YEAR_MIN) / (YEAR_MAX - YEAR_MIN) : 0;
      p.rf = .24 + .72 * t + [-.035, 0, .035][i % 3];   // три «дорожки» по радиусу, чтобы соседи одного выпуска не слипались; без года: у центра
    });
    start += sector + GAP;
  });
}

// ---------------------------------------------------------------- отрисовка
let chart, PEOPLE, byId;
const chipState = { demo: true, notable: false };
let legendSelected = {};
const isFinePointer = window.matchMedia("(hover: hover)").matches;

function visible(p){ return (chipState.demo || !p.demo) && (!chipState.notable || p.notable); }

function render(){
  const el = document.getElementById("graph");
  const w = el.clientWidth, h = el.clientHeight;
  const top = window.innerWidth <= 600 ? 132 : 56, bottom = 46, cx = w / 2, cy = top + (h - top - bottom) / 2;
  const rx = w / 2 - 70, ry = (h - top - bottom) / 2 - 8;
  const vis = PEOPLE.filter(visible);

  // связи: могли учиться вместе (выпуск ±5 лет). Рисуются только при наведении.
  const links = [], degree = new Map(vis.map(p => [p.id, 0]));
  const withYear = vis.filter(p => p.year);
  for(let i = 0; i < withYear.length; i++){
    for(let j = i + 1; j < withYear.length; j++){
      if(Math.abs(withYear[i].year - withYear[j].year) <= WINDOW){
        links.push({ source: withYear[i].id, target: withYear[j].id });
        degree.set(withYear[i].id, degree.get(withYear[i].id) + 1); degree.set(withYear[j].id, degree.get(withYear[j].id) + 1);
      }
    }
  }

  const categories = ORDER.map(g => ({ name: GROUPS[g].name, itemStyle: { color: GROUPS[g].color } }));
  categories.push({ name: "Центр", itemStyle: { color: "#0D1B2A" } });
  const nodes = vis.map(p => ({
    id: p.id, name: p.name, category: ORDER.indexOf(p.group),
    x: cx + rx * p.rf * Math.cos(p.ang), y: cy + ry * p.rf * Math.sin(p.ang),
    symbolSize: p.notable ? 14 : 10,
    itemStyle: p.demo ? { color: "#fff", borderColor: GROUPS[p.group].color, borderWidth: 2 } : { color: GROUPS[p.group].color },
    label: { show: false },   // подписи только при наведении: иначе выдающиеся налезают друг на друга
    tip: p.name + "<br>" + GROUPS[p.group].name + (p.year ? (p.group === "colleague" ? ", вместе с " + p.year + "-х" : ", выпуск " + p.year) : ", год не указан")
       + (p.notable ? "<br>Выдающийся ученик" : "")
       + (p.year ? "<br>Могли учиться вместе: " + degree.get(p.id) + " чел." : "")
       + (p.demo ? "<br><i>демо-данные</i>" : (isFinePointer ? "<br>Нажмите, чтобы открыть карточку" : ""))
  }));
  // Т. И. в центре, без связей
  nodes.push({ id: "ti", name: "Т. И. Хитрова", category: 4, x: cx, y: cy, symbolSize: 34, itemStyle: { color: "#0D1B2A" },
    label: { show: true, position: "bottom", distance: 8, fontWeight: 700, fontSize: 13, color: "#0D1B2A" }, tip: "Татьяна Ивановна Хитрова", silent: true });
  // невидимые точки по углам держат границы постоянными: фильтры не сдвигают картинку
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy], i) => nodes.push({
    id: "anchor" + i, name: "", category: 4, x: cx + sx * (rx + 40), y: cy + sy * (ry + 20), symbolSize: 0, silent: true, label: { show: false }, tip: ""
  }));

  chart.setOption({
    textStyle: { fontFamily: FONT },
    animationDuration: 600, animationEasingUpdate: "quinticInOut",
    tooltip: { confine: true, formatter: p => (p.dataType === "node" && p.data.tip) ? p.data.tip : "", textStyle: { fontFamily: FONT, fontSize: 13 } },
    legend: [{
      data: ORDER.map(g => GROUPS[g].name), selected: legendSelected,
      top: 12, left: "center", width: Math.min(w - 24, 720), icon: "circle", itemWidth: 10, itemHeight: 10, itemGap: 22,
      textStyle: { fontFamily: FONT, fontSize: 14, color: "#0D1B2A" },
      inactiveColor: "#C3CAD2"
    }],
    series: [{
      name: "Люди", type: "graph", layout: "none", roam: true, scaleLimit: { min: .7, max: 6 },
      left: 0, right: 0, top: 0, bottom: 0,
      data: nodes, links, categories,
      label: { position: "right", formatter: "{b}", fontSize: 12, color: "#0D1B2A" },
      // в покое связи почти невидимы (0 нельзя: такие линии не рисуются и при наведении); при наведении на точку проявляются её связи
      lineStyle: { color: "rgba(65,90,119,0.035)", width: 1, curveness: .25 },
      emphasis: { focus: "adjacency", label: { show: true }, lineStyle: { color: "rgba(65,90,119,0.7)", width: 1.6 } },
      blur: { itemStyle: { opacity: .15 }, label: { opacity: .25 } },
      labelLayout: { hideOverlap: true }
    }]
  }, true);
  renderTools();
}

function renderTools(){
  const box = document.getElementById("tools");
  const chip = (id, label, on) => `<button type="button" class="chip ${on ? "on" : ""}" data-id="${id}">${on ? '<span class="sym">check</span>' : ""}${label}</button>`;
  box.innerHTML = chip("notable", "Только выдающиеся", chipState.notable) + chip("demo", "Показывать демо", chipState.demo);
}
document.getElementById("tools").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  chipState[b.dataset.id] = !chipState[b.dataset.id];
  render();
});

// ---------------------------------------------------------------- запуск
(async function init(){
  chart = echarts.init(document.getElementById("graph"), null, { renderer: "canvas" });
  PEOPLE = [...await loadReal(), ...makeDemo()];
  layout(PEOPLE);
  byId = new Map(PEOPLE.map(p => [p.id, p]));
  render();

  chart.on("legendselectchanged", ev => { legendSelected = ev.selected; });
  // мышь: клик открывает карточку. Тач: первое касание подсвечивает, второе по той же точке открывает.
  let lastTap = null;
  chart.on("click", ev => {
    const p = ev.data && byId.get(ev.data.id);
    if(!p || p.demo) return;
    if(isFinePointer || lastTap === p.id) location.href = "person.html?id=" + encodeURIComponent(p.id);
    else lastTap = p.id;
  });
  chart.getZr().on("click", e => { if(!e.target) lastTap = null; });

  let t; window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => { chart.resize(); render(); }, 150); });
})();
</script>
</body>
</html>
