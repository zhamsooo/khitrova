<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карточка человека — сайт памяти Т.И. Хитровой</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .btn-back{
    display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none;
    font-size:var(--fs-ui); margin-bottom:24px; transition:color .15s; font-family:var(--font-ui);
  }
  .btn-back:hover{color:var(--ink)}

  .person-layout{
    display:grid;
    grid-template-columns:1fr 310px;
    gap:28px;
    align-items:start;
  }

  /* Основная карточка человека */
  .person-card-view{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:32px 36px;
    box-shadow:0 2px 16px rgba(0,0,0,.03);
  }

  .person-head-row{
    display:flex; align-items:flex-start; gap:22px; margin-bottom:26px; padding-bottom:24px;
    border-bottom:1px solid var(--line);
  }

  .person-avatar-wrap{flex:none}
  .person-avatar{
    width:92px; height:92px; border-radius:50%; object-fit:cover; display:block;
    background:var(--paper); border:1px solid var(--line);
  }
  .person-avatar-placeholder{
    width:92px; height:92px; border-radius:50%; background:var(--paper); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-head); font-weight:700; font-size:var(--fs-h1); color:var(--accent);
  }

  .person-title-area{flex:1; min-width:0}
  .person-name{
    font-family:var(--font-head); font-weight:700; font-size:var(--fs-h1); margin:0 0 6px;
    line-height:1.1; text-wrap:balance; color:var(--ink);
  }
  .person-role-line{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:12px}
  .person-role{font-size:var(--fs-ui); color:var(--accent); font-weight:600; font-family:var(--font-ui)}
  .person-badge{
    font-family:var(--font-ui); font-weight:700; font-size:var(--fs-badge); letter-spacing:.06em;
    text-transform:uppercase; color:var(--warn); padding:2px 8px; border-radius:10px;
    background:rgba(164,100,31,.08);
  }
  .person-badge.st-rejected{color:#b0413e; background:rgba(176,65,62,.08)}

  .person-actions{margin-top:14px; display:flex; align-items:center; gap:8px}
  .btn-edit-card{
    background:none; border:1px solid var(--line); color:var(--muted); cursor:pointer;
    font-size:var(--fs-ui); font-family:var(--font-ui); padding:5px 13px; border-radius:14px;
    transition:border-color .15s, color .15s, background .15s;
  }
  .btn-edit-card:hover{border-color:var(--ink); color:var(--ink); background:#faf8f5}

  .person-section{margin-bottom:24px}
  .person-section:last-of-type{margin-bottom:0}
  .person-section-label{
    font-family:var(--font-ui); font-weight:700; font-size:var(--fs-meta); letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); margin-bottom:10px;
  }

  /* Вехи образования — визуальные блоки вместо сплошного текста */
  .edu-list{display:flex; flex-direction:column; gap:8px}
  .edu-item-card{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    background:var(--paper); border:1px solid var(--line); border-radius:8px;
    padding:10px 14px;
  }
  .edu-item-info{display:flex; flex-direction:column; gap:2px; min-width:0}
  .edu-item-title{
    font-family:var(--font-head); font-weight:600; font-size:var(--fs-h3); color:var(--ink);
    line-height:1.2;
  }
  .edu-item-detail{font-size:var(--fs-meta); color:var(--muted); font-family:var(--font-body)}
  .edu-item-year-badge{
    font-family:var(--font-ui); font-weight:700; font-size:var(--fs-ui); color:var(--accent);
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:3px 9px; white-space:nowrap; flex:none;
  }

  .inst-box{
    background:#fff; border-left:3px solid var(--accent); padding:2px 0 2px 12px;
    font-size:var(--fs-body); font-family:var(--font-body); color:var(--ink); line-height:1.45;
  }

  /* Форматированные заметки и биография */
  .notes-paragraph{
    margin:0 0 10px 0; color:#2c3036; line-height:1.6; font-size:var(--fs-body); font-family:var(--font-body); max-width:68ch;
  }
  .notes-bullet-list{
    margin:6px 0 12px 0; padding-left:18px; color:#2c3036; line-height:1.6; font-size:var(--fs-body); font-family:var(--font-body); max-width:68ch;
  }
  .notes-bullet-list li{margin-bottom:6px}

  .person-meta{
    margin-top:30px; padding-top:16px; border-top:1px solid #f0efec;
    font-size:var(--fs-meta); color:var(--muted); line-height:1.6; font-family:var(--font-ui);
  }
  .person-meta a{color:var(--accent); text-decoration:none}
  .person-meta a:hover{text-decoration:underline}

  .person-state{padding:60px 24px; text-align:center; color:var(--muted); font-size:var(--fs-body); font-family:var(--font-body)}

  /* Виджет «Учились вместе» (правая колонка) */
  .peers-widget{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 16px;
    box-shadow:0 2px 14px rgba(0,0,0,.02); position:sticky; top:60px;
  }
  .peers-header{margin-bottom:12px}
  .peers-title{
    font-family:var(--font-head); font-weight:600; font-size:var(--fs-h3); color:var(--ink); margin:0 0 2px;
  }
  .peers-sub{font-size:var(--fs-meta); color:var(--muted); font-family:var(--font-ui)}

  .peers-tabs{display:flex; flex-wrap:wrap; gap:5px; margin:10px 0}
  .peers-tab-btn{
    background:var(--paper); border:1px solid var(--line); border-radius:12px;
    font-size:var(--fs-meta); font-family:var(--font-ui); padding:3px 9px; cursor:pointer; color:var(--muted);
    transition:all .12s;
  }
  .peers-tab-btn:hover{color:var(--ink); border-color:var(--ink)}
  .peers-tab-btn.active{background:var(--ink); color:#fff; border-color:var(--ink)}

  .peers-col-head{
    display:flex; align-items:center; gap:8px; padding:0 8px 6px;
    font-family:var(--font-ui); font-weight:700; font-size:var(--fs-badge);
    color:var(--muted); text-transform:uppercase; letter-spacing:.06em;
    border-bottom:1px solid #f0efec; margin-bottom:4px;
  }
  .col-yr-title{width:42px; text-align:right; flex:none}
  .col-name-title{flex:1; padding-left:32px}

  .peers-scroll-pane{
    max-height:430px; overflow-y:auto; padding-right:4px; scroll-behavior:smooth;
    display:flex; flex-direction:column; gap:4px;
  }
  .peers-scroll-pane::-webkit-scrollbar{width:4px}
  .peers-scroll-pane::-webkit-scrollbar-thumb{background:#dedad4; border-radius:4px}

  .peer-item{
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:7px;
    text-decoration:none; color:inherit; transition:background .1s, border-color .1s;
    border:1px solid transparent; font-size:var(--fs-ui); font-family:var(--font-ui);
  }
  .peer-item:hover{background:var(--paper)}
  .peer-item.current{background:#fbf8f2; border-color:var(--accent)}

  .peer-year-tag{
    font-family:var(--font-ui); font-weight:700; font-size:var(--fs-meta); color:var(--muted);
    width:42px; flex:none; text-align:right;
  }
  .peer-item.current .peer-year-tag{color:var(--accent)}
  .peers-toggle-btn{
    background:none; border:none; color:var(--muted); font-size:var(--fs-meta);
    cursor:pointer; font-family:var(--font-ui); text-decoration:underline; padding:4px 6px;
    transition:color .12s;
  }
  .peers-toggle-btn:hover{color:var(--ink)}

  .peer-avatar-mini{
    width:24px; height:24px; border-radius:50%; object-fit:cover; background:var(--paper);
    border:1px solid var(--line); flex:none;
  }
  .peer-avatar-initial{
    width:24px; height:24px; border-radius:50%; background:var(--paper); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-ui); font-weight:700; font-size:var(--fs-badge); color:var(--muted); flex:none;
  }

  .peer-info{min-width:0; flex:1}
  .peer-name{
    font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; font-size:var(--fs-ui); font-family:var(--font-ui);
  }
  .peer-sub{font-size:var(--fs-meta); color:var(--muted); display:flex; gap:4px; align-items:center; font-family:var(--font-ui)}
  .peer-here-badge{
    font-family:var(--font-ui); font-weight:700; font-size:var(--fs-badge); color:var(--accent);
    text-transform:uppercase; letter-spacing:.04em;
  }

  .peers-jump-btns{
    display:flex; justify-content:space-between; padding-top:10px; margin-top:10px;
    border-top:1px solid #f0efec; font-size:var(--fs-meta); font-family:var(--font-ui);
  }
  .peers-jump-btn{
    background:none; border:none; color:var(--muted); cursor:pointer; font-family:var(--font-ui);
    padding:2px 4px; border-radius:4px; transition:color .1s;
  }
  .peers-jump-btn:hover{color:var(--ink)}

  /* Модалка редактирования */
  .avatar-edit-box{
    display:flex; align-items:center; gap:16px; margin:8px 0 14px;
    padding:12px 14px; background:var(--paper); border:1px solid var(--line); border-radius:10px;
  }
  .avatar-preview-img{
    width:64px; height:64px; border-radius:50%; object-fit:cover; display:block;
    background:#fff; border:1px solid var(--line);
  }
  .avatar-preview-empty{
    width:64px; height:64px; border-radius:50%; background:#fff; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-head); font-weight:700; font-size:var(--fs-h2); color:var(--muted);
  }
  .avatar-edit-actions{display:flex; flex-direction:column; gap:6px}
  .btn-upload{
    background:#fff; border:1px solid var(--line); padding:6px 12px; border-radius:12px;
    font-size:var(--fs-ui); cursor:pointer; font-family:var(--font-ui); color:var(--ink);
  }
  .btn-upload:hover{border-color:var(--ink)}
  .btn-remove-avatar{
    background:none; border:none; color:#b0413e; font-size:var(--fs-meta); cursor:pointer;
    padding:0; text-align:left; text-decoration:underline; font-family:var(--font-ui);
  }

  @media (max-width:860px){
    .person-layout{grid-template-columns:1fr; gap:24px}
    .peers-widget{position:static; max-width:100%}
  }
  @media (max-width:640px){
    .person-wrap{padding:4vh 16px 8vh}
    .person-card-view{padding:22px 18px}
    .person-head-row{flex-direction:column; align-items:center; text-align:center; gap:16px}
    .person-role-line{justify-content:center}
    .person-name{font-size:var(--fs-h1)}
    .person-actions{display:flex; justify-content:center}
    .edu-item-card{flex-direction:column; align-items:flex-start; gap:8px}
  }

  /* Фиксированная панель навигации карточки с поиском */
  .person-sticky-bar{
    position:sticky; top:64px; z-index:15; background:rgba(254,247,255,.96);
    backdrop-filter:blur(6px); border-bottom:1px solid #edebe8;
    padding:10px 0; margin-bottom:24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    transition:border-color .15s, box-shadow .15s;
  }
  .person-sticky-bar.is-stuck{
    border-bottom-color:var(--line); box-shadow:0 2px 10px rgba(0,0,0,.03);
  }
  .person-sticky-bar .breadcrumbs{margin-bottom:0; flex:1; min-width:180px}

  /* Хлебные крошки */
  .breadcrumbs{
    display:flex; align-items:center; flex-wrap:wrap; gap:8px;
    font-size:var(--fs-meta); color:var(--muted); line-height:1.4; font-family:var(--font-ui);
  }
  .breadcrumbs a{color:var(--muted); text-decoration:none; transition:color .15s}
  .breadcrumbs a:hover{color:var(--ink)}
  .breadcrumbs .sep{color:var(--line); font-size:var(--fs-meta)}
  .breadcrumbs .current{color:var(--ink); font-weight:500}

  .person-search-wrap{position:relative; display:flex; align-items:center; flex:none}
  .person-search-icon{position:absolute; left:10px; color:var(--muted); pointer-events:none; display:flex; align-items:center}
  #personSearchInput{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:6px 12px 6px 30px; font-family:var(--font-ui); font-size:var(--fs-ui); width:220px;
    outline:none; transition:width .2s ease, border-color .15s, background .15s;
  }
  #personSearchInput:focus{width:280px; background:#fff; border-color:var(--ink)}
  #personSearchInput::placeholder{color:var(--muted); font-size:var(--fs-ui)}

  .person-search-dropdown{
    display:none; position:absolute; top:calc(100% + 6px); right:0; width:320px; max-width:90vw;
    background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.08);
    max-height:360px; overflow-y:auto; z-index:50; padding:5px;
  }
  .person-search-dropdown.open{display:block}
  .person-search-item{
    display:flex; align-items:center; gap:10px; padding:7px 9px; border-radius:7px;
    text-decoration:none; color:var(--ink); transition:background .1s; cursor:pointer;
  }
  .person-search-item:hover, .person-search-item.selected{background:#f7f6f3}
  .person-search-avatar{
    width:28px; height:28px; border-radius:50%; background:var(--paper); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-ui);
    font-size:var(--fs-badge); font-weight:700; color:var(--ink); flex:none; overflow:hidden;
  }
  .person-search-avatar img{width:100%; height:100%; object-fit:cover}
  .person-search-info{flex:1; min-width:0}
  .person-search-name{font-weight:600; font-size:var(--fs-ui); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink); font-family:var(--font-ui)}
  .person-search-sub{font-size:var(--fs-meta); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; font-family:var(--font-ui)}
  .person-search-empty{padding:14px 10px; font-size:var(--fs-ui); color:var(--muted); text-align:center; font-family:var(--font-ui)}

  @media (max-width:640px){
    .person-sticky-bar{flex-direction:column; align-items:stretch; gap:10px}
    .person-search-wrap{width:100%}
    #personSearchInput{width:100%}
    #personSearchInput:focus{width:100%}
  }

  /* Просторная модалка редактирования (ПК: 780px, 2 колонки) */
  .modal-person-edit{
    width:780px !important; max-width:94vw !important; max-height:88vh !important;
    display:flex; flex-direction:column; padding:0 !important; overflow:hidden;
  }
  .modal-head{
    padding:18px 24px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; flex:none;
  }
  .modal-head h2{margin:0; font-family:var(--font-head); font-weight:600; font-size:var(--fs-h2); line-height:1.2}
  .modal-head .close{
    position:static; margin-left:auto; width:44px; height:44px;
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:8px;
  }
  .modal-body{padding:20px 24px; overflow-y:auto; flex:1}
  .modal-grid-2col{display:grid; grid-template-columns:1fr 1fr; gap:24px}
  .modal-col{display:flex; flex-direction:column}
  .modal-col label{display:block; font-size:var(--fs-meta); color:var(--muted); margin:10px 0 4px; font-family:var(--font-ui)}
  .modal-col label:first-child{margin-top:0}
  .study-box-wrap{
    background:var(--paper); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; margin-bottom:6px;
  }
  .study-check-row{
    display:flex; align-items:center; gap:8px; cursor:pointer; font-size:var(--fs-ui); font-family:var(--font-ui); margin:4px 0;
  }
  .study-check-row input[type="checkbox"]{width:auto; margin:0}
  .modal-footer{
    padding:14px 24px; border-top:1px solid var(--line); background:#faf8f5;
    display:flex; align-items:center; justify-content:space-between; flex:none;
  }
  .btn-cancel{
    background:none; border:1px solid var(--line); color:var(--muted);
    font-size:var(--fs-ui); font-family:var(--font-ui); padding:7px 16px; border-radius:8px;
    cursor:pointer; transition:all .15s; min-height:44px;
  }
  .btn-cancel:hover{border-color:var(--ink); color:var(--ink)}

  @media (max-width:760px){
    .modal-person-edit{max-height:92vh !important}
    .modal-grid-2col{grid-template-columns:1fr; gap:16px}
  }
  @media (max-width:600px){
    #editPersonOverlay{align-items:flex-end}
    .modal-person-edit{
      width:100% !important; max-width:100% !important; border-radius:14px 14px 0 0 !important;
      max-height:94vh !important; margin:0 !important;
    }
    .modal-footer{
      position:sticky; bottom:0; padding:10px 16px;
    }
  }
</style>
</head>
<body data-page="people" class="page-person">

<main class="page">
  <div class="person-sticky-bar" id="personStickyBar">
    <nav class="breadcrumbs" aria-label="Навигация">
      <a href="people.html">Люди</a>
      <span class="sep">/</span>
      <a href="people.html?filter=ученик" id="bcCategory">Ученики</a>
      <span class="sep">/</span>
      <span class="current" id="bcName">Загрузка…</span>
    </nav>
    <div class="person-search-wrap" id="personSearchWrap">
      <svg class="person-search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="search" id="personSearchInput" placeholder="Найти другого человека…" autocomplete="off" spellcheck="false">
      <div class="person-search-dropdown" id="personSearchDropdown"></div>
    </div>
  </div>
  <div class="person-layout">
    <div id="personContent">
      <div class="person-state">Загрузка информации…</div>
    </div>
    <div id="peersSidebar" style="display:none"></div>
  </div>
</main>

<!-- Модалка редактирования карточки человека -->
<div class="overlay" id="editPersonOverlay">
  <div class="modal modal-person-edit">
    <div class="modal-head">
      <h2>Предложить правку данных</h2>
      <button class="close" data-close>×</button>
    </div>

    <div class="modal-body">
      <div class="modal-grid-2col">
        <!-- Левая колонка: фото, ФИО, статус, учёба -->
        <div class="modal-col">
          <label>Фотография (аватарка)</label>
          <div class="avatar-edit-box">
            <div id="avatarPreviewHolder"></div>
            <div class="avatar-edit-actions">
              <input type="file" id="editAvatarInput" accept="image/*" style="display:none">
              <button type="button" class="btn-upload" id="btnTriggerUpload">Загрузить фото</button>
              <button type="button" class="btn-remove-avatar" id="btnRemoveAvatar" style="display:none">Удалить фото</button>
            </div>
          </div>

          <label>Имя и фамилия *</label>
          <input type="text" id="editFullName" placeholder="Имя Фамилия">

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
            <div>
              <label>Пол</label>
              <select id="editGender">
                <option value="">Не указан</option>
                <option value="m">Мужской (ученик)</option>
                <option value="f">Женский (ученица)</option>
              </select>
            </div>
            <div>
              <label>Кем приходится Т.И.?</label>
              <select id="editRelation">
                <option value="ученик">Ученик / Ученица</option>
                <option value="коллега">Коллега</option>
                <option value="другое">Другое</option>
              </select>
            </div>
          </div>

          <div id="editStudyBlock">
            <label style="margin-top:14px">Обучение у Т.И. Хитровой</label>
            <div class="study-box-wrap">
              <label class="study-check-row">
                <input type="checkbox" id="editChoirSchool"> Хоровое училище им. М.И. Глинки
              </label>
              <div id="editChoirBox" style="display:none; margin:4px 0 8px 24px">
                <input type="number" id="editChoirEnd" placeholder="год выпуска (напр. 1998)" min="1955" max="2026">
              </div>

              <label class="study-check-row">
                <input type="checkbox" id="editConservatory"> СПбГК им. Н.А. Римского-Корсакова
              </label>
              <div id="editConservatoryBox" style="display:none; margin:4px 0 8px 24px">
                <input type="number" id="editConservatoryEnd" placeholder="год выпуска (напр. 2003)" min="1955" max="2026">
              </div>

              <label class="study-check-row">

function formatNotes(text){
  if(!text) return "";
  const lines = text.split("\n");
  let html = "";
  let inList = false;

  for(const rawLine of lines){
    const line = rawLine.trim();
    if(!line){
      if(inList){ html += "</ul>"; inList = false; }
      continue;
    }
    if(line.startsWith("•") || line.startsWith("-")){
      if(!inList){ html += '<ul class="notes-bullet-list">'; inList = true; }
      const itemContent = line.replace(/^[•\-]\s*/, "");
      html += `<li>${escapeHtml(itemContent)}</li>`;
    } else {
      if(inList){ html += "</ul>"; inList = false; }
      html += `<p class="notes-paragraph">${escapeHtml(line)}</p>`;
    }
  }
  if(inList) html += "</ul>";
  return html;
}

function renderPeersWidget(p, students){
  const sideEl = document.getElementById("peersSidebar");
  if(!students || !students.length || p.relation_type !== "ученик"){
    sideEl.style.display = "none";
    return;
  }

  const tabs = [];
  if(p.studied_conservatory || p.conservatory_end){
    tabs.push({ id: "cons", label: "СПбГК", year: p.conservatory_end || p.study_end || 2003 });
  }
  if(p.studied_choir_school || p.choir_school_end){
    tabs.push({ id: "choir", label: "Хор. училище", year: p.choir_school_end || 1998 });
  }
  if(p.studied_assistantship || p.assistantship_end){
    tabs.push({ id: "assist", label: "Ассистентура", year: p.assistantship_end || 2005 });
  }
  if(!tabs.length){
    tabs.push({ id: "all", label: "Все годы", year: p.study_end || 2000 });
  }

  let activeTab = tabs[0];
  let showAllYears = false;

  function buildListHtml(targetYear, tabId){
    let withYear = [];
    let withoutYear = [];

    students.forEach(s => {
      let yr = s.study_end;
      if(tabId === "choir" && s.choir_school_end) yr = s.choir_school_end;
      if(tabId === "cons" && s.conservatory_end) yr = s.conservatory_end;
      if(tabId === "assist" && s.assistantship_end) yr = s.assistantship_end;
      if(s.id === p.id) yr = targetYear;

      const tag = s.studied_conservatory ? "СПбГК" : (s.studied_choir_school ? "Хор. уч." : "");
      const obj = { student: s, year: yr, tag, isCurrent: s.id === p.id };
      if(yr) withYear.push(obj);
      else withoutYear.push(obj);
    });

    const totalCount = withYear.length;
    if(!showAllYears && targetYear){
      withYear = withYear.filter(it => Math.abs(it.year - targetYear) <= 6);
    }

    withYear.sort((a, b) => a.year - b.year);

    const renderItem = (it) => {
      const s = it.student;
      const initial = (s.full_name || "?").trim().charAt(0).toUpperCase();
      const avHtml = s.avatar_url
        ? `<img src="${escapeHtml(s.avatar_url)}" alt="" class="peer-avatar-mini">`
        : `<div class="peer-avatar-initial">${initial}</div>`;

      return `
        <a href="person.html?id=${s.id}" class="peer-item ${it.isCurrent ? "current" : ""}" data-id="${s.id}">
          <div class="peer-year-tag">${it.year ? it.year + " г." : "—"}</div>
          ${avHtml}
          <div class="peer-info">
            <div class="peer-name">${escapeHtml(s.full_name)}</div>
            <div class="peer-sub">
              ${it.isCurrent ? `<span class="peer-here-badge">● Вы просматриваете</span>` : (it.tag ? `<span>${it.tag}</span>` : "")}
            </div>
          </div>
        </a>
      `;
    };

    let html = `<div class="peers-col-head"><span class="col-yr-title">Выпуск</span><span class="col-name-title">Ученик</span></div>`;

    if(!withYear.length){
      html += `<div style="font-size:var(--fs-meta); font-family:var(--font-ui); color:var(--muted); padding:16px 8px; text-align:center">В диапазоне ±6 лет других выпускников пока нет.</div>`;
    } else {
      html += withYear.map(renderItem).join("");
    }

    if(showAllYears && withoutYear.length){
      html += `<div style="font-size:var(--fs-badge); font-family:var(--font-ui); font-weight:700; color:var(--muted); margin:8px 8px 4px; text-transform:uppercase; letter-spacing:.05em">Год выпуска не указан</div>`;
      html += withoutYear.map(renderItem).join("");
    }
    return { html, totalCount };
  }

  function renderSideContent(){
    const { html: listHtml, totalCount } = buildListHtml(activeTab.year, activeTab.id);
    const subText = showAllYears
      ? `Все выпуски (${totalCount} учеников)`
      : `Выпуски ${activeTab.year - 6}–${activeTab.year + 6} гг. (±6 лет)`;

    sideEl.innerHTML = `
      <div class="peers-widget">
        <div class="peers-header">
          <div class="peers-title">Учились вместе</div>
          <div class="peers-sub">${subText}</div>
          ${tabs.length > 1 ? `
            <div class="peers-tabs">
              ${tabs.map(t => `<button class="peers-tab-btn ${t.id === activeTab.id ? "active" : ""}" data-tab="${t.id}">${t.label} (${t.year})</button>`).join("")}
            </div>
          ` : ""}
        </div>
        <div class="peers-scroll-pane" id="peersPane">
          ${listHtml}
        </div>
        <div style="text-align:center; padding:6px 0 2px">
          <button class="peers-toggle-btn" id="btnToggleRange">
            ${showAllYears ? "Свернуть до диапазона ±6 лет" : `Показать все годы архива (${totalCount})`}
          </button>
        </div>
        <div class="peers-jump-btns">
          <button class="peers-jump-btn" id="btnScrollTop">↑ Раньше</button>
          <button class="peers-jump-btn" id="btnScrollCurrent">● К выпуску ${activeTab.year}</button>
          <button class="peers-jump-btn" id="btnScrollBottom">↓ Позже</button>
        </div>
      </div>
    `;

    sideEl.style.display = "block";

    sideEl.querySelectorAll(".peers-tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const found = tabs.find(t => t.id === btn.dataset.tab);
        if(found && found.id !== activeTab.id){
          activeTab = found;
          renderSideContent();
        }
      });
    });

    const btnToggle = document.getElementById("btnToggleRange");
    if(btnToggle){
      btnToggle.addEventListener("click", () => {
        showAllYears = !showAllYears;
        renderSideContent();
      });
    }

    const pane = document.getElementById("peersPane");
    const currentEl = pane.querySelector(".peer-item.current");

    function scrollToCurrent(){
      if(currentEl){
        currentEl.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }

    setTimeout(scrollToCurrent, 100);

    const btnCurrent = document.getElementById("btnScrollCurrent");
    if(btnCurrent) btnCurrent.addEventListener("click", scrollToCurrent);

    const btnTop = document.getElementById("btnScrollTop");
    if(btnTop) btnTop.addEventListener("click", () => pane.scrollTo({ top: 0, behavior: "smooth" }));

    const btnBottom = document.getElementById("btnScrollBottom");
    if(btnBottom) btnBottom.addEventListener("click", () => pane.scrollTo({ top: pane.scrollHeight, behavior: "smooth" }));
  }

  renderSideContent();
}

async function loadPerson(){
  if(!personId){
    location.href = "people.html";
    return;
  }
  const { data, error } = await sb.from("people").select("*").eq("id", personId).maybeSingle();
  if(error || !data){
    document.getElementById("personContent").innerHTML = `
      <div class="person-state">Человек не найден или был удалён. <br><br><a href="people.html" style="color:var(--accent)">← Вернуться к списку</a></div>
    `;
    return;
  }
  currentPerson = data;
  renderPerson(data);

  try{
    const { data: students } = await sb.from("people")
      .select("id, full_name, gender, relation_type, study_start, study_end, studied_choir_school, choir_school_end, studied_conservatory, conservatory_end, studied_assistantship, assistantship_end, avatar_url")
      .eq("relation_type", "ученик")
      .eq("status", "confirmed");
    if(students){
      allStudentsList = students;
      renderPeersWidget(data, students);
    }
  }catch(e){
    console.error("Failed to load peers:", e);
  }
}

function getPersonDiff(original, current){
  const patch = {};
  const fields = [
    { key: "full_name", type: "string" },
    { key: "gender", type: "string" },
    { key: "relation_type", type: "string" },
    { key: "studied_choir_school", type: "boolean" },
    { key: "choir_school_end", type: "number" },
    { key: "studied_conservatory", type: "boolean" },
    { key: "conservatory_end", type: "number" },
    { key: "studied_assistantship", type: "boolean" },
    { key: "assistantship_end", type: "number" },
    { key: "study_start", type: "number" },
    { key: "study_end", type: "number" },
    { key: "institution", type: "string" },
    { key: "notes", type: "string" },
    { key: "source", type: "string" },
    { key: "avatar_url", type: "string" }
  ];

  for(const f of fields){
    const k = f.key;
    const oldVal = original[k] ?? null;
    const newVal = current[k] ?? null;

    if(f.type === "boolean"){
      const bOld = !!oldVal;
      const bNew = !!newVal;
      if(bOld !== bNew) patch[k] = bNew;
    } else if(f.type === "number"){
      const nOld = (oldVal !== null && oldVal !== undefined && oldVal !== "") ? parseInt(oldVal, 10) : null;
      const nNew = (newVal !== null && newVal !== undefined && newVal !== "") ? parseInt(newVal, 10) : null;
      if(nOld !== nNew) patch[k] = nNew;
    } else {
      const sOld = (oldVal || "").trim();
      const sNew = (newVal || "").trim();
      if(sOld !== sNew){
        patch[k] = sNew || null;
      }
    }
  }

  return patch;
}

});

  const full_name = document.getElementById("editFullName").value.trim();
  if(!full_name){
    errEl.textContent = "Укажите имя и фамилию";
    errEl.style.display = "block";
    return;
  }

  const saveBtn = document.getElementById("btnSavePersonEdit");
  saveBtn.disabled = true;
  saveBtn.textContent = "Отправка…";

  try{
    let finalAvatarUrl = editingAvatarUrl;

    if(pendingAvatarFile){
      const ext = pendingAvatarFile.name.split(".").pop().toLowerCase() || "jpg";
      const filePath = `${currentPerson.id}_${Date.now()}.${ext}`;
      const { data: uploadData, error: uploadErr } = await sb.storage
        .from("person-avatars")
        .upload(filePath, pendingAvatarFile, { upsert: true });

      if(uploadErr) throw new Error("Ошибка загрузки фото: " + uploadErr.message);

      const { data: publicUrlData } = sb.storage
        .from("person-avatars")
        .getPublicUrl(filePath);
      finalAvatarUrl = publicUrlData.publicUrl;
    }

    const gender = document.getElementById("editGender").value || null;
    const relation_type = document.getElementById("editRelation").value;

    const studied_choir_school = document.getElementById("editChoirSchool").checked;
    const choir_school_end = (studied_choir_school && document.getElementById("editChoirEnd").value)
      ? parseInt(document.getElementById("editChoirEnd").value, 10) : null;

    const studied_conservatory = document.getElementById("editConservatory").checked;
    const conservatory_end = (studied_conservatory && document.getElementById("editConservatoryEnd").value)
      ? parseInt(document.getElementById("editConservatoryEnd").value, 10) : null;

    const studied_assistantship = document.getElementById("editAssistantship").checked;
    const assistantship_end = (studied_assistantship && document.getElementById("editAssistantEnd").value)
      ? parseInt(document.getElementById("editAssistantEnd").value, 10) : null;

    const studyStartRaw = document.getElementById("editStudyStart").value;
    const studyEndRaw = document.getElementById("editStudyEnd").value;
    let study_start = relation_type === "ученик" && studyStartRaw ? parseInt(studyStartRaw, 10) : null;
    let study_end = relation_type === "ученик" && studyEndRaw ? parseInt(studyEndRaw, 10) : null;
    if(!study_end && relation_type === "ученик"){
      study_end = Math.max(choir_school_end || 0, conservatory_end || 0, assistantship_end || 0) || null;
    }

    const institution = document.getElementById("editInstitution").value.trim() || null;
    const notes = document.getElementById("editNotes").value.trim() || null;
    const source = document.getElementById("editSource").value.trim() || null;
    const comment = document.getElementById("editRevisionComment").value.trim() || null;

    const newValues = {
      full_name,
      gender,
      relation_type,
      studied_choir_school,
      choir_school_end,
      studied_conservatory,
      conservatory_end,
      studied_assistantship,
      assistantship_end,
      study_start,
      study_end,
      institution,
      notes,
      source,
      avatar_url: finalAvatarUrl
    };

    const patch = getPersonDiff(currentPerson, newValues);

    if(Object.keys(patch).length === 0){
      errEl.textContent = "Вы не изменили ни одного поля";
      errEl.style.display = "block";
      saveBtn.disabled = false;
      saveBtn.textContent = "Отправить правку";
      return;
    }

    const { error: revErr } = await sb.from("revisions").insert({
      entity_type: "person",
      entity_id: currentPerson.id,
      kind: "update",
      patch,
      status: "pending",
      author_id: currentUser.id,
      author_name: (myProfile && myProfile.full_name) || currentUser.email || "Участник",
      comment
    });

    if(revErr) throw new Error(revErr.message);

    close_("editPersonOverlay");
    if(typeof showToast === "function") showToast("Правка отправлена на проверку");
    await updatePendingBanner(currentPerson.id);
    if(typeof updateModBadge === "function") updateModBadge();
  }catch(err){
    errEl.textContent = err.message;
    errEl.style.display = "block";
  }finally{
    saveBtn.disabled = false;
    saveBtn.textContent = "Отправить правку";
  }
});

// Инициализация поиска других людей в фиксированной панели
if(window.initPeopleSearch){
  window.initPeopleSearch(
    document.getElementById("personSearchInput"),
    document.getElementById("personSearchDropdown")
  );
}

const personStickyBar = document.getElementById("personStickyBar");
if(personStickyBar){
  window.addEventListener("scroll", () => {
    personStickyBar.classList.toggle("is-stuck", window.scrollY > 40);
  }, { passive: true });
}

window.addEventListener("authReady", loadPerson, { once: true });
</script>
</body>
</html>
