<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карточка человека — сайт памяти Т.И. Хитровой</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="fonts/pt-fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  .btn-back{
    display:inline-flex; align-items:center; gap:6px; color:var(--on-surface-variant); text-decoration:none;
    font:var(--t-label-large); margin-bottom:24px; transition:color .15s;
  }
  .btn-back:hover{color:var(--on-surface)}

  .person-toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    margin-bottom:24px;
  }

  .breadcrumbs{
    display:flex; align-items:center; flex-wrap:wrap; gap:8px;
    font:var(--t-label-medium); color:var(--on-surface-variant); line-height:1.4;
  }
  .breadcrumbs a{color:var(--on-surface-variant); text-decoration:none; transition:color .15s}
  .breadcrumbs a:hover{color:var(--on-surface)}
  .breadcrumbs .sep{color:var(--outline-variant); font-size:16px; display:inline-flex; align-items:center}
  .breadcrumbs .current{color:var(--on-surface); font-weight:500}

  .person-layout{
    display:grid;
    grid-template-columns:1fr 310px;
    gap:28px;
    align-items:start;
  }

  /* Основная карточка человека */
  .person-card-view{
    background:var(--surface-low); border:1px solid var(--outline-variant); border-radius:var(--r-m); padding:32px 36px;
  }

  .person-head-row{
    display:flex; align-items:flex-start; gap:22px; margin-bottom:26px; padding-bottom:24px;
    border-bottom:1px solid var(--outline-variant);
  }

  .person-avatar-wrap{flex:none}
  .person-avatar{
    width:92px; height:92px; border-radius:50%; object-fit:cover; display:flex; align-items:center; justify-content:center;
    background:var(--surface-high); border:1px solid var(--outline-variant);
    font:var(--t-display-small); font-weight:500; color:var(--primary);
  }

  .person-title-area{flex:1; min-width:0}
  .person-name{
    font:var(--t-headline-small); font-size:28px; line-height:36px; font-weight:500; margin:0 0 6px;
    color:var(--on-surface);
  }
  .person-role-line{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:12px}
  .person-role{font:var(--t-title-medium); color:var(--primary); font-weight:500}
  .person-badge{
    font:var(--t-label-medium); font-weight:500; letter-spacing:.02em;
    color:var(--tertiary); padding:2px 8px; border-radius:var(--r-xs);
    background:var(--tertiary-container);
  }
  .person-badge.st-rejected{color:var(--error); background:var(--error-container)}

  .person-actions{margin-top:14px; display:flex; align-items:center; gap:8px}

  .person-section{margin-bottom:24px}
  .person-section:last-of-type{margin-bottom:0}

  /* M3 list item (обучение у Т.И.) — иконка и текст в одной строке */
  .m3-list{display:flex; flex-direction:column}
  .m3-list-item{
    display:flex; align-items:center; gap:12px; padding:10px 0;
    border-bottom:1px solid var(--outline-variant);
  }
  .m3-list-item:last-child{border-bottom:none}
  .m3-list-item .list-icon{font-size:20px; color:var(--on-surface-variant); flex:none}
  .list-text{flex:1; min-width:0}
  .list-title{font:var(--t-title-medium); font-size:15px; color:var(--on-surface)}
  .list-sub{font:var(--t-body-medium); font-size:13px; color:var(--on-surface-variant); margin-top:2px}
  .list-badge{font:var(--t-label-medium); font-size:12px; color:var(--on-surface-variant); white-space:nowrap; flex:none}

  /* Заметки и биография */
  .notes-paragraph{
    margin:0 0 10px 0; color:var(--on-surface); line-height:1.6; font:var(--t-body-medium); font-size:15px; max-width:68ch;
  }
  .notes-bullet-list{
    margin:6px 0 12px 0; padding-left:20px; color:var(--on-surface); line-height:1.6; font:var(--t-body-medium); font-size:15px; max-width:68ch;
  }
  .notes-bullet-list li{margin-bottom:6px}

  .person-meta{
    margin-top:30px; padding-top:16px; border-top:1px solid var(--outline-variant);
    font:var(--t-label-medium); color:var(--on-surface-variant); line-height:1.6;
  }
  .person-meta a{color:var(--primary); text-decoration:none}
  .person-meta a:hover{text-decoration:underline}

  .person-state{padding:60px 24px; text-align:center; color:var(--on-surface-variant); font:var(--t-body-large)}

  /* Виджет «Учились вместе» (правая колонка) */
  .peers-widget{
    background:var(--surface-low); border:1px solid var(--outline-variant); border-radius:var(--r-m); padding:18px 16px;
    position:sticky; top:80px;
  }
  .peers-header{margin-bottom:12px}
  .peers-title{
    font:var(--t-title-medium); font-weight:500; color:var(--on-surface); margin:0 0 2px;
  }
  .peers-sub{font:var(--t-label-medium); color:var(--on-surface-variant)}

  .peers-col-head{
    display:flex; align-items:center; justify-content:space-between; padding:0 8px 6px;
    font:var(--t-label-medium); font-weight:500;
    color:var(--on-surface-variant);
    border-bottom:1px solid var(--outline-variant); margin-bottom:4px;
  }
  .col-yr-title{flex:none}
  .col-name-title{flex:none}

  .peers-scroll-pane{
    max-height:430px; overflow-y:auto; padding-right:4px; scroll-behavior:smooth;
    display:flex; flex-direction:column; gap:4px;
  }
  .peers-scroll-pane::-webkit-scrollbar{width:4px}
  .peers-scroll-pane::-webkit-scrollbar-thumb{background:var(--outline-variant); border-radius:4px}

  .peer-item{
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:var(--r-s);
    text-decoration:none; color:inherit; transition:background .1s, border-color .1s;
    border:1px solid transparent; font:var(--t-body-medium);
  }
  .peer-item:hover{background:var(--surface-high)}
  .peer-item.current{background:var(--secondary-container); border-color:var(--primary)}
  .peer-item .ava{
    width:28px; height:28px; border-radius:50%; background:var(--surface-highest);
    border:1px solid var(--outline-variant); display:flex; align-items:center; justify-content:center;
    font:var(--t-label-small); font-size:11px; font-weight:700; color:var(--on-surface-variant); flex:none; overflow:hidden;
  }
  .peer-item .ava img{width:100%; height:100%; object-fit:cover}
  .peer-item .name{
    font:var(--t-body-medium); font-weight:500; color:var(--on-surface); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .peer-item .yr{
    font:var(--t-label-medium); font-weight:500; color:var(--on-surface-variant); flex:none; text-align:right;
  }
  .peer-item.current .yr{color:var(--primary); font-weight:700}

  .peers-jump-btns{
    display:flex; justify-content:space-between; padding-top:10px; margin-top:10px;
    border-top:1px solid var(--outline-variant); font:var(--t-label-medium);
  }
  .peers-jump-btn{
    background:none; border:none; color:var(--on-surface-variant); cursor:pointer;
    padding:4px 6px; border-radius:var(--r-xs); transition:color .1s, background .1s;
    font:var(--t-label-medium);
  }
  .peers-jump-btn:hover{color:var(--on-surface); background:var(--surface-high)}

  /* Модалка редактирования: аватар и специфичные поля */
  .avatar-edit-box{
    display:flex; align-items:center; gap:16px; margin:8px 0 14px;
    padding:12px 14px; background:var(--surface-mid); border:1px solid var(--outline-variant); border-radius:var(--r-s);
  }
  .avatar-preview-img{
    width:64px; height:64px; border-radius:50%; object-fit:cover; display:block;
    background:var(--surface); border:1px solid var(--outline-variant);
  }
  .avatar-preview-empty{
    width:64px; height:64px; border-radius:50%; background:var(--surface); border:1px solid var(--outline-variant);
    display:flex; align-items:center; justify-content:center;
    font:var(--t-title-large); font-weight:700; color:var(--on-surface-variant);
  }
  .avatar-edit-actions{display:flex; flex-direction:column; gap:6px}

  #editChoirBox input, #editConservatoryBox input, #editAssistantBox input {
    width: 100%;
    box-sizing: border-box;
    background: var(--surface);
    border: 1px solid var(--outline-variant);
    color: var(--on-surface);
    padding: 8px 12px;
    border-radius: var(--r-xs);
    font: var(--t-body-medium);
    outline: none;
    transition: border-color .15s;
  }
  #editChoirBox input:focus, #editConservatoryBox input:focus, #editAssistantBox input:focus {
    border-color: var(--primary);
  }

  .person-search-dropdown{
    display:none; position:absolute; top:calc(100% + 6px); right:0; width:320px; max-width:90vw;
    background:var(--surface-high); border:1px solid var(--outline-variant); border-radius:var(--r-m);
    box-shadow:0 8px 24px rgba(0,0,0,.12); max-height:360px; overflow-y:auto; z-index:50; padding:6px;
  }
  .person-search-dropdown.open{display:block}
  .person-search-item{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--r-s);
    text-decoration:none; color:var(--on-surface); transition:background .1s; cursor:pointer;
  }
  .person-search-item:hover, .person-search-item.selected{background:var(--surface-highest)}
  .person-search-avatar{
    width:28px; height:28px; border-radius:50%; background:var(--surface-highest); border:1px solid var(--outline-variant);
    display:flex; align-items:center; justify-content:center; font:var(--t-label-medium);
    font-size:11px; font-weight:700; color:var(--on-surface); flex:none; overflow:hidden;
  }
  .person-search-avatar img{width:100%; height:100%; object-fit:cover}
  .person-search-info{flex:1; min-width:0}
  .person-search-name{font:var(--t-body-medium); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--on-surface)}
  .person-search-sub{font:var(--t-label-medium); color:var(--on-surface-variant); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px}
  .person-search-empty{padding:14px 10px; font:var(--t-body-medium); color:var(--on-surface-variant); text-align:center}

  @media (max-width:860px){
    .person-layout{grid-template-columns:1fr; gap:24px}
    .peers-widget{position:static; max-width:100%}
  }
  @media (max-width:640px){
    .person-card-view{padding:20px 16px}
    .person-head-row{flex-direction:column; align-items:center; text-align:center; gap:16px}
    .person-role-line{justify-content:center}
    .person-actions{display:flex; justify-content:center}
    .person-toolbar{flex-direction:column; align-items:stretch; gap:10px}
    #personSearchWrap{max-width:100%; width:100%}
  }
  #personSearchWrap{max-width:280px; height:44px; margin-left:auto; border-radius:22px}
</style>

    </div>

    <div class="modal-body">
      <div class="modal-grid-2col">
        <!-- Левая колонка: фото, ФИО, статус, учёба -->
        <div class="modal-col">
          <label style="font:var(--t-label-medium); font-size:12px; color:var(--on-surface-variant); display:block; margin-bottom:6px">Фотография (аватарка)</label>
          <div class="avatar-edit-box">
            <div id="avatarPreviewHolder"></div>

              <input type="file" id="editAvatarInput" accept="image/*" style="display:none">
              <button type="button" class="btn tonal" id="btnTriggerUpload" style="font-size:13px; height:36px; padding:0 16px"><span class="sym" style="font-size:18px">upload</span> Загрузить фото</button>
              <button type="button" class="btn text" id="btnRemoveAvatar" style="display:none; color:var(--error); font-size:13px"><span class="sym" style="font-size:18px">delete</span> Удалить фото</button>

<script>
let currentPerson = null;
let allStudentsList = [];
let editingAvatarUrl = null;
let pendingAvatarFile = null;

const params = new URLSearchParams(location.search);
const personId = params.get("id");

function formatNotes(text){
  if(!text) return "";
  const lines = text.split("\n");
  let html = "";
  let inList = false;

  for(const rawLine of lines){
    const line = rawLine.trim();
    if(!line){
      if(inList){ html += "</ul>"; inList = false; }
      continue;
    }
    if(line.startsWith("•") || line.startsWith("-")){
      if(!inList){ html += '<ul class="notes-bullet-list">'; inList = true; }
      const itemContent = line.replace(/^[•\-]\s*/, "");
      html += `<li>${escapeHtml(itemContent)}</li>`;
    } else {
      if(inList){ html += "</ul>"; inList = false; }
      html += `<p class="notes-paragraph">${escapeHtml(line)}</p>`;
    }
  }
  if(inList) html += "</ul>";
  return html;
}

// «1975–1980», если известно начало, иначе «выпуск 1980» (W2)
function studyYearsLabel(start, end){
  if(!end) return start ? `с ${start} г.` : "выпуск";
  return start ? `${start}–${end} гг.` : `выпуск ${end} г.`;
}

function renderEducation(p){
  const items = [];
  if(p.studied_choir_school){
    items.push({
      institution: "Хоровое училище им. М.И. Глинки",
      detail: "",
      year: studyYearsLabel(p.choir_school_start, p.choir_school_end)
    });
  }
  if(p.studied_conservatory){
    items.push({
      institution: "СПбГК им. Н.А. Римского-Корсакова",
      detail: "Дирижёрско-хоровой факультет",
      year: studyYearsLabel(p.conservatory_start, p.conservatory_end)
    });
  }
  if(p.studied_assistantship){
    items.push({
      institution: "Ассистентура-стажировка в СПбГК",
      detail: "",
      year: studyYearsLabel(p.assistantship_start, p.assistantship_end)

      detail: "",
      year: studyYearsLabel(p.study_start, p.study_end)
    });
  }
  if(!items.length) return "";

  return `
    <div class="person-section" style="margin-top:24px">
      <div class="group">Обучение у Т.И. Хитровой</div>
      <div class="m3-list">
        ${items.map(it => `

}

function renderPeersWidget(p, students){
  const sideEl = document.getElementById("peersSidebar");
  if(!students || !students.length || p.relation_type !== "ученик"){
    sideEl.style.display = "none";
    return;
  }

  const tabs = [];
  if(p.studied_conservatory || p.conservatory_end){
    tabs.push({ id: "cons", label: "СПбГК", year: p.conservatory_end || p.study_end || 2003 });
  }
  if(p.studied_choir_school || p.choir_school_end){
    tabs.push({ id: "choir", label: "Хор. училище", year: p.choir_school_end || 1998 });
  }
  if(p.studied_assistantship || p.assistantship_end){
    tabs.push({ id: "assist", label: "Ассистентура", year: p.assistantship_end || 2005 });
  }
  if(!tabs.length){
    tabs.push({ id: "all", label: "Все годы", year: p.study_end || 2000 });
  }

  let activeTab = tabs[0];
  let showAllYears = false;

  function buildListHtml(targetYear, tabId){
    let withYear = [];
    let withoutYear = [];

    students.forEach(s => {
      let yr = s.study_end;
      let yrStart = s.study_start;
      if(tabId === "choir" && s.choir_school_end){ yr = s.choir_school_end; yrStart = s.choir_school_start; }
      if(tabId === "cons" && s.conservatory_end){ yr = s.conservatory_end; yrStart = s.conservatory_start; }
      if(tabId === "assist" && s.assistantship_end){ yr = s.assistantship_end; yrStart = s.assistantship_start; }
      if(s.id === p.id) yr = targetYear;

      const tag = s.studied_conservatory ? "СПбГК" : (s.studied_choir_school ? "Хор. уч." : "");
      const obj = { student: s, year: yr, yearStart: yrStart, tag, isCurrent: s.id === p.id };
      if(yr) withYear.push(obj);
      else withoutYear.push(obj);
    });

    const totalCount = withYear.length;
    if(!showAllYears && targetYear){
      withYear = withYear.filter(it => Math.abs(it.year - targetYear) <= 6);
    }

    withYear.sort((a, b) => a.year - b.year);

    const renderItem = (it) => {
      const s = it.student;
      const initial = (s.full_name || "?").trim().charAt(0).toUpperCase();
      const avHtml = s.avatar_url
        ? `<img src="${escapeHtml(s.avatar_url)}" alt="">`
        : initial;

      return `
        <a href="person.html?id=${s.id}" class="peer-item ${it.isCurrent ? "current" : ""}" data-id="${s.id}">
          <div class="ava">${avHtml}</div>
          <div style="min-width:0; flex:1">
            <div class="name">${escapeHtml(s.full_name)}</div>
            <div style="font:var(--t-label-medium); font-size:12px; color:var(--on-surface-variant)">
              ${it.isCurrent ? "Вы просматриваете" : (it.tag || "")}
            </div>
          </div>
          <div class="yr">${it.year ? (it.yearStart ? `${it.yearStart}–${it.year}` : it.year + " г.") : "—"}</div>
        </a>
      `;
    };

    let html = `<div class="peers-col-head" style="font:var(--t-label-medium); font-size:12px; color:var(--on-surface-variant); padding:4px 8px; display:flex; justify-content:space-between"><span class="col-yr-title">Ученик</span><span class="col-name-title">Выпуск</span></div>`;

    if(!withYear.length){
      html += `<div style="font:var(--t-body-medium); font-size:13px; color:var(--on-surface-variant); padding:16px 8px; text-align:center">В диапазоне ±6 лет других выпускников пока нет.</div>`;
    } else {
      html += withYear.map(renderItem).join("");
    }

    if(showAllYears && withoutYear.length){
      html += `<div style="font:var(--t-label-medium); font-size:11px; font-weight:700; color:var(--on-surface-variant); margin:12px 8px 4px; text-transform:uppercase; letter-spacing:.05em">Год выпуска не указан</div>`;
      html += withoutYear.map(renderItem).join("");
    }
    return { html, totalCount };
  }

  function renderSideContent(){
    const { html: listHtml, totalCount } = buildListHtml(activeTab.year, activeTab.id);
    const subText = showAllYears
      ? `Все выпуски (${totalCount} учеников)`
      : `Выпуски ${activeTab.year - 6}–${activeTab.year + 6} гг. (±6 лет)`;

    sideEl.innerHTML = `
      <div class="peers-widget">
        <div class="peers-header">
          <div class="peers-title">Учились вместе</div>
          <div class="peers-sub">${subText}</div>
          ${tabs.length > 1 ? `
            <div class="chips" style="margin-top:8px; margin-bottom:12px">
              ${tabs.map(t => `<button type="button" class="chip ${t.id === activeTab.id ? "on" : ""}" data-tab="${t.id}">${t.label} (${t.year})</button>`).join("")}
            </div>
          ` : ""}
        </div>
        <div class="peers-scroll-pane" id="peersPane">
          ${listHtml}
        </div>
        <div style="text-align:center; padding:12px 0 2px">
          <button type="button" class="btn text" id="btnToggleRange" style="font-size:13px">
            ${showAllYears ? "Свернуть до диапазона ±6 лет" : `Показать все годы архива (${totalCount})`}
          </button>
        </div>
        <div class="peers-jump-btns">
          <button class="peers-jump-btn" id="btnScrollTop">↑ Раньше</button>
          <button class="peers-jump-btn" id="btnScrollCurrent">● К выпуску ${activeTab.year}</button>
          <button class="peers-jump-btn" id="btnScrollBottom">↓ Позже</button>
        </div>
      </div>
    `;

    sideEl.style.display = "block";

    sideEl.querySelectorAll(".peers-tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const found = tabs.find(t => t.id === btn.dataset.tab);
        if(found && found.id !== activeTab.id){
          activeTab = found;
          renderSideContent();
        }
      });
    });

    const btnToggle = document.getElementById("btnToggleRange");
    if(btnToggle){
      btnToggle.addEventListener("click", () => {
        showAllYears = !showAllYears;
        renderSideContent();
      });
    }

    const pane = document.getElementById("peersPane");
    const currentEl = pane.querySelector(".peer-item.current");

    function scrollToCurrent(){
      if(currentEl){
        currentEl.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }

    setTimeout(scrollToCurrent, 100);

    const btnCurrent = document.getElementById("btnScrollCurrent");
    if(btnCurrent) btnCurrent.addEventListener("click", scrollToCurrent);

    const btnTop = document.getElementById("btnScrollTop");
    if(btnTop) btnTop.addEventListener("click", () => pane.scrollTo({ top: 0, behavior: "smooth" }));

    const btnBottom = document.getElementById("btnScrollBottom");
    if(btnBottom) btnBottom.addEventListener("click", () => pane.scrollTo({ top: pane.scrollHeight, behavior: "smooth" }));
  }

  renderSideContent();
}

      .select("id, full_name, gender, relation_type, study_start, study_end, studied_choir_school, choir_school_end, studied_conservatory, conservatory_end, studied_assistantship, assistantship_end, avatar_url, notable")

function getPersonDiff(original, current){
  const patch = {};
  const fields = [
    { key: "full_name", type: "string" },
    { key: "last_name", type: "string" },
    { key: "first_name", type: "string" },
    { key: "patronymic", type: "string" },
    { key: "gender", type: "string" },
    { key: "relation_type", type: "string" },
    { key: "studied_choir_school", type: "boolean" },
    { key: "choir_school_start", type: "number" },
    { key: "choir_school_end", type: "number" },
    { key: "studied_conservatory", type: "boolean" },
    { key: "conservatory_start", type: "number" },
    { key: "conservatory_end", type: "number" },
    { key: "studied_assistantship", type: "boolean" },
    { key: "assistantship_start", type: "number" },
    { key: "assistantship_end", type: "number" },
    { key: "study_start", type: "number" },
    { key: "study_end", type: "number" },
    { key: "institution", type: "string" },
    { key: "notes", type: "string" },
    { key: "source", type: "string" },
    { key: "notable", type: "boolean" },
    { key: "avatar_url", type: "string" }
  ];

  for(const f of fields){
    const k = f.key;
    const oldVal = original[k] ?? null;
    const newVal = current[k] ?? null;

    if(f.type === "boolean"){
      const bOld = !!oldVal;
      const bNew = !!newVal;
      if(bOld !== bNew) patch[k] = bNew;
    } else if(f.type === "number"){
      const nOld = (oldVal !== null && oldVal !== undefined && oldVal !== "") ? parseInt(oldVal, 10) : null;
      const nNew = (newVal !== null && newVal !== undefined && newVal !== "") ? parseInt(newVal, 10) : null;
      if(nOld !== nNew) patch[k] = nNew;
    } else {
      const sOld = (oldVal || "").trim();
      const sNew = (newVal || "").trim();
      if(sOld !== sNew){
        patch[k] = sNew || null;
      }
    }
  }

  return patch;
}

function syncEditStudyBlock(rel){

  const classmate = rel === "однокурсник" || rel === "одноклассник";
  block.style.display = (rel === "ученик" || classmate) ? "block" : "none";

  [box, box && box.previousElementSibling].forEach(el => { if(el) el.style.display = classmate ? "none" : ""; });

  if(yearsLbl) yearsLbl.textContent = classmate ? "Годы учёбы вместе с Т.И." : "Или другие годы учёбы";
}

  document.getElementById("editChoirBox").style.display = e.target.checked ? "block" : "none";
});

document.getElementById("editConservatory").addEventListener("change", e => {
  document.getElementById("editConservatoryBox").style.display = e.target.checked ? "block" : "none";
});

document.getElementById("editAssistantship").addEventListener("change", e => {
  document.getElementById("editAssistantBox").style.display = e.target.checked ? "block" : "none";
});

document.getElementById("btnTriggerUpload").addEventListener("click", () => {
  document.getElementById("editAvatarInput").click();
});

document.getElementById("editAvatarInput").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!file.type.startsWith("image/")){
    alert("Пожалуйста, выберите файл изображения (JPG, PNG, WebP)");
    return;
  }
  if(file.size > 5 * 1024 * 1024){
    alert("Размер файла не должен превышать 5 МБ");
    return;
  }
  pendingAvatarFile = file;
  const tempUrl = URL.createObjectURL(file);
  updateAvatarPreview(tempUrl, document.getElementById("editLastName").value);
});

document.getElementById("btnRemoveAvatar").addEventListener("click", () => {
  editingAvatarUrl = null;
  pendingAvatarFile = null;
  document.getElementById("editAvatarInput").value = "";
  updateAvatarPreview(null, document.getElementById("editLastName").value);
});

document.getElementById("btnSavePersonEdit").addEventListener("click", async () => {
  if(!currentPerson) return;
  const errEl = document.getElementById("errEditPerson");
  errEl.style.display = "none";

  const last_name = document.getElementById("editLastName").value.trim();
  const first_name = document.getElementById("editFirstName").value.trim();
  const patronymic = document.getElementById("editPatronymic").value.trim();
  const full_name = [last_name, first_name, patronymic].filter(Boolean).join(" ");
  if(!last_name || !first_name){
    errEl.textContent = "Укажите фамилию и имя";
    errEl.style.display = "block";
    return;
  }

  const saveBtn = document.getElementById("btnSavePersonEdit");
  saveBtn.disabled = true;
  saveBtn.textContent = "Отправка…";

  try{
    let finalAvatarUrl = editingAvatarUrl;

    if(pendingAvatarFile){
      const ext = pendingAvatarFile.name.split(".").pop().toLowerCase() || "jpg";
      const filePath = `${currentPerson.id}_${Date.now()}.${ext}`;
      const { data: uploadData, error: uploadErr } = await sb.storage
        .from("person-avatars")
        .upload(filePath, pendingAvatarFile, { upsert: true });

      if(uploadErr) throw new Error("Ошибка загрузки фото: " + uploadErr.message);

      const { data: publicUrlData } = sb.storage
        .from("person-avatars")
        .getPublicUrl(filePath);
      finalAvatarUrl = publicUrlData.publicUrl;
    }

    const gender = document.getElementById("editGender").value || null;
    const relation_type = document.getElementById("editRelation").value;

    const studied_choir_school = document.getElementById("editChoirSchool").checked;
    const choir_school_start = (studied_choir_school && document.getElementById("editChoirStart").value)
      ? parseInt(document.getElementById("editChoirStart").value, 10) : null;
    const choir_school_end = (studied_choir_school && document.getElementById("editChoirEnd").value)
      ? parseInt(document.getElementById("editChoirEnd").value, 10) : null;

    const studied_conservatory = document.getElementById("editConservatory").checked;
    const conservatory_start = (studied_conservatory && document.getElementById("editConservatoryStart").value)
      ? parseInt(document.getElementById("editConservatoryStart").value, 10) : null;
    const conservatory_end = (studied_conservatory && document.getElementById("editConservatoryEnd").value)
      ? parseInt(document.getElementById("editConservatoryEnd").value, 10) : null;

    const studied_assistantship = document.getElementById("editAssistantship").checked;
    const assistantship_start = (studied_assistantship && document.getElementById("editAssistantStart").value)
      ? parseInt(document.getElementById("editAssistantStart").value, 10) : null;
    const assistantship_end = (studied_assistantship && document.getElementById("editAssistantEnd").value)
      ? parseInt(document.getElementById("editAssistantEnd").value, 10) : null;

    const studyStartRaw = document.getElementById("editStudyStart").value;
    const studyEndRaw = document.getElementById("editStudyEnd").value;
    const hasYears = relation_type === "ученик" || relation_type === "однокурсник" || relation_type === "одноклассник";
    let study_start = hasYears && studyStartRaw ? parseInt(studyStartRaw, 10) : null;
    let study_end = hasYears && studyEndRaw ? parseInt(studyEndRaw, 10) : null;
    if(!study_end && relation_type === "ученик"){
      study_end = Math.max(choir_school_end || 0, conservatory_end || 0, assistantship_end || 0) || null;
    }
    if(!study_start && relation_type === "ученик"){
      const startCandidates = [choir_school_start, conservatory_start, assistantship_start].filter(Boolean);
      if(startCandidates.length) study_start = Math.min(...startCandidates);
    }

    const institution = document.getElementById("editInstitution").value.trim() || null;
    const notes = document.getElementById("editNotes").value.trim() || null;
    const source = document.getElementById("editSource").value.trim() || null;
    const notable = document.getElementById("editNotable").checked;
    const comment = document.getElementById("editRevisionComment").value.trim() || null;

    const newValues = {
      full_name,
      last_name,
      first_name,
      patronymic: patronymic || null,
      gender,
      relation_type,
      studied_choir_school,
      choir_school_start,
      choir_school_end,
      studied_conservatory,
      conservatory_start,
      conservatory_end,
      studied_assistantship,
      assistantship_start,
      assistantship_end,
      study_start,
      study_end,
      institution,
      notes,
      source,
      notable,
      avatar_url: finalAvatarUrl
    };

    const patch = getPersonDiff(currentPerson, newValues);

    if(Object.keys(patch).length === 0){
      errEl.textContent = "Вы не изменили ни одного поля";
      errEl.style.display = "block";
      saveBtn.disabled = false;
      saveBtn.textContent = "Отправить правку";
      return;
    }

    const { error: revErr } = await sb.from("revisions").insert({
      entity_type: "person",
      entity_id: currentPerson.id,
      kind: "update",
      patch,
      status: "pending",
      author_id: currentUser.id,
      author_name: (myProfile && myProfile.full_name) || currentUser.email || "Участник",
      comment
    });

    if(revErr) throw new Error(revErr.message);

    close_("editPersonOverlay");
    if(typeof showToast === "function") showToast("Правка отправлена на проверку");
    await updatePendingBanner(currentPerson.id);
    if(typeof updateModBadge === "function") updateModBadge();
  }catch(err){
    errEl.textContent = err.message;
    errEl.style.display = "block";
  }finally{
    saveBtn.disabled = false;
    saveBtn.textContent = "Отправить правку";
  }
});

document.getElementById("btnEditPersonBarAction")?.addEventListener("click", () => {
  document.getElementById("btnSavePersonEdit")?.click();
});

// Инициализация поиска других людей в фиксированной панели
if(window.initPeopleSearch){
  window.initPeopleSearch(
    document.getElementById("personSearchInput"),
    document.getElementById("personSearchDropdown")
  );
}

window.addEventListener("authReady", loadPerson, { once: true });
</script>
</body>
</html>
