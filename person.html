<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карточка человека — сайт памяти Т.И. Хитровой</title>
<link rel="stylesheet" href="style.css">
<style>
  .person-wrap{max-width:1040px; margin:0 auto; padding:5vh 24px 10vh}
  .btn-back{
    display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none;
    font-size:13px; margin-bottom:24px; transition:color .15s; font-family:inherit;
  }
  .btn-back:hover{color:var(--ink)}

  .person-layout{
    display:grid;
    grid-template-columns:1fr 310px;
    gap:28px;
    align-items:start;
  }

  /* Основная карточка человека */
  .person-card-view{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:32px 36px;
    box-shadow:0 2px 16px rgba(0,0,0,.03);
  }

  .person-head-row{
    display:flex; align-items:flex-start; gap:22px; margin-bottom:26px; padding-bottom:24px;
    border-bottom:1px solid var(--line);
  }

  .person-avatar-wrap{flex:none}
  .person-avatar{
    width:92px; height:92px; border-radius:50%; object-fit:cover; display:block;
    background:var(--paper); border:1px solid var(--line);
  }
  .person-avatar-placeholder{
    width:92px; height:92px; border-radius:50%; background:var(--paper); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-head); font-weight:700; font-size:36px; color:var(--accent);
  }

  .person-title-area{flex:1; min-width:0}
  .person-name{
    font-family:var(--font-head); font-weight:700; font-size:30px; margin:0 0 6px;
    line-height:1.18; color:var(--ink);
  }
  .person-role-line{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:12px}
  .person-role{font-size:14px; color:var(--accent); font-weight:600}
  .person-badge{
    font-family:var(--font-head); font-weight:700; font-size:10.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--warn); padding:2px 8px; border-radius:10px;
    background:rgba(164,100,31,.08);
  }
  .person-badge.st-rejected{color:#b0413e; background:rgba(176,65,62,.08)}

  .person-actions{margin-top:14px}
  .btn-edit-card{
    background:none; border:1px solid var(--line); color:var(--muted); cursor:pointer;
    font-size:12px; font-family:inherit; padding:5px 13px; border-radius:14px;
    transition:border-color .15s, color .15s, background .15s;
  }
  .btn-edit-card:hover{border-color:var(--ink); color:var(--ink); background:#faf8f5}

  .person-section{margin-bottom:24px}
  .person-section:last-of-type{margin-bottom:0}
  .person-section-label{
    font-family:var(--font-head); font-weight:700; font-size:11.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); margin-bottom:10px;
  }

  /* Вехи образования — визуальные блоки вместо сплошного текста */
  .edu-list{display:flex; flex-direction:column; gap:8px}
  .edu-item-card{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    background:var(--paper); border:1px solid var(--line); border-radius:8px;
    padding:10px 14px;
  }
  .edu-item-info{display:flex; flex-direction:column; gap:2px; min-width:0}
  .edu-item-title{
    font-family:var(--font-head); font-weight:700; font-size:14.5px; color:var(--ink);
    line-height:1.3;
  }
  .edu-item-detail{font-size:12px; color:var(--muted)}
  .edu-item-year-badge{
    font-family:var(--font-head); font-weight:700; font-size:13px; color:var(--accent);
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:3px 9px; white-space:nowrap; flex:none;
  }

  .inst-box{
    background:#fff; border-left:3px solid var(--accent); padding:2px 0 2px 12px;
    font-size:14.5px; color:var(--ink); line-height:1.45;
  }

  /* Форматированные заметки и биография */
  .notes-paragraph{
    margin:0 0 10px 0; color:#2c3036; line-height:1.65; font-size:14.5px;
  }
  .notes-bullet-list{
    margin:6px 0 12px 0; padding-left:18px; color:#2c3036; line-height:1.65; font-size:14.5px;
  }
  .notes-bullet-list li{margin-bottom:6px}

  .person-meta{
    margin-top:30px; padding-top:16px; border-top:1px solid #f0efec;
    font-size:11.5px; color:var(--muted); line-height:1.6;
  }
  .person-meta a{color:var(--accent); text-decoration:none}
  .person-meta a:hover{text-decoration:underline}

  .person-state{padding:60px 24px; text-align:center; color:var(--muted); font-size:15px}

  /* Виджет «Учились вместе» (правая колонка) */
  .peers-widget{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 16px;
    box-shadow:0 2px 14px rgba(0,0,0,.02); position:sticky; top:20px;
  }
  .peers-header{margin-bottom:12px}
  .peers-title{
    font-family:var(--font-head); font-weight:700; font-size:15px; color:var(--ink); margin:0 0 2px;
  }
  .peers-sub{font-size:11.5px; color:var(--muted)}

  .peers-tabs{display:flex; flex-wrap:wrap; gap:5px; margin:10px 0}
  .peers-tab-btn{
    background:var(--paper); border:1px solid var(--line); border-radius:12px;
    font-size:11px; font-family:inherit; padding:3px 9px; cursor:pointer; color:var(--muted);
    transition:all .12s;
  }
  .peers-tab-btn:hover{color:var(--ink); border-color:var(--ink)}
  .peers-tab-btn.active{background:var(--ink); color:#fff; border-color:var(--ink)}

  .peers-scroll-pane{
    max-height:430px; overflow-y:auto; padding-right:4px; scroll-behavior:smooth;
    display:flex; flex-direction:column; gap:4px;
  }
  .peers-scroll-pane::-webkit-scrollbar{width:4px}
  .peers-scroll-pane::-webkit-scrollbar-thumb{background:#dedad4; border-radius:4px}

  .peer-item{
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:7px;
    text-decoration:none; color:inherit; transition:background .1s, border-color .1s;
    border:1px solid transparent; font-size:12.5px;
  }
  .peer-item:hover{background:var(--paper)}
  .peer-item.current{background:#fbf8f2; border-color:var(--accent)}

  .peer-year-tag{
    font-family:var(--font-head); font-weight:700; font-size:12px; color:var(--muted);
    width:36px; flex:none; text-align:right;
  }
  .peer-item.current .peer-year-tag{color:var(--accent)}

  .peer-avatar-mini{
    width:24px; height:24px; border-radius:50%; object-fit:cover; background:var(--paper);
    border:1px solid var(--line); flex:none;
  }
  .peer-avatar-initial{
    width:24px; height:24px; border-radius:50%; background:var(--paper); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-head); font-weight:700; font-size:11px; color:var(--muted); flex:none;
  }

  .peer-info{min-width:0; flex:1}
  .peer-name{
    font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; font-size:12px;
  }
  .peer-sub{font-size:10.5px; color:var(--muted); display:flex; gap:4px; align-items:center}
  .peer-here-badge{
    font-family:var(--font-head); font-weight:700; font-size:9.5px; color:var(--accent);
    text-transform:uppercase; letter-spacing:.04em;
  }

  .peers-jump-btns{
    display:flex; justify-content:space-between; padding-top:10px; margin-top:10px;
    border-top:1px solid #f0efec; font-size:11px;
  }
  .peers-jump-btn{
    background:none; border:none; color:var(--muted); cursor:pointer; font-family:inherit;
    padding:2px 4px; border-radius:4px; transition:color .1s;
  }
  .peers-jump-btn:hover{color:var(--ink)}

  /* Модалка редактирования */
  .avatar-edit-box{
    display:flex; align-items:center; gap:16px; margin:8px 0 14px;
    padding:12px 14px; background:var(--paper); border:1px solid var(--line); border-radius:10px;
  }
  .avatar-preview-img{
    width:64px; height:64px; border-radius:50%; object-fit:cover; display:block;
    background:#fff; border:1px solid var(--line);
  }
  .avatar-preview-empty{
    width:64px; height:64px; border-radius:50%; background:#fff; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-head); font-weight:700; font-size:24px; color:var(--muted);
  }
  .avatar-edit-actions{display:flex; flex-direction:column; gap:6px}
  .btn-upload{
    background:#fff; border:1px solid var(--line); padding:6px 12px; border-radius:12px;
    font-size:12px; cursor:pointer; font-family:inherit; color:var(--ink);
  }
  .btn-upload:hover{border-color:var(--ink)}
  .btn-remove-avatar{
    background:none; border:none; color:#b0413e; font-size:11.5px; cursor:pointer;
    padding:0; text-align:left; text-decoration:underline; font-family:inherit;
  }

  @media (max-width:860px){
    .person-layout{grid-template-columns:1fr; gap:24px}
    .peers-widget{position:static; max-width:100%}
  }
  @media (max-width:640px){
    .person-wrap{padding:4vh 16px 8vh}
    .person-card-view{padding:22px 18px}
    .person-head-row{flex-direction:column; align-items:center; text-align:center; gap:16px}
    .person-role-line{justify-content:center}
    .person-name{font-size:26px}
    .person-actions{display:flex; justify-content:center}
    .edu-item-card{flex-direction:column; align-items:flex-start; gap:8px}
  }
</style>
</head>
<body data-page="people">

<div class="person-wrap">
  <a href="people.html" class="btn-back">← Все люди</a>
  <div class="person-layout">
    <div id="personContent">
      <div class="person-state">Загрузка информации…</div>
    </div>
    <div id="peersSidebar" style="display:none"></div>
  </div>
</div>

<!-- Модалка редактирования карточки человека -->
<div class="overlay" id="editPersonOverlay">
  <div class="modal" style="width:440px">
    <button class="close" data-close>×</button>
    <h2>Редактировать данные</h2>

    <label>Фотография (аватарка)</label>
    <div class="avatar-edit-box">
      <div id="avatarPreviewHolder"></div>
      <div class="avatar-edit-actions">
        <input type="file" id="editAvatarInput" accept="image/*" style="display:none">
        <button type="button" class="btn-upload" id="btnTriggerUpload">Загрузить фото</button>
        <button type="button" class="btn-remove-avatar" id="btnRemoveAvatar" style="display:none">Удалить фото</button>
      </div>
    </div>

    <label>Имя и фамилия</label>
    <input type="text" id="editFullName">

    <label>Пол</label>
    <select id="editGender">
      <option value="">Не указан</option>
      <option value="m">Мужской (ученик)</option>
      <option value="f">Женский (ученица)</option>
    </select>

    <label>Кем приходится Т.И.?</label>
    <select id="editRelation">
      <option value="ученик">Ученик / Ученица</option>
      <option value="коллега">Коллега</option>
      <option value="другое">Другое</option>
    </select>

    <div id="editStudyBlock">
      <label>Где учился(лась) у Т.И.?</label>
      <div style="margin-bottom:8px">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12.5px; margin:5px 0">
          <input type="checkbox" id="editChoirSchool" style="width:auto; margin:0"> Хоровое училище им. М.И. Глинки
        </label>
        <div id="editChoirBox" style="display:none; margin:4px 0 8px 24px">
          <input type="number" id="editChoirEnd" placeholder="год выпуска (напр. 1980)" min="1955" max="2026">
        </div>
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12.5px; margin:5px 0">
          <input type="checkbox" id="editConservatory" style="width:auto; margin:0"> СПбГК им. Н.А. Римского-Корсакова
        </label>
        <div id="editConservatoryBox" style="display:none; margin:4px 0 8px 24px">
          <input type="number" id="editConservatoryEnd" placeholder="год выпуска (напр. 1985)" min="1955" max="2026">
        </div>
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12.5px; margin:5px 0">
          <input type="checkbox" id="editAssistantship" style="width:auto; margin:0"> Ассистентура-стажировка в СПбГК
        </label>
        <div id="editAssistantBox" style="display:none; margin:4px 0 8px 24px">
          <input type="number" id="editAssistantEnd" placeholder="год окончания (напр. 2005)" min="1955" max="2026">
        </div>
      </div>
      <label>Или другие годы учёбы (необязательно)</label>
      <div style="display:flex; gap:8px">
        <input type="number" id="editStudyStart" placeholder="начало" min="1955" max="2026">
        <input type="number" id="editStudyEnd" placeholder="окончание" min="1955" max="2026">
      </div>
    </div>

    <label>Место работы / должность (необязательно)</label>
    <input type="text" id="editInstitution" placeholder="например, преподаватель Хорового училища">

    <label>Заметки, достижения, биография (необязательно)</label>
    <textarea id="editNotes" placeholder="Звания, достижения, каким запомнился"></textarea>

    <label>Источник / ссылка (необязательно)</label>
    <input type="text" id="editSource" placeholder="Откуда эта информация">

    <div class="err" id="errEditPerson"></div>
    <div class="row-actions">
      <button class="primary" id="btnSavePersonEdit">Сохранить</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>
let currentPerson = null;
let allStudentsList = [];
let editingAvatarUrl = null;
let pendingAvatarFile = null;

const params = new URLSearchParams(location.search);
const personId = params.get("id");

function formatNotes(text){
  if(!text) return "";
  const lines = text.split("\n");
  let html = "";
  let inList = false;

  for(const rawLine of lines){
    const line = rawLine.trim();
    if(!line){
      if(inList){ html += "</ul>"; inList = false; }
      continue;
    }
    if(line.startsWith("•") || line.startsWith("-")){
      if(!inList){ html += '<ul class="notes-bullet-list">'; inList = true; }
      const itemContent = line.replace(/^[•\-]\s*/, "");
      html += `<li>${escapeHtml(itemContent)}</li>`;
    } else {
      if(inList){ html += "</ul>"; inList = false; }
      html += `<p class="notes-paragraph">${escapeHtml(line)}</p>`;
    }
  }
  if(inList) html += "</ul>";
  return html;
}

function renderEducation(p){
  const items = [];
  if(p.studied_choir_school){
    items.push({
      institution: "Хоровое училище им. М.И. Глинки",
      detail: "Класс Т.И. Хитровой",
      year: p.choir_school_end ? `${p.choir_school_end} г.` : "выпуск"
    });
  }
  if(p.studied_conservatory){
    items.push({
      institution: "СПбГК им. Н.А. Римского-Корсакова",
      detail: "Дирижёрско-хоровой факультет · класс проф. Т.И. Хитровой",
      year: p.conservatory_end ? `${p.conservatory_end} г.` : "выпуск"
    });
  }
  if(p.studied_assistantship){
    items.push({
      institution: "Ассистентура-стажировка в СПбГК",
      detail: "Класс проф. Т.И. Хитровой",
      year: p.assistantship_end ? `${p.assistantship_end} г.` : "выпуск"
    });
  }
  if(!items.length && (p.study_start || p.study_end)){
    items.push({
      institution: "Обучение у Т.И. Хитровой",
      detail: "Класс Т.И. Хитровой",
      year: `${p.study_start || "…"}–${p.study_end || "…"} гг.`
    });
  }
  if(!items.length) return "";

  return `
    <div class="person-section">
      <div class="person-section-label">Обучение у Т.И. Хитровой</div>
      <div class="edu-list">
        ${items.map(it => `
          <div class="edu-item-card">
            <div class="edu-item-info">
              <div class="edu-item-title">${escapeHtml(it.institution)}</div>
              <div class="edu-item-detail">${escapeHtml(it.detail)}</div>
            </div>
            <div class="edu-item-year-badge">${escapeHtml(it.year)}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function renderMeta(p){
  const parts = [];
  if(p.created_by_name) parts.push(`Добавил(а): <b>${escapeHtml(p.created_by_name)}</b>`);
  if(p.created_at) parts.push(formatDate(p.created_at));
  if(p.updated_by_name){
    parts.push(`Последнее изменение: <b>${escapeHtml(p.updated_by_name)}</b> (${formatDate(p.updated_at)})`);
  }
  if(p.source){
    const escaped = escapeHtml(p.source);
    const linked = escaped.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    parts.push(`Источник: ${linked}`);
  }
  return parts.join(" · ");
}

function renderPerson(p){
  document.title = `${p.full_name} — Татьяна Ивановна Хитрова`;
  const initial = (p.full_name || "?").trim().charAt(0).toUpperCase();

  const avatarHtml = p.avatar_url
    ? `<img src="${escapeHtml(p.avatar_url)}" alt="${escapeHtml(p.full_name)}" class="person-avatar">`
    : `<div class="person-avatar-placeholder">${initial}</div>`;

  const roleText = typeof window.personRelationLabel === "function"
    ? window.personRelationLabel(p)
    : (p.relation_type || "Ученик(ца)");

  const isUnconfirmed = p.status !== "confirmed";

  const html = `
    <div class="person-card-view">
      <div class="person-head-row">
        <div class="person-avatar-wrap">${avatarHtml}</div>
        <div class="person-title-area">
          <h1 class="person-name">${escapeHtml(p.full_name)}</h1>
          <div class="person-role-line">
            <span class="person-role">${escapeHtml(roleText)}</span>
            ${isUnconfirmed ? `<span class="person-badge st-${p.status}">${p.status === "rejected" ? "Отклонено" : "На проверке"}</span>` : ""}
          </div>
          <div class="person-actions">
            <button class="btn-edit-card" id="btnOpenEdit">✎ Редактировать карточку</button>
          </div>
        </div>
      </div>

      ${renderEducation(p)}

      ${p.institution ? `
        <div class="person-section">
          <div class="person-section-label">Место работы / должность</div>
          <div class="inst-box">${escapeHtml(p.institution)}</div>
        </div>
      ` : ""}

      ${p.notes ? `
        <div class="person-section">
          <div class="person-section-label">Заметки и биография</div>
          <div class="notes-wrap">${formatNotes(p.notes)}</div>
        </div>
      ` : ""}

      <div class="person-meta">${renderMeta(p)}</div>
    </div>
  `;

  document.getElementById("personContent").innerHTML = html;

  document.getElementById("btnOpenEdit").addEventListener("click", () => {
    if(!currentUser){
      resetAuthModal();
      open_("authOverlay");
      return;
    }
    openEditModal(p);
  });
}

function renderPeersWidget(p, students){
  const sideEl = document.getElementById("peersSidebar");
  if(!students || !students.length || p.relation_type !== "ученик"){
    sideEl.style.display = "none";
    return;
  }

  const tabs = [];
  if(p.studied_conservatory || p.conservatory_end){
    tabs.push({ id: "cons", label: "СПбГК", year: p.conservatory_end || p.study_end || 2003 });
  }
  if(p.studied_choir_school || p.choir_school_end){
    tabs.push({ id: "choir", label: "Хор. училище", year: p.choir_school_end || 1998 });
  }
  if(p.studied_assistantship || p.assistantship_end){
    tabs.push({ id: "assist", label: "Ассистентура", year: p.assistantship_end || 2005 });
  }
  if(!tabs.length){
    tabs.push({ id: "all", label: "Все годы", year: p.study_end || 2000 });
  }

  let activeTab = tabs[0];

  function buildListHtml(targetYear, tabId){
    const withYear = [];
    const withoutYear = [];

    students.forEach(s => {
      let yr = s.study_end;
      if(tabId === "choir" && s.choir_school_end) yr = s.choir_school_end;
      if(tabId === "cons" && s.conservatory_end) yr = s.conservatory_end;
      if(tabId === "assist" && s.assistantship_end) yr = s.assistantship_end;
      if(s.id === p.id) yr = targetYear;

      const tag = s.studied_conservatory ? "СПбГК" : (s.studied_choir_school ? "Хор. уч." : "");
      const obj = { student: s, year: yr, tag, isCurrent: s.id === p.id };
      if(yr) withYear.push(obj);
      else withoutYear.push(obj);
    });

    withYear.sort((a, b) => a.year - b.year);

    const renderItem = (it) => {
      const s = it.student;
      const initial = (s.full_name || "?").trim().charAt(0).toUpperCase();
      const avHtml = s.avatar_url
        ? `<img src="${escapeHtml(s.avatar_url)}" alt="" class="peer-avatar-mini">`
        : `<div class="peer-avatar-initial">${initial}</div>`;

      return `
        <a href="person.html?id=${s.id}" class="peer-item ${it.isCurrent ? "current" : ""}" data-id="${s.id}">
          <div class="peer-year-tag">${it.year || "—"}</div>
          ${avHtml}
          <div class="peer-info">
            <div class="peer-name">${escapeHtml(s.full_name)}</div>
            <div class="peer-sub">
              ${it.isCurrent ? `<span class="peer-here-badge">● Вы просматриваете</span>` : (it.tag ? `<span>${it.tag}</span>` : "")}
            </div>
          </div>
        </a>
      `;
    };

    let html = withYear.map(renderItem).join("");
    if(withoutYear.length){
      html += `<div style="font-size:10.5px; color:var(--muted); margin:8px 8px 4px; text-transform:uppercase; letter-spacing:.05em">Год выпуска не указан</div>`;
      html += withoutYear.map(renderItem).join("");
    }
    return html;
  }

  function renderSideContent(){
    sideEl.innerHTML = `
      <div class="peers-widget">
        <div class="peers-header">
          <div class="peers-title">Учились вместе</div>
          <div class="peers-sub">Выпуски вокруг ${activeTab.year} г.</div>
          ${tabs.length > 1 ? `
            <div class="peers-tabs">
              ${tabs.map(t => `<button class="peers-tab-btn ${t.id === activeTab.id ? "active" : ""}" data-tab="${t.id}">${t.label} (${t.year})</button>`).join("")}
            </div>
          ` : ""}
        </div>
        <div class="peers-scroll-pane" id="peersPane">
          ${buildListHtml(activeTab.year, activeTab.id)}
        </div>
        <div class="peers-jump-btns">
          <button class="peers-jump-btn" id="btnScrollTop">↑ Раньше</button>
          <button class="peers-jump-btn" id="btnScrollCurrent">● К выпуску ${activeTab.year}</button>
          <button class="peers-jump-btn" id="btnScrollBottom">↓ Позже</button>
        </div>
      </div>
    `;

    sideEl.style.display = "block";

    sideEl.querySelectorAll(".peers-tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const found = tabs.find(t => t.id === btn.dataset.tab);
        if(found && found.id !== activeTab.id){
          activeTab = found;
          renderSideContent();
        }
      });
    });

    const pane = document.getElementById("peersPane");
    const currentEl = pane.querySelector(".peer-item.current");

    function scrollToCurrent(){
      if(currentEl){
        currentEl.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }

    setTimeout(scrollToCurrent, 100);

    const btnCurrent = document.getElementById("btnScrollCurrent");
    if(btnCurrent) btnCurrent.addEventListener("click", scrollToCurrent);

    const btnTop = document.getElementById("btnScrollTop");
    if(btnTop) btnTop.addEventListener("click", () => pane.scrollTo({ top: 0, behavior: "smooth" }));

    const btnBottom = document.getElementById("btnScrollBottom");
    if(btnBottom) btnBottom.addEventListener("click", () => pane.scrollTo({ top: pane.scrollHeight, behavior: "smooth" }));
  }

  renderSideContent();
}

async function loadPerson(){
  if(!personId){
    location.href = "people.html";
    return;
  }
  const { data, error } = await sb.from("people").select("*").eq("id", personId).maybeSingle();
  if(error || !data){
    document.getElementById("personContent").innerHTML = `
      <div class="person-state">Человек не найден или был удалён. <br><br><a href="people.html" style="color:var(--accent)">← Вернуться к списку</a></div>
    `;
    return;
  }
  currentPerson = data;
  renderPerson(data);

  try{
    const { data: students } = await sb.from("people")
      .select("id, full_name, gender, relation_type, study_start, study_end, studied_choir_school, choir_school_end, studied_conservatory, conservatory_end, studied_assistantship, assistantship_end, avatar_url")
      .eq("relation_type", "ученик")
      .eq("status", "confirmed");
    if(students){
      allStudentsList = students;
      renderPeersWidget(data, students);
    }
  }catch(e){
    console.error("Failed to load peers:", e);
  }
}

function updateAvatarPreview(url, name){
  const holder = document.getElementById("avatarPreviewHolder");
  const btnRemove = document.getElementById("btnRemoveAvatar");
  const initial = (name || "?").trim().charAt(0).toUpperCase();

  if(url){
    holder.innerHTML = `<img src="${escapeHtml(url)}" class="avatar-preview-img" alt="">`;
    btnRemove.style.display = "block";
  } else {
    holder.innerHTML = `<div class="avatar-preview-empty">${initial}</div>`;
    btnRemove.style.display = "none";
  }
}

function openEditModal(p){
  editingAvatarUrl = p.avatar_url || null;
  pendingAvatarFile = null;

  document.getElementById("editFullName").value = p.full_name || "";
  document.getElementById("editGender").value = p.gender || "";
  document.getElementById("editRelation").value = p.relation_type || "ученик";

  const studyBlock = document.getElementById("editStudyBlock");
  studyBlock.style.display = p.relation_type === "ученик" ? "block" : "none";

  const choirCheck = document.getElementById("editChoirSchool");
  const choirBox = document.getElementById("editChoirBox");
  choirCheck.checked = !!p.studied_choir_school;
  choirBox.style.display = choirCheck.checked ? "block" : "none";
  document.getElementById("editChoirEnd").value = p.choir_school_end || "";

  const consCheck = document.getElementById("editConservatory");
  const consBox = document.getElementById("editConservatoryBox");
  consCheck.checked = !!p.studied_conservatory;
  consBox.style.display = consCheck.checked ? "block" : "none";
  document.getElementById("editConservatoryEnd").value = p.conservatory_end || "";

  const assistCheck = document.getElementById("editAssistantship");
  const assistBox = document.getElementById("editAssistantBox");
  assistCheck.checked = !!p.studied_assistantship;
  assistBox.style.display = assistCheck.checked ? "block" : "none";
  document.getElementById("editAssistantEnd").value = p.assistantship_end || "";

  document.getElementById("editStudyStart").value = p.study_start || "";
  document.getElementById("editStudyEnd").value = p.study_end || "";
  document.getElementById("editInstitution").value = p.institution || "";
  document.getElementById("editNotes").value = p.notes || "";
  document.getElementById("editSource").value = p.source || "";
  document.getElementById("errEditPerson").style.display = "none";

  updateAvatarPreview(editingAvatarUrl, p.full_name);
  open_("editPersonOverlay");
}

document.getElementById("editRelation").addEventListener("change", e => {
  document.getElementById("editStudyBlock").style.display = e.target.value === "ученик" ? "block" : "none";
});

document.getElementById("editChoirSchool").addEventListener("change", e => {
  document.getElementById("editChoirBox").style.display = e.target.checked ? "block" : "none";
});

document.getElementById("editConservatory").addEventListener("change", e => {
  document.getElementById("editConservatoryBox").style.display = e.target.checked ? "block" : "none";
});

document.getElementById("editAssistantship").addEventListener("change", e => {
  document.getElementById("editAssistantBox").style.display = e.target.checked ? "block" : "none";
});

document.getElementById("btnTriggerUpload").addEventListener("click", () => {
  document.getElementById("editAvatarInput").click();
});

document.getElementById("editAvatarInput").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!file.type.startsWith("image/")){
    alert("Пожалуйста, выберите файл изображения (JPG, PNG, WebP)");
    return;
  }
  if(file.size > 5 * 1024 * 1024){
    alert("Размер файла не должен превышать 5 МБ");
    return;
  }
  pendingAvatarFile = file;
  const tempUrl = URL.createObjectURL(file);
  updateAvatarPreview(tempUrl, document.getElementById("editFullName").value);
});

document.getElementById("btnRemoveAvatar").addEventListener("click", () => {
  editingAvatarUrl = null;
  pendingAvatarFile = null;
  document.getElementById("editAvatarInput").value = "";
  updateAvatarPreview(null, document.getElementById("editFullName").value);
});

document.getElementById("btnSavePersonEdit").addEventListener("click", async () => {
  if(!currentPerson) return;
  const errEl = document.getElementById("errEditPerson");
  errEl.style.display = "none";

  const full_name = document.getElementById("editFullName").value.trim();
  if(!full_name){
    errEl.textContent = "Укажите имя и фамилию";
    errEl.style.display = "block";
    return;
  }

  const saveBtn = document.getElementById("btnSavePersonEdit");
  saveBtn.disabled = true;
  saveBtn.textContent = "Сохранение…";

  try{
    let finalAvatarUrl = editingAvatarUrl;

    if(pendingAvatarFile){
      const ext = pendingAvatarFile.name.split(".").pop().toLowerCase() || "jpg";
      const filePath = `${currentPerson.id}_${Date.now()}.${ext}`;
      const { data: uploadData, error: uploadErr } = await sb.storage
        .from("person-avatars")
        .upload(filePath, pendingAvatarFile, { upsert: true });

      if(uploadErr) throw new Error("Ошибка загрузки фото: " + uploadErr.message);

      const { data: publicUrlData } = sb.storage
        .from("person-avatars")
        .getPublicUrl(filePath);
      finalAvatarUrl = publicUrlData.publicUrl;
    }

    const gender = document.getElementById("editGender").value || null;
    const relation_type = document.getElementById("editRelation").value;

    const studied_choir_school = document.getElementById("editChoirSchool").checked;
    const choir_school_end = (studied_choir_school && document.getElementById("editChoirEnd").value)
      ? parseInt(document.getElementById("editChoirEnd").value, 10) : null;

    const studied_conservatory = document.getElementById("editConservatory").checked;
    const conservatory_end = (studied_conservatory && document.getElementById("editConservatoryEnd").value)
      ? parseInt(document.getElementById("editConservatoryEnd").value, 10) : null;

    const studied_assistantship = document.getElementById("editAssistantship").checked;
    const assistantship_end = (studied_assistantship && document.getElementById("editAssistantEnd").value)
      ? parseInt(document.getElementById("editAssistantEnd").value, 10) : null;

    const studyStartRaw = document.getElementById("editStudyStart").value;
    const studyEndRaw = document.getElementById("editStudyEnd").value;
    let study_start = relation_type === "ученик" && studyStartRaw ? parseInt(studyStartRaw, 10) : null;
    let study_end = relation_type === "ученик" && studyEndRaw ? parseInt(studyEndRaw, 10) : null;
    if(!study_end && relation_type === "ученик"){
      study_end = Math.max(choir_school_end || 0, conservatory_end || 0, assistantship_end || 0) || null;
    }

    const institution = document.getElementById("editInstitution").value.trim() || null;
    const notes = document.getElementById("editNotes").value.trim() || null;
    const source = document.getElementById("editSource").value.trim() || null;

    const updates = {
      full_name,
      gender,
      relation_type,
      studied_choir_school,
      choir_school_end,
      studied_conservatory,
      conservatory_end,
      studied_assistantship,
      assistantship_end,
      study_start,
      study_end,
      institution,
      notes,
      source,
      avatar_url: finalAvatarUrl,
      updated_by: currentUser.id,
      updated_by_name: (myProfile && myProfile.full_name) || currentUser.email,
      updated_at: new Date().toISOString()
    };

    const { data: updatedPerson, error: updateErr } = await sb
      .from("people")
      .update(updates)
      .eq("id", currentPerson.id)
      .select()
      .single();

    if(updateErr) throw new Error(updateErr.message);

    currentPerson = updatedPerson;
    renderPerson(updatedPerson);
    if(allStudentsList.length){
      const idx = allStudentsList.findIndex(s => s.id === updatedPerson.id);
      if(idx !== -1) allStudentsList[idx] = updatedPerson;
      renderPeersWidget(updatedPerson, allStudentsList);
    }
    close_("editPersonOverlay");
  }catch(err){
    errEl.textContent = err.message;
    errEl.style.display = "block";
  }finally{
    saveBtn.disabled = false;
    saveBtn.textContent = "Сохранить";
  }
});

initHeader();
