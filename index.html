<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Татьяна Ивановна Хитрова — сайт памяти</title>
<!-- TimelineJS 3.4.2, исходная сборка без изменений (vendor/timeline-3.4.2). Обновлять только осознанно. -->
<link title="timeline-styles" rel="stylesheet" href="vendor/timeline-3.4.2/css/timeline.css">
<script src="vendor/timeline-3.4.2/js/timeline.js"></script>
<link rel="stylesheet" href="fonts/pt-fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  html, body { height: 100%; overflow-x: hidden; }
  #timeline-embed { width: 100%; height: calc(100dvh - 64px); }
  @media (max-width: 600px) {
    #timeline-embed { height: calc(100dvh - 64px - 80px); } /* минус нижняя панель навигации */
  }
</style>
<script>document.documentElement.classList.add("preloading");</script>
</head>
<body data-page="index">

<div id="timeline-embed"></div>

<script src="vendor/supabase-js-2.116.0/supabase.js"></script>
<script src="app.js"></script>
<script>
function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

async function loadTimeline(){
  let list = [];
  try {
    const { data, error } = await sb.from("events").select("*").neq("status", "archived").order("event_year");
    if(!error && data) list = data;
  } catch(e){
    console.warn("Не удалось загрузить события:", e);
  }

  const events = list.map(e => ({
    start_date: { year: String(e.event_year) },
    text: {
      headline: escapeHtml(e.title) + (e.status === "confirmed" ? "" : " (ждёт проверки)"),
      text: "<p>" + escapeHtml(e.description) + "</p>"
    }
  }));

  const data = {
    title: {
      // подпись (автор фото) добавим, когда будет известен; имя под фото не дублируем
      media: { url: "photo/main.jpg", caption: "", credit: "" },
      text: {
        headline: "Татьяна Ивановна Хитрова",
        text: "<p>Заслуженный деятель искусств РФ, профессор кафедры хорового дирижирования Санкт-Петербургской государственной консерватории им. Н.А. Римского-Корсакова</p>"
      }
    },
    events: events.length ? events : [{
      start_date: { year: "1940" },
      text: { headline: "Пока пусто", text: "<p>События появятся здесь, как только кто-то добавит первую запись.</p>" }
    }]
  };

  watchPhoto();
  window.timeline = new TL.Timeline("timeline-embed", data, {
    language: "ru",
    font: "default",
    // шрифты и перевод берём из vendor/, а не с CDN Knight Lab (там путь по умолчанию)
    script_path: new URL("vendor/timeline-3.4.2/js/", location.href).href
  });
  window.timeline.on("loaded", () => pageReady());
  setTimeout(pageReady, 3000); // если событие не придёт
}

// Отступ слева = левый край фото таймлайна. Считаем, когда фото появилось, загрузилось, после шрифтов и при ресайзе.
function alignNavToPhoto(){
  if(window.innerWidth <= 600) return;
  const photo = document.querySelector("#timeline-embed img");
  if(!photo) return;
  const r = photo.getBoundingClientRect();
  if(r.width < 10 || r.left <= 0) return;   // фото ещё без размеров
  setNavLeft(Math.round(r.left));
}
function watchPhoto(){
  const box = document.getElementById("timeline-embed");
  const hook = photo => {
    photo.addEventListener("load", alignNavToPhoto);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(alignNavToPhoto);
    alignNavToPhoto();
    [250, 700, 1500].forEach(t => setTimeout(alignNavToPhoto, t));   // TimelineJS раскладывает слайд не сразу
  };
  const existing = box.querySelector("img");
  if(existing){ hook(existing); }
  else {
    const mo = new MutationObserver(() => {
      const photo = box.querySelector("img");
      if(photo){ mo.disconnect(); hook(photo); }
    });
    mo.observe(box, { childList: true, subtree: true });
  }
  // страховка: если фото не загрузилось, не держим вкладки скрытыми
  setTimeout(() => document.documentElement.classList.add("nav-ready"), 2500);
}
window.addEventListener("resize", alignNavToPhoto);

loadTimeline();
</script>
</body>
</html>
