<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Татьяна Ивановна Хитрова — сайт памяти</title>
<link title="timeline-styles" rel="stylesheet" href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css">
<script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  html,body{height:100%; overflow-x:hidden}
  #timeline-embed{width:100%; height:calc(100dvh - 44px)}
  .nav-hint{
    position:fixed; right:20px; bottom:22%;
    font-size:11.5px; color:var(--muted); background:#fff; padding:6px 14px; border:1px solid var(--line);
    border-radius:8px; z-index:15; opacity:1; transition:opacity .8s ease; pointer-events:none;
  }
  .nav-hint.hide{opacity:0}
  .nav-hint .hint-text{
    display:inline-block; animation:navHintPulse 2.6s ease-in-out infinite;
  }
  .nav-hint .arrows{ font-weight:700; font-size:13px; color:var(--ink) }
  @keyframes navHintPulse{
    0%, 100% { opacity:.35; }
    50% { opacity:1; }
  }
  .tl-message-full{display:none !important} /* штатная англоязычная подсказка про свайп — путает, оставляем свою */
  .tl-timeaxis-minor{display:none !important} /* лишняя мелкая шкала (1931, 1933…) поверх основной — не нужна */

  /* меню прячем, пока не посчитано точное положение под фото — иначе виден скачок.
     если есть кэш с прошлого захода (см. app.js), body.nav-ready ставится сразу и скачка не будет вовсе */
  body[data-page="index"] .site-nav .links{visibility:hidden}
  body[data-page="index"].nav-ready .site-nav .links{visibility:visible}

  @media (max-width:640px){
    .nav-hint{display:none} /* на мобильном полоса теперь не про "пролистать слайды", подсказка не нужна */

    .tl-menubar{display:none !important} /* кнопки zoom/стрелки — не нужны на мобильном */

    /* шкала десятилетий — прячем совсем, год пишем прямо под риской-меткой (см. .ms-yr в JS) */
    .tl-timeaxis{display:none !important}
    .tl-timemarker-content-container{display:none !important} /* флажок с текстом — не нужен, год отдельно под риской */

    .ms-yr{
      position:absolute; top:100%; left:50%; transform:translateX(-50%);
      margin-top:4px; font-size:11px; color:var(--muted); white-space:nowrap; /* nowrap = не обрезается по ширине */
    }
  }

  /* ---------- галочка подтверждения на событии + всплывающая карточка ---------- */
  .ev-badge{
    display:inline-flex; align-items:center; justify-content:center; width:19px; height:19px; border-radius:50%;
    margin-left:7px; cursor:pointer; vertical-align:middle; border:1.5px solid var(--muted); color:var(--muted);
    font-size:11px; line-height:1; background:#fff;
  }
  .ev-badge.confirmed{border-color:var(--confirmed); color:var(--confirmed); background:rgba(51,84,122,.08)}

  .ev-tip{
    display:none; position:fixed; z-index:70; background:#fff; border:1px solid var(--line); border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.14); padding:13px 14px; width:230px; font-size:12.5px; color:var(--ink); line-height:1.4;
  }
  .ev-tip.open{display:block}
  .ev-tip .et-row{margin-bottom:6px}
  .ev-tip .et-row:last-child{margin-bottom:0}
  .ev-tip b{font-weight:700}
  .ev-tip a{color:var(--accent)}
  .et-confirm{
    margin-top:10px; width:100%; background:var(--confirmed); color:#fff; border:none; border-radius:8px;
    padding:7px 0; font-size:12.5px; cursor:pointer; font-family:var(--font-head); font-weight:700;
  }
</style>
</head>
<body data-page="index">

<div id="timeline-embed"></div>
<div class="nav-hint" id="navHint"><span class="hint-text">Используйте стрелки <span class="arrows">← →</span> на клавиатуре</span></div>

<div class="ev-tip" id="evTip">
  <div id="evTipBody"></div>
  <button class="et-confirm" id="etConfirmBtn" style="display:none">Подтвердить</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>
function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}
function escapeAttr(s){
  return String(s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function formatDate(iso){
  if(!iso) return "";
  return new Date(iso).toLocaleDateString("ru-RU", { day:"numeric", month:"long", year:"numeric" });
}
function badgeHtml(e){
  if(e.verification_hidden) return ""; // для очевидных фактов (дата рождения и т.п.) — галочку можно скрыть вручную в базе
  const confirmed = e.status === "confirmed";
  return `<span class="ev-badge${confirmed ? " confirmed" : ""}"` +
    ` data-id="${escapeAttr(e.id)}" data-status="${escapeAttr(e.status)}"` +
    ` data-created-name="${escapeAttr(e.created_by_name || "")}" data-created-at="${escapeAttr(formatDate(e.created_at))}"` +
    ` data-confirmed-name="${escapeAttr(e.confirmed_by_name || "")}" data-confirmed-at="${escapeAttr(formatDate(e.confirmed_at))}"` +
    ` data-source="${escapeAttr(e.source || "")}">✓</span>`;
}

async function loadTimeline(){
  const { data: events, error } = await sb.from("events").select("*").order("event_year");
  if(error){ console.error(error); return; }

  const list = events || [];
  const isMobile = window.innerWidth <= 640;

  const tlEvents = list.map(e => ({
    start_date: { year: String(e.event_year) },
    text: {
      headline: escapeHtml(e.title) + (e.status === "confirmed" ? "" : " · не подтверждено"),
      text: "<p>" + escapeHtml(e.description) + badgeHtml(e) + "</p>"
    }
  }));

  const timelineData = {
    title: {
      media: { url: "photo/main.jpg", caption: "Татьяна Ивановна Хитрова", credit: "" },
      text: {
        headline: "Татьяна Ивановна Хитрова",
        text: "<p>Заслуженный деятель искусств РФ, профессор кафедры хорового дирижирования Санкт-Петербургской государственной консерватории им. Н.А. Римского-Корсакова</p>"
      }
    },
    events: tlEvents.length ? tlEvents : [{
      start_date: { year: "1940" },
      text: { headline: "Пока пусто", text: "<p>События появятся здесь, как только кто-то добавит первую запись.</p>" }
    }]
  };

  document.getElementById("timeline-embed").innerHTML = "";
  window.timeline = new TL.Timeline("timeline-embed", timelineData, {
    language: "ru",
    start_at_end: false,
    timenav_height_percentage: isMobile ? undefined : 20,
    // на мобильном библиотека использует отдельную timenav_mobile_height_percentage (по умолчанию 40%!)
    // вместо обычного процента — без неё timenav_height_min не работает вообще
    timenav_mobile_height_percentage: isMobile ? 5 : undefined,
    timenav_height_min: isMobile ? 90 : undefined
  });

  let firstChange = true;
  window.timeline.on("change", function(){
    if(firstChange){ firstChange = false; return; }
    document.getElementById("navHint").classList.add("hide");
  });

  // на мобильном ось скрыта — подписываем год прямо под каждой риской-меткой события
  if(isMobile){
    setTimeout(() => {
      const ticks = document.querySelectorAll(".tl-timemarker-line-left");
      ticks.forEach((tick, i) => {
        const ev = list[i];
        if(!ev) return;
        tick.style.position = "relative";
        const yr = document.createElement("span");
        yr.className = "ms-yr";
        yr.textContent = ev.event_year;
        tick.appendChild(yr);
      });
    }, 300);
  } else {
    // на десктопе — подгоняем левый край меню точно под левый край фото (не фиксированный отступ у TimelineJS).
    // фото появляется в DOM не сразу (TimelineJS вставляет его асинхронно) — ждём через MutationObserver,
    // а не гадаем с таймером, сколько именно миллисекунд надо; ResizeObserver дальше держит подгонку в синхроне
    const setupAlign = (photo) => {
      if(window.__navAlignObserver) window.__navAlignObserver.disconnect();
      window.__navAlignObserver = new ResizeObserver(alignNavToPhoto);
      window.__navAlignObserver.observe(photo);
      window.__navAlignObserver.observe(document.body);
      // сама картинка может быть в DOM, но ещё без размеров (не догрузилась) — пересчитываем
      // ещё раз по её load, и отдельно когда догрузятся веб-шрифты (они тоже сдвигают текст рядом)
      if(photo.complete) alignNavToPhoto(); else photo.addEventListener("load", alignNavToPhoto, { once: true });
      if(document.fonts && document.fonts.ready) document.fonts.ready.then(alignNavToPhoto);
      alignNavToPhoto();
    };
    const existingPhoto = document.querySelector("#timeline-embed img");
    if(existingPhoto){
      setupAlign(existingPhoto);
    } else {
      const mo = new MutationObserver(() => {
        const photo = document.querySelector("#timeline-embed img");
        if(photo){ mo.disconnect(); setupAlign(photo); }
      });
      mo.observe(document.getElementById("timeline-embed"), { childList: true, subtree: true });
    }
    // страховка: если что-то пошло не так (например, фото не загрузилось) — не держать меню скрытым вечно
    setTimeout(() => document.body.classList.add("nav-ready"), 2500);
  }
}

function alignNavToPhoto(){
  const photo = document.querySelector("#timeline-embed img");
  const links = document.querySelector(".site-nav .links");
  if(!photo || !links) return;
  const left = photo.getBoundingClientRect().left;
  const margin = Math.max(0, Math.round(left) - 20); // -20 = свой паддинг .site-nav
  links.style.marginLeft = margin + "px";
  document.body.classList.add("nav-ready");
  try { localStorage.setItem("navMarginLeft", String(margin)); } catch(e){}
}
window.addEventListener("resize", () => { if(window.innerWidth > 640) alignNavToPhoto(); });

// ---- галочка подтверждения: подсказка + действие модератора ----
const evTip = document.getElementById("evTip");

function showBadgeTip(badge){
  const status = badge.dataset.status;
  const createdName = badge.dataset.createdName;
  const createdAt = badge.dataset.createdAt;
  const confirmedName = badge.dataset.confirmedName;
  const confirmedAt = badge.dataset.confirmedAt;
  const source = badge.dataset.source;

  let html = `<div class="et-row">${createdName ? `Добавил(а): <b>${createdName}</b>` : "Добавлено модератором"}${createdAt ? " · " + createdAt : ""}</div>`;
  if(status === "confirmed"){
    html += `<div class="et-row">Подтвердил(а): <b>${confirmedName || "модератор"}</b>${confirmedAt ? " · " + confirmedAt : ""}</div>`;
  } else {
    html += `<div class="et-row" style="color:var(--muted)">Ждёт подтверждения</div>`;
  }
  if(source){
    const isUrl = /^https?:\/\//.test(source);
    html += `<div class="et-row">Источник: ${isUrl ? `<a href="${source}" target="_blank" rel="noopener">ссылка</a>` : source}</div>`;
  }
  document.getElementById("evTipBody").innerHTML = html;

  const btn = document.getElementById("etConfirmBtn");
  if(typeof myProfile !== "undefined" && myProfile && myProfile.is_moderator && status !== "confirmed"){
    btn.style.display = "block";
    btn.dataset.id = badge.dataset.id;
  } else {
    btn.style.display = "none";
  }

  const r = badge.getBoundingClientRect();
  const left = Math.min(Math.max(8, r.left), window.innerWidth - 246);
  evTip.style.left = left + "px";
  evTip.style.top = (r.bottom + 8) + "px";
  evTip.classList.add("open");
}

let tipHideTimer = null;
function cancelHideTip(){ clearTimeout(tipHideTimer); }
function scheduleHideTip(){
  clearTimeout(tipHideTimer);
  tipHideTimer = setTimeout(() => evTip.classList.remove("open"), 180);
}

document.getElementById("timeline-embed").addEventListener("mouseover", e => {
  const badge = e.target.closest(".ev-badge");
  if(badge){ cancelHideTip(); showBadgeTip(badge); }
});
document.getElementById("timeline-embed").addEventListener("mouseout", e => {
  const badge = e.target.closest(".ev-badge");
  if(badge) scheduleHideTip();
});
evTip.addEventListener("mouseover", cancelHideTip);
evTip.addEventListener("mouseout", scheduleHideTip);

document.getElementById("timeline-embed").addEventListener("click", e => {
  const badge = e.target.closest(".ev-badge");
  if(badge){ e.stopPropagation(); cancelHideTip(); showBadgeTip(badge); }
});
document.addEventListener("click", e => {
  if(!e.target.closest(".ev-tip") && !e.target.closest(".ev-badge")) evTip.classList.remove("open");
});

document.getElementById("etConfirmBtn").addEventListener("click", async () => {
  const id = document.getElementById("etConfirmBtn").dataset.id;
  const { error } = await sb.from("events").update({
    status: "confirmed",
    confirmed_by: currentUser.id,
    confirmed_by_name: myProfile.full_name,
    confirmed_at: new Date().toISOString()
  }).eq("id", id);
  if(error){ alert("Не получилось подтвердить: " + error.message); return; }
  evTip.classList.remove("open");
  loadTimeline();
});

window.onEventAdded = loadTimeline;
loadTimeline();
</script>
</body>
</html>
