<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Татьяна Ивановна Хитрова — сайт памяти</title>
<link title="timeline-styles" rel="stylesheet" href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css">
<script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  html,body{height:100%; overflow-x:hidden}
  #timeline-embed{width:100%; height:calc(100dvh - 44px)}
  .nav-hint{
    position:fixed; right:20px; bottom:22%;
    font-size:11.5px; color:var(--muted); background:#fff; padding:5px 13px; border:1px solid var(--line);
    border-radius:20px; z-index:15; opacity:1; transition:opacity .8s ease; pointer-events:none;
  }
  .nav-hint.hide{opacity:0}
  .tl-message-full{display:none !important} /* штатная англоязычная подсказка про свайп — путает, оставляем свою */

  @media (max-width:640px){
    .nav-hint{display:none} /* на мобильном полоса теперь не про "пролистать слайды", подсказка не нужна */

    .tl-menubar{display:none !important} /* кнопки zoom/стрелки — не нужны на мобильном */

    /* шкала десятилетий — прячем совсем, год теперь показывает сам флажок-метка (см. ниже) */
    .tl-timeaxis{display:none !important}

    /* флажок-метка события — как в оригинале, только текст внутри теперь год (не название),
       поэтому можно сильно ужать под уже заданную высоту полосы, не трогая timenav_height_min */
    .tl-timemarker-content{padding:3px 7px !important}
    .tl-timemarker-text{padding:0 !important}
    .tl-timemarker-text .tl-headline{
      font-size:11px !important; line-height:1.2 !important; margin:0 !important; white-space:nowrap !important;
    }
  }
</style>
</head>
<body data-page="index">

<div id="timeline-embed"></div>
<div class="nav-hint" id="navHint">← → пролистать, или клик по краям экрана</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>
function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

async function loadTimeline(){
  const { data: events, error } = await sb.from("events").select("*").order("event_year");
  if(error){ console.error(error); return; }

  const list = events || [];
  const isMobile = window.innerWidth <= 640;

  const tlEvents = list.map(e => ({
    start_date: { year: String(e.event_year) },
    text: {
      headline: escapeHtml(e.title) + (e.status === "confirmed" ? "" : " · не подтверждено"),
      text: "<p>" + escapeHtml(e.description) + "</p>"
    }
  }));

  const timelineData = {
    title: {
      media: { url: "photo/main.jpg", caption: "Татьяна Ивановна Хитрова", credit: "" },
      text: {
        headline: "Татьяна Ивановна Хитрова",
        text: "<p>Сайт памяти любимого учителя</p><p>Заслуженный деятель искусств РФ, профессор кафедры хорового дирижирования Санкт-Петербургской государственной консерватории им. Н.А. Римского-Корсакова</p>"
      }
    },
    events: tlEvents.length ? tlEvents : [{
      start_date: { year: "1940" },
      text: { headline: "Пока пусто", text: "<p>События появятся здесь, как только кто-то добавит первую запись.</p>" }
    }]
  };

  document.getElementById("timeline-embed").innerHTML = "";
  window.timeline = new TL.Timeline("timeline-embed", timelineData, {
    language: "ru",
    start_at_end: false,
    timenav_height_percentage: isMobile ? undefined : 20,
    // на мобильном библиотека использует отдельную timenav_mobile_height_percentage (по умолчанию 40%!)
    // вместо обычного процента — без неё timenav_height_min не работает вообще
    timenav_mobile_height_percentage: isMobile ? 5 : undefined,
    timenav_height_min: isMobile ? 90 : undefined
  });

  let firstChange = true;
  window.timeline.on("change", function(){
    if(firstChange){ firstChange = false; return; }
    document.getElementById("navHint").classList.add("hide");
  });

  // на мобильном ось скрыта — во флажке-метке события показываем год вместо названия
  // (сам флажок остаётся как в оригинале, меняется только текст внутри)
  if(isMobile){
    setTimeout(() => {
      const flags = document.querySelectorAll(".tl-timemarker-text");
      flags.forEach((flag, i) => {
        const ev = list[i];
        if(!ev) return;
        flag.textContent = String(ev.event_year);
      });
    }, 300);
  }
}

window.onEventAdded = loadTimeline;
loadTimeline();
</script>
</body>
</html>
