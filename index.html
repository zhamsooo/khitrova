<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Татьяна Ивановна Хитрова — сайт памяти</title>
<link title="timeline-styles" rel="stylesheet" href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css">
<script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  html,body{height:100%; overflow-x:hidden}
  #timeline-embed{width:100%; height:calc(100dvh - 44px)}
  .nav-hint{
    position:fixed; right:20px; bottom:22%;
    font-size:11.5px; color:var(--muted); background:#fff; padding:5px 13px; border:1px solid var(--line);
    border-radius:20px; z-index:15; opacity:1; transition:opacity .8s ease; pointer-events:none;
  }
  .nav-hint.hide{opacity:0}
  /* штатная подсказка TimelineJS про свайп — путает (не переводится, стрелка не туда), прячем и оставляем свою */
  .tl-message-full{display:none !important}

  .tl-mini-wrap{position:relative}
  @media (max-width:640px){
    /* фото и текст — в полный размер, сужаем только полосу с годами внизу (задаётся в JS через timenav_height_percentage) */
    .nav-hint{right:10px; bottom:10px; font-size:10px}
  }
</style>
</head>
<body data-page="index">

<div class="tl-mini-wrap" id="tlMiniWrap">
  <div id="timeline-embed"></div>
  <div class="nav-hint" id="navHint">← → пролистать, или клик по краям экрана</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>
function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

async function loadTimeline(){
  const { data: events, error } = await sb.from("events").select("*").order("event_year");
  if(error){ console.error(error); return; }

  const list = events || [];

  // события — от пользователей, экранируем перед вставкой в HTML
  const tlEvents = list.map(e => ({
    start_date: { year: String(e.event_year) },
    text: {
      headline: escapeHtml(e.title) + (e.status === "confirmed" ? "" : " · не подтверждено"),
      text: "<p>" + escapeHtml(e.description) + "</p>"
    }
  }));

  const timelineData = {
    title: {
      media: { url: "photo/main.jpg", caption: "Татьяна Ивановна Хитрова", credit: "" },
      text: {
        headline: "Татьяна Ивановна Хитрова",
        text: "<p>Сайт памяти любимого учителя</p><p>Заслуженный деятель искусств РФ, профессор кафедры хорового дирижирования Санкт-Петербургской государственной консерватории им. Н.А. Римского-Корсакова</p>"
      }
    },
    events: tlEvents.length ? tlEvents : [{
      start_date: { year: "1940" },
      text: { headline: "Пока пусто", text: "<p>События появятся здесь, как только кто-то добавит первую запись.</p>" }
    }]
  };

  document.getElementById("timeline-embed").innerHTML = "";
  window.timeline = new TL.Timeline("timeline-embed", timelineData, {
    language: "ru",
    start_at_end: false,
    // на телефоне фото и текст должны остаться читаемого размера — сужаем только полосу с годами
    timenav_height_percentage: window.innerWidth <= 640 ? 9 : 20
  });

  // подсказку прячем только когда человек реально перешёл со стартового слайда
  let firstChange = true;
  window.timeline.on("change", function(){
    if(firstChange){ firstChange = false; return; }
    document.getElementById("navHint").classList.add("hide");
  });
}

window.onEventAdded = loadTimeline;
loadTimeline();
</script>
</body>
</html>
