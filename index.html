<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Татьяна Ивановна Хитрова — сайт памяти</title>
<link title="timeline-styles" rel="stylesheet" href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css">
<script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>
<style>
  :root{
    --paper:#fafaf8; --ink:#22252a; --muted:#878d96; --line:#e4e2dc; --accent:#33507a; --warn:#a4641f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,"SF Pro Text","Segoe UI",sans-serif;background:#fff;color:var(--ink)}

  .site-nav{
    height:44px; display:flex; align-items:center; justify-content:center;
    padding:0 20px; position:relative; z-index:20; background:#fff; border-bottom:1px solid var(--line);
  }
  .site-nav .links{display:flex; gap:32px; align-items:center}
  .site-nav .links a{
    color:#999; text-decoration:none; font-size:12px; letter-spacing:.04em;
    text-transform:uppercase; padding:4px 0; border-bottom:1px solid transparent;
  }
  .site-nav .links a.active{color:var(--ink); border-bottom-color:var(--ink)}
  .site-nav .links a:hover{color:var(--ink)}
  .nav-right{position:absolute; right:20px; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:16px}
  .nav-right .who{font-size:12px; color:var(--muted)}
  .add-wrap{position:relative}
  .add-wrap .add-link, .auth-link{
    background:none; border:none; color:#999; cursor:pointer;
    font-size:12px; letter-spacing:.04em; text-transform:uppercase;
    padding:4px 0; font-family:inherit;
  }
  .add-wrap .add-link:hover, .add-wrap .add-link.open, .auth-link:hover{color:var(--ink)}

  #timeline-embed{width:100%; height:calc(100vh - 44px)}

  .dropdown{
    display:none; position:absolute; top:calc(100% + 10px); right:0;
    background:#fff; border:1px solid var(--line); border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.08); width:260px; padding:6px; z-index:50;
  }
  .dropdown.open{display:block}
  .dropdown .opt{
    display:block; width:100%; text-align:left; background:none; border:none;
    border-radius:7px; padding:9px 10px; cursor:pointer; font:inherit;
  }
  .dropdown .opt:hover{background:#f7f6f3}
  .dropdown .opt .t{font-weight:600; font-size:12.5px; color:var(--ink)}
  .dropdown .opt .d{font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.35}
  .dropdown .opt + .opt{border-top:1px solid #f0efec}

  /* модалки */
  .overlay{position:fixed; inset:0; background:rgba(20,20,24,.45); z-index:60; display:none; align-items:center; justify-content:center}
  .overlay.open{display:flex}
  .modal{background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 24px; width:340px; max-width:90vw; position:relative}
  .modal h2{font-family:Georgia,serif; font-weight:400; font-size:17px; margin:0 0 14px}
  .modal label{display:block; font-size:12px; color:var(--muted); margin:12px 0 5px}
  .modal input, .modal select, .modal textarea{
    width:100%; background:var(--paper); border:1px solid var(--line); color:var(--ink);
    padding:9px 10px; border-radius:8px; font:inherit; font-size:13px;
  }
  .modal textarea{resize:vertical; min-height:60px}
  .modal .row-actions{display:flex; justify-content:flex-end; margin-top:18px}
  .modal .hint{font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.4}
  .modal .err{color:#b0413e; font-size:12px; margin-top:8px; display:none}
  .modal button.primary{
    background:var(--ink); color:#fff; border:none; padding:8px 16px; border-radius:20px;
    font-size:12.5px; cursor:pointer; font-family:inherit;
  }
  .modal .close{position:absolute; top:12px; right:14px; border:none; background:none; color:var(--muted); font-size:18px; cursor:pointer}
</style>
</head>
<body>

<header class="site-nav">
  <nav class="links">
    <a href="#" class="active">Линия жизни</a>
    <a href="#" onclick="alert('Раздел «Наследие» — следующая волна'); return false;">Наследие</a>
    <a href="#" onclick="alert('Раздел «Люди» — следующая волна'); return false;">Люди</a>
  </nav>
  <div class="nav-right">
    <span class="who" id="whoami" style="display:none"></span>
    <div class="add-wrap">
      <button class="add-link" id="addBtn">+ Добавить материал</button>
      <div class="dropdown" id="addDropdown">
        <button class="opt" id="optEvent">
          <div class="t">Событие на линию жизни</div>
          <div class="d">Дата, место, что произошло — появится на таймлайне</div>
        </button>
        <button class="opt" id="optOther">
          <div class="t">Фото / статья / воспоминание</div>
          <div class="d">Появится в следующей волне сайта</div>
        </button>
      </div>
    </div>
    <button class="auth-link" id="btnAuth">Войти</button>
  </div>
</header>

<div id="timeline-embed"></div>

<!-- вход -->
<div class="overlay" id="authOverlay">
  <div class="modal">
    <button class="close" data-close>×</button>
    <div id="stepEmail">
      <h2>Войти / зарегистрироваться</h2>
      <label>Email</label>
      <input type="email" id="inEmail" placeholder="you@example.com" autocomplete="email">
      <div class="hint">На почту придёт код подтверждения. Если ты здесь впервые — дальше попросим представиться.</div>
      <div class="err" id="errEmail"></div>
      <div class="row-actions"><button class="primary" id="btnSendCode">Получить код</button></div>
    </div>
    <div id="stepCode" style="display:none">
      <h2>Код из письма</h2>
      <label>6 цифр</label>
      <input type="text" id="inCode" inputmode="numeric" maxlength="12" placeholder="12345678">
      <div class="err" id="errCode"></div>
      <div class="row-actions"><button class="primary" id="btnVerifyCode">Подтвердить</button></div>
    </div>
    <div id="stepProfile" style="display:none">
      <h2>Представься</h2>
      <label>Имя и фамилия</label>
      <input type="text" id="inName" placeholder="Имя Фамилия">
      <label>Кем приходишься Т.И.?</label>
      <select id="inRelation">
        <option value="ученик">Ученик(ца)</option>
        <option value="коллега">Коллега</option>
        <option value="другое">Другое</option>
      </select>
      <div id="gradYearWrap">
        <label>Год выпуска</label>
        <input type="number" id="inGradYear" placeholder="например, 1998" min="1955" max="2026">
      </div>
      <div class="err" id="errProfile"></div>
      <div class="row-actions"><button class="primary" id="btnSaveProfile">Готово</button></div>
    </div>
  </div>
</div>

<!-- добавление события -->
<div class="overlay" id="addOverlay">
  <div class="modal">
    <button class="close" data-close>×</button>
    <h2>Добавить событие на таймлайн</h2>
    <label>Год</label>
    <input type="number" id="evYear" placeholder="например, 1962" min="1940" max="2026">
    <label>Что произошло</label>
    <input type="text" id="evTitle" placeholder="Короткое название события">
    <label>Подробности (необязательно)</label>
    <textarea id="evDesc" placeholder="Пара предложений — что было, откуда знаешь"></textarea>
    <div class="err" id="errEvent"></div>
    <div class="hint">Появится на таймлайне с пометкой «не подтверждено», пока модератор не проверит.</div>
    <div class="row-actions"><button class="primary" id="btnSubmitEvent">Отправить</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://vvcxnqqyuvakrcmkmhjq.supabase.co";
const SUPABASE_KEY = "sb_publishable_SMTkWj9fHPpUG3e9arN3tg_knlaKKfp";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

function open_(id){ document.getElementById(id).classList.add("open"); }
function close_(id){ document.getElementById(id).classList.remove("open"); }
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", e => close_(e.target.closest(".overlay").id)));

function resetAuthModal(){
  document.getElementById("stepEmail").style.display = "block";
  document.getElementById("stepCode").style.display = "none";
  document.getElementById("stepProfile").style.display = "none";
  document.getElementById("errEmail").style.display = "none";
  document.getElementById("errCode").style.display = "none";
  document.getElementById("errProfile").style.display = "none";
}

document.getElementById("btnAuth").addEventListener("click", () => { resetAuthModal(); open_("authOverlay"); });

// меню "+ добавить материал"
const addBtn = document.getElementById("addBtn");
const dropdown = document.getElementById("addDropdown");
addBtn.addEventListener("click", e => { e.stopPropagation(); dropdown.classList.toggle("open"); addBtn.classList.toggle("open"); });
document.addEventListener("click", () => { dropdown.classList.remove("open"); addBtn.classList.remove("open"); });
document.getElementById("optOther").addEventListener("click", e => { e.stopPropagation(); alert("Фото / статьи / воспоминания — следующая волна сайта."); dropdown.classList.remove("open"); });
document.getElementById("optEvent").addEventListener("click", e => {
  e.stopPropagation();
  dropdown.classList.remove("open");
  if(!currentUser){ resetAuthModal(); open_("authOverlay"); return; }
  open_("addOverlay");
});

document.getElementById("inRelation").addEventListener("change", e => {
  document.getElementById("gradYearWrap").style.display = e.target.value === "ученик" ? "block" : "none";
});

let pendingEmail = null;

document.getElementById("btnSendCode").addEventListener("click", async () => {
  const email = document.getElementById("inEmail").value.trim();
  const errEl = document.getElementById("errEmail");
  if(!email || !email.includes("@")){ errEl.textContent = "Введи нормальный email"; errEl.style.display = "block"; return; }
  errEl.style.display = "none";
  pendingEmail = email;
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
  if(error){ errEl.textContent = error.message; errEl.style.display = "block"; return; }
  document.getElementById("stepEmail").style.display = "none";
  document.getElementById("stepCode").style.display = "block";
});

document.getElementById("btnVerifyCode").addEventListener("click", async () => {
  const token = document.getElementById("inCode").value.trim();
  const errEl = document.getElementById("errCode");
  const { data, error } = await sb.auth.verifyOtp({ email: pendingEmail, token, type: "email" });
  if(error){ errEl.textContent = "Неверный или устаревший код"; errEl.style.display = "block"; return; }
  currentUser = data.user;
  const { data: profile } = await sb.from("profiles").select("*").eq("id", currentUser.id).maybeSingle();
  if(profile){ close_("authOverlay"); onLoggedIn(profile); }
  else{
    document.getElementById("stepCode").style.display = "none";
    document.getElementById("stepProfile").style.display = "block";
  }
});

document.getElementById("btnSaveProfile").addEventListener("click", async () => {
  const full_name = document.getElementById("inName").value.trim();
  const relation_type = document.getElementById("inRelation").value;
  const gradRaw = document.getElementById("inGradYear").value;
  const study_end = relation_type === "ученик" && gradRaw ? parseInt(gradRaw, 10) : null;
  const errEl = document.getElementById("errProfile");
  if(!full_name){ errEl.textContent = "Укажи имя и фамилию"; errEl.style.display = "block"; return; }
  const { data: profile, error } = await sb.from("profiles").insert({ id: currentUser.id, full_name, relation_type, study_end }).select().single();
  if(error){ errEl.textContent = error.message; errEl.style.display = "block"; return; }
  close_("authOverlay");
  onLoggedIn(profile);
});

function onLoggedIn(profile){
  document.getElementById("whoami").textContent = profile.full_name;
  document.getElementById("whoami").style.display = "inline";
  document.getElementById("btnAuth").textContent = "Выйти";
}

document.getElementById("btnAuth").addEventListener("click", async function(){
  if(currentUser){ await sb.auth.signOut(); currentUser = null; location.reload(); }
});

document.getElementById("btnSubmitEvent").addEventListener("click", async () => {
  const event_year = parseInt(document.getElementById("evYear").value, 10);
  const title = document.getElementById("evTitle").value.trim();
  const description = document.getElementById("evDesc").value.trim();
  const errEl = document.getElementById("errEvent");
  if(!event_year || !title){ errEl.textContent = "Заполни год и название"; errEl.style.display = "block"; return; }
  errEl.style.display = "none";
  const { error } = await sb.from("events").insert({ event_year, title, description, created_by: currentUser.id });
  if(error){ errEl.textContent = error.message; errEl.style.display = "block"; return; }
  close_("addOverlay");
  document.getElementById("evYear").value = "";
  document.getElementById("evTitle").value = "";
  document.getElementById("evDesc").value = "";
  loadTimeline();
});

sb.auth.onAuthStateChange(async (event, session) => {
  if(session && session.user){
    currentUser = session.user;
    const { data: profile } = await sb.from("profiles").select("*").eq("id", currentUser.id).maybeSingle();
    if(profile) onLoggedIn(profile);
  }
});

// ---- таймлайн из Supabase, рендер через TimelineJS3 ----
async function loadTimeline(){
  const { data: events, error } = await sb.from("events").select("*").order("event_year");
  if(error){ console.error(error); return; }

  const tlEvents = (events || []).map(e => ({
    start_date: { year: String(e.event_year) },
    text: {
      headline: e.title + (e.status === "confirmed" ? "" : " · не подтверждено"),
      text: "<p>" + (e.description || "") + "</p>"
    }
  }));

  const timelineData = {
    title: {
      text: {
        headline: "Татьяна Ивановна Хитрова",
        text: "<p>Заслуженный деятель искусств РФ, профессор кафедры хорового дирижирования Санкт-Петербургской государственной консерватории им. Н.А. Римского-Корсакова. Таймлайн пополняют ученики — ниже могут быть неподтверждённые записи.</p>"
      }
    },
    events: tlEvents.length ? tlEvents : [{
      start_date: { year: "1940" },
      text: { headline: "Пока пусто", text: "<p>События появятся здесь, как только кто-то добавит первую запись.</p>" }
    }]
  };

  document.getElementById("timeline-embed").innerHTML = "";
  window.timeline = new TL.Timeline("timeline-embed", timelineData, {
    language: "ru",
    start_at_end: false,
    timenav_height_percentage: 20
  });
}

loadTimeline();
</script>
</body>
</html>
